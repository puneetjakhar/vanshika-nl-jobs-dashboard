nsumer electronics that make a real impact.  \n\nAt Fairphone, you will find a supportive and safe space where everyone can be themselves, collaborate openly, and have the freedom to learn and grow \\- because that’s how we innovate and drive change together!  \n\nSo… are you a proactive, self\\-motivated team player who loves taking initiative and bringing positive energy? Do you thrive in a fast\\-moving start\\-up or scale\\-up environment? Are you a great communicator who values collaboration and embraces different perspectives? And most importantly, do you feel a strong connection to Fairphone’s mission and values? If you're nodding along and thinking, “Yes, that’s me!”, then check out our vacancy below!  \n\n  \n\nPlease know that we acknowledge that we are living in a time where the use of AI can bring many efficiencies and support. However, we want to know the real YOU. Please try to limit the use of AI tools to generate answers to the application; we value authenticity and encourage you to use your creativity!  \n\n  \n\nPlease note: You must be enrolled in a university or study program for the entire duration of this internship.\n\n* Location: Amsterdam\n* Hours: 24 hours per week / 3 days (2 days in the office, 1 day working from home)\n* Start: As soon as possible\n* Contract duration: 6 months\n* Deadline to apply: We review applications on a rolling basis. Please apply as soon as possible.\n\n#### **About your role**\n\n\nWe are looking for a highly motivated, analytical, and detail\\-oriented Finance Intern to join our dynamic international team in Amsterdam. This internship offers a unique opportunity to gain hands\\-on experience within a fast\\-growing, mission\\-driven scale\\-up while contributing directly to meaningful business operations and impact.  \n\nAs part of the Finance team, you will work closely with colleagues across accounting, operations, and business functions to support day\\-to\\-day financial activities and help ensure the smooth running of our organization. You will gain practical exposure to financial processes, reporting, and operational finance in an innovative company that combines commercial growth with social and environmental impact.  \n\nThis role is ideal for someone eager to learn, take ownership, and develop a strong foundation in corporate finance and accounting within an international business environment.\n\n#### **Key Responsibilities \\& Objectives**\n\n**Your Key Responsibilities**\n\n* Process supplier invoices, employee expenses, and payment requests accurately and on time.\n* Support accounts payable and receivable activities.\n* Maintain organized financial records and documentation.\n* Collaborate with internal stakeh", "source": "indeed"}, {"company": "Sensys Gatso Group", "job_title": "Software Engineer Intern (student with Hardware Focus)", "location": "Haarlem, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Sensys-Gatso-Group", "job_url": "https://nl.indeed.com/viewjob?jk=5b27f96ce5be590a", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-27", "recruiter_email": null, "applicant_count": null, "description": "**Software Engineer Intern (Hardware Focus)**\n\n\nAt Sensys Gatso, we are passionate about saving lives by changing traffic behavior. As the world market leader in traffic enforcement solutions, our goal is simple: to make roads safer for everyone. We're not just building products; we're using technology to create a better world.\n\n\nWe are looking for an ambitious and talented **Software Engineer Intern** with a strong interest in hardware to join our engineering team in Haarlem. This is a unique opportunity to work at the intersection of software and hardware, directly impacting the performance and capabilities of our life\\-saving products. Your work will involve developing, optimizing, and testing the software that powers our advanced traffic enforcement systems, ensuring they are as efficient and effective as possible. This internship is a chance to grow professionally, learn from experienced engineers, and see your work deployed in real\\-world solutions that make a difference.\n\n\nYour project(s) will be hands\\-on, challenging, and directly contribute to our mission of creating safer roads. You will have the opportunity to choose a project that aligns with your interests and skills:\n\n* Firmware and Driver Development: Dive deep into our hardware platform. You'll work on developing and enhancing the firmware and drivers that control these components, ensuring seamless communication and operation.\n* System Performance and Optimization: Analyze and optimize the performance of our existing software on our embedded systems. Your goal will be to maximize the efficiency of our products, reduce latency, and ensure our systems can handle the demands of real\\-time traffic monitoring.\n* Hardware Abstraction Layer (HAL) Enhancement: Contribute to the development of our HAL, the critical software layer that allows our applications to interact with the hardware. You'll work on creating a more robust and flexible HAL to support new features and future hardware platforms.\n* Automated Hardware Testing and Validation: Design and implement automated testing procedures to validate the performance and reliability of our hardware and software. Your work will ensure our products meet the highest standards of quality and accuracy.\n\n**What We're Looking For**\n\n* Currently pursuing a degree in Computer Science, Computer Engineering, Electrical Engineering, or a related field.\n* Proficiency in at least one of the following: Golang, C\\+\\+, or Python. .\n* Not been shy for embed\\- and/or linux\\-based operating systems\n* Basic understanding of computer architecture and embedded systems.\n* A passion for working with hardware and low\\-level software.\n* A proactive and problem\\-solving mindset.\n* Excellent communication and teamwork skills.\n\n\nRequirements\n\n* Bachelor or Master Technical **(students only)**\n* Office attendence at our Haarlem office in the Netherlands (**so you are already live in the Netherlands**)\n\nAre you ready to use your skills to build a safer world? We want t", "source": "indeed"}, {"company": "ASML", "job_title": "Industrial Engineering Internship: Supply Chain Cost & Workforce Planning", "location": "Veldhoven, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Asml", "job_url": "https://nl.indeed.com/viewjob?jk=0fb6df8b16e336e5", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-27", "recruiter_email": null, "applicant_count": null, "description": "**Introduction**\n----------------\n\nAs a Supply Chain Cost \\& Workforce Planning Intern, you will join the Customer Supply Chain Management (CSCM) Central Cost team. You will help structure how headcount supports customer operations and will analyze differences across regions and translate insights into a clear model. This internship contributes to better planning, benchmarking, and cost efficiency across global sites.\n\n\n**Your Assignment**\n-------------------\n\nIn this assignment, you will collaborate closely with central CSCM teams and regional stakeholders to thoroughly analyze the regional headcount structure. The main objective is to assess the current structure and identify activities at each site, with the aim of enhancing transparency. Using these insights, you will develop a regional headcount blueprint based on identified drivers, providing a foundation for comparing sites, improving cost efficiency, and supporting planning for new sites. Your main responsibilities will be:\n\n\n* Map headcount structures and activities per region or country.\n* Identify key drivers, processes, and stakeholders linked to workforce planning.\n* Analyze inefficiencies and key differences in headcount structures across regions and countries.\n* Propose improvements to increase cost transparency and consistency.\n* Propose a blueprint for the regional headcount structure based on operational drivers and activities performed.\n* Develop a calculating model to estimate required headcount according to the proposed blueprint.\n* Document insights and deliver recommendations for implementation\n\nThis is a bachelor and master internship for minimum 5 months, minimum 4\\-5 days per week (3 days on\\-site). The start date of this internship is as of August or September 2026\\.\n\n\n**Your Profile**\n----------------\n\n**To be suitable for the internship, you** :\n\n\n* Are studying for a bachelor's or master’s degree in industrial engineering, supply chain management, business administration, or a related field.\n* Have an interest in cost analysis, process mapping, and efficiency analysis.\n* Have strong analytical skills; experience with data analysis tools such as Excel or Power BI is a plus.\n* Communicate clearly and collaborate effectively with different stakeholders.\n* Show independence, and a proactive, 'can do' attitude.\n\n**Other requirements you need to meet:**\n\n* You are enrolled at an educational institute for the entire duration of the internship ;\n* Attach your cover letter with a clear motivation why you are interested in this internship assignment in particular;\n* You need to be located in the Netherlands to perform your internship. In case you are currently living/studying outside of the Netherlands, your CV/motivation letter needs to include the willingness to relocate.\n* If you are a non\\-EU citizen, studying in the Netherlands, your university is willing to sign the documents relevant for doing an internship (i.e., Nuffic agreement).\n\n**Inclusion and diversity**\n--------", "source": "indeed"}, {"company": "Vlisco Netherlands B.V.", "job_title": "Internship Archives & Collections", "location": "Helmond, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Vlisco-Netherlands-B.v.-3", "job_url": "https://nl.indeed.com/viewjob?jk=50074370fabf31d4", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": null, "applicant_count": null, "description": "Vlisco possesses one of the largest single textile archives in the world, with more than 350,000 wax prints and hundreds of sample books dating back to the early 1800s, tracing a transcontinental history of textiles. The brand also holds a rich chronicle of cultural icons connected to its fabrics, from historic figures such as Nelson Mandela, Miriam Makeba, and The Beatles, to artists such as Kehinde Wiley, Seydou Keïta, and Yinka Shonibare.\n\n\nVlisco is in the process of elevating its Archive into a creative engine room that fuels design innovation, deepens brand storytelling, and enhances its global cultural presence. To support this process, we are looking for a curious, research\\-oriented, and hands\\-on Archive \\& Collections Intern with an interest in cultural heritage.\n\n **KEY RESPONSIBILITIES:**\n\n* Conducting research related to the history, cultural context, and legacy of Vlisco;\n* Supporting the digitization, registration, and data entry of the collection;\n* Assisting with internal and external research requests;\n* Contributing to both long\\-term research projects and day\\-to\\-day archive activities;\n* Providing general daily support to the Archive Manager and Archive Coordinator;\n* Reporting: summarising research findings and formulating clear, practical recommendations.\n\n **QUALIFICATIONS:**\n\n* Currently enrolled in a programme in Art History, Cultural Studies, Museology, or a related field;\n* Strong interest in research, archives, collections, and cultural heritage;\n* Proficiency in Dutch and English (written and spoken); additional languages are a plus;\n* Hands\\-on, proactive, and willing to support daily archive operations;\n* Accurate and methodical working style, especially when handling collection data;\n* Good communication skills, both written and oral;\n* Ability to work independently as well as collaboratively within a small team;\n* Basic experience with digital tools (e.g. databases, Excel, collection systems) is a plus.\n\n **IN RETURN WE OFFER YOU:**  \n\nThe conditions that apply to you as an intern are listed below:\n\n* A challenging and educational internship of 16 weeks or longer;\n* An internship allowance of €450 per month based on 32–40 hours (pro rata);\n* A workplace located in the center of Helmond, within walking distance of the train station;\n* The opportunity to gain hands\\-on experience in one of the Europe’s most significant textile archives;\n* A highly creative working environment and involvement in meaningful cultural projects;\n* Guidance / supervision.", "source": "indeed"}, {"company": "ASML", "job_title": "Business Engineering Internship: AI & Data‑Driven Operations", "location": "Veldhoven, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Asml", "job_url": "https://nl.indeed.com/viewjob?jk=7b8f5ef7df7d6def", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": null, "applicant_count": null, "description": "**Introduction**\n----------------\n\nAre you passionate about AI, data, and improving how organizations operate?\n  \n\nDo you want hands‑on experience in applying AI to real, high‑impact business challenges?\n\n\nAs a Business Engineering Intern – AI \\& Data‑Driven Operations, you will work in a high‑tech operational environment where data, performance, and decision‑making are critical. You will not only analyze problems, but also build practical AI and analytics solutions that are used by real teams.\n\n\n**Your assignment**\n-------------------\n\nYou will join the Business Engineering team within Operational Excellence. The team supports operational organizations by:\n\n\n* Driving data‑driven decision‑making\n* Designing and improving performance management systems\n* Supporting resource planning and operational efficiency\n\nThe main challenge of the team is to translate complex operational problems into clear insights and actions, while dealing with large datasets, multiple stakeholders, and increasing complexity. AI and advanced analytics are key enablers to scale this work effectively.\n\n\nDuring this internship, you will work on AI‑focused Business Engineering projects, such as:\n\n\n* Applying AI or machine learning to forecasting, scenario analysis, or prioritization problems.\n* Automating (parts of) recurring analyses or reports.\n* Developing smart decision‑support tools or dashboards enhanced by AI.\n* Experimenting with AI copilots or advanced analytics use cases for operations.\n\nYou will:\n\n\n* Define problem statements together with the team\n* Translate business questions into data and AI solutions\n* Build, test, and iterate on prototypes\n* Present insights and recommendations to stakeholders\n* Have exposure to both business and technical perspectives\n* Enjoy freedom to experiment with AI in a structured environment\n* Get coaching by experienced Business Engineers\n\nThis is a bachelor's or master's internship for a minimum of 5\\-6 months, 4\\-5 days per week (4 days on‑site). The start date of this internship is as of September 2026, with some flexibility.\n\n\n**Your profile**\n----------------\n\n**To be suitable for the internship, you:**\n\n* Are a Master’s or final‑year Bachelor student, preferably in Industrial Engineering, Business Administration, Data Science, Operations Management, Applied Mathematics, Engineering or a related field.\n* Have an interest in AI, machine learning, or advanced analytics.\n* Have a strong analytical mindset and have the ability to structure complex problems.\n* Have experience with data analysis tools (e.g. Python, R, SQL, Power BI, Excel).\n* Are curious, proactive, and comfortable working with ambiguity.\n* Can clearly communicate complex analyses and insights.\n* Are an optimistic team player who collaborates effectively with others.\n\n**Other requirements you need to meet:**\n\n* You are enrolled at an educational institute for the entire duration of the internship ;\n* Attach your cover letter with a clear motivation why you are intere", "source": "indeed"}, {"company": "XITE", "job_title": "Product Design Intern", "location": "Amsterdam Noord, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Xite", "job_url": "https://nl.indeed.com/viewjob?jk=799f68f56e258ddd", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": null, "applicant_count": null, "description": "We are looking for an enthusiastic intern to help support our operations, learn from our experts, and contribute to the future of music videos.\n\n\nAs a Design Intern, you will play a key role in our daily work while gaining practical experience across all stages of product design.\n\n\n### **About XITE**\n\n\nIt’s our mission to share our passion for music videos with the world and invite people to experience music beyond listening: to **see your music.** XITE is dedicated to building the best music video experience in the world. Based in Amsterdam, XITE now reaches 100 million households across North America and Europe.\n\n  \n\nXITE delivers premium music video experiences across four core products:\n\n**Global \\& International (Europe \\& North America)**\n\n* FAST (Free Ad\\-Supported Streaming TV): This rapidly growing global market offers themed music channels directly on smart TVs. Across Europe and North America, XITE is available with 26 different genre\\- and decade\\-based channels.\n* Interactive TV App: Available on smart TVs in various countries throughout Europe and North America, this app features over 200 curated playlists for a personalized viewing experience.\n\n**The Netherlands**\n\n* Linear Television: This is where the brand began in 2008\\. It is available specifically in the Netherlands through all major Dutch cable and fiber providers.\n* XITE Music: A comprehensive collection of 51 non\\-stop audio channels, available exclusively for listeners in the Netherlands.\n\n### **About the role and the team**\n\n\nAt XITE, our design team is small but mighty. Consisting of a Head of Product Design and two Product Designers, we pride ourselves on being highly strategic and holistic thinkers. We focus heavily on the *\"why\"* and the *\"what\"* before diving into the *\"how.\"* When you join us, you won't be working in a silo. We collaborate across all departments and work closely with the executive team to shape the entire product lifecycle. We are looking for an enthusiastic intern to help support our operations, learn from our experts, and contribute to the future of music videos.\n\n### **Responsibilities**\n\n\nAs a Design Intern, you will play a key role in our daily work while gaining practical experience across all stages of product design. We are fully committed to supporting your education and will work with you to fulfill any academic requirements. Your responsibilities will include:\n\n* **Design Ops:** Help maintain and scale our Figma libraries and ensure our Design System is cohesive and accessible across all departments.\n* **Research Ops:** Support user research initiatives by handling participant recruitment, planning sessions, and managing outreach.\n* **Design thinking:** Actively participate in planning and brainstorming co\\-design sessions, bringing fresh perspectives to the table.\n* **Designing for TV:** Gain unique, hands\\-on experience designing user interfaces and experiences specifically for television platforms.\n* **Portfolio Project:** By the end ", "source": "indeed"}, {"company": "ASML", "job_title": "Communication | Media internship: visual learning content", "location": "Veldhoven, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Asml", "job_url": "https://nl.indeed.com/viewjob?jk=64bb22e7fb7cd194", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "**Introduction**\n----------------\n\nOur Learning \\& Development teams at ASML design engaging learning experiences that support employees across global operations. In this internship, you will contribute by transforming complex topics into short, visual learning content that is easy to understand and scale. You will help improve how knowledge is shared through modern, video\\-based learning formats. You will collaborate with a team consisting of other interns and experienced learning specialists. This role is ideal if you enjoy visual storytelling and creating impactful learning moments.  \n\n\n\n**Your assignment**\n-------------------\n\nIn this internship, you will design and produce short videos and visual assets that support learning across ASML. You will work with experts to translate existing materials into clear, engaging microlearning formats. Your main responsibilities will be:\n\n\n* Create short microlearning videos (2–5 minutes) that explain key concepts clearly\n* Develop storyboards based on input from subject\\-matter experts\n* Record, edit, and finalize video content using available tools\n* Design supporting visuals such as slides, animations, and graphics\n* Improve and standardize templates for scalable content production\n* Review and refine content with the help of feedback from stakeholders\n* Document workflows and create reusable production guidelines\n\n  \n\nThis is a bachelor’s or master’s internship (non\\-thesis) for a minimum of 5 months, a minimum of 4 days per week (3 days on\\-site). The start date of this internship is August/September 2026\\.  \n\n\n\n**Your profile**\n----------------\n\nTo be suitable for the internship, you:\n\n\n* Are enrolled in a bachelor’s or master’s degree in communication, media studies, digital media, creative business, or a related field\n* Have a strong interest in video production, motion design, and visual storytelling\n* Have experience with video editing or visual design tools (such as Adobe, Premiere Pro, After Effects, Illustrator, Photoshop, or similar), or are eager to develop these skills\n* Are creative, proactive, collaborative, and able to work independently in a structured way\n* Demonstrate strong English communication skills (C1 level)\n\n  \n\n**Please include a portfolio or examples of your work with your application.**\n\n  \n\n**Other requirements you need to meet:**\n\n* You are enrolled at an educational institute for the entire duration of the internship ;\n* Attach your cover letter with a clear motivation why you are interested in this internship assignment in particular;\n* You need to be located in the Netherlands to perform your internship. In case you are currently living/studying outside of the Netherlands, your CV/motivation letter needs to include the willingness to relocate.\n* If you are a non\\-EU citizen, studying in the Netherlands, your university is willing to sign the documents relevant for doing an internship (i.e., Nuffic agreement).\n\n**Inclusion and diversity**\n---------------------------\n\nAS", "source": "indeed"}, {"company": "Cordaid", "job_title": "Advocacy and Coordination Intern for the Civil Society Platform for Peacebuilding and Statebuilding", "location": "Den Haag, ZH, NL", "careers_url": "https://nl.indeed.com/cmp/Cordaid", "job_url": "https://nl.indeed.com/viewjob?jk=5a6c7cdd1e2ab1e2", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "**INTERNSHIP \\- TERMS OF REFERENCE**\n\n**Position Title** : Advocacy and Coordination Intern\n\n* Location: Cordaid, The Hague – The Netherlands\n* Type of contract: Fixed\\-term, in person (6 months)\n* Working hours: 32h per week (4 days/week)\n* Starting date: 24 August 2026\n* Supervisor: CSPPS Coordinator\n* Stipend: € 444,\\- per month based on 32 hours per week\n* Interviews: From 13th July to 22nd July\n\n**About CSPPS**\n\nThe Civil Society Platform for Peacebuilding and Statebuilding (CSPPS) is a global network of civil society organisations supporting peacebuilding efforts in fragile \\& conflict affected settings. The main objective of CSPPS is to support these civil society organisations in their efforts to contribute to the formation of more peaceful, just and inclusive societies, in line with SDG16\\. In particular, CSPPS assumes the role of civil society representative in the International Dialogue for Peacebuilding and Statebuilding (IDPS). The CSPPS Secretariat has been hosted by Cordaid since 2012\\.\n\n**Main Responsibilities**  \nThe main objective of this position is to assist the CSPPS Secretariat Coordinator. Tasks range from supporting the internal operations of the Secretariat, to strengthening our international network and supporting our Country Teams in their peacebuilding activities.\n\nAt CSPPS, we want our interns to not only support the work of the Secretariat, but to make a meaningful contribution, both to their own professional careers and to the scope of the Platform.\n\nThis position has a multitude of responsibilities, including:\n\n* Organising consultations and meetings with members and other civil society stakeholders;\n* Translating (ENG\\-FR/FR\\-ENG) reports and oral interventions during meetings;\n* Developing advocacy documents (e.g. event reports, statements, briefing papers);\n* Administering the CSPPS network: processing membership applications, evaluating and supporting project proposals from members;\n* Exploring and developing funding opportunities;\n* Updating the CSPPS website content and participating in its communication efforts;\n* Supporting the organisation and facilitation of events;\n* Contributing to an episode of the Peace Corner Podcast;\n* Contributing to research projects with partner organisations;\n* Intern Challenge: leading any potential project that the intern is interested in and that is relevant for the Platform (e.g. writing an article for the website, conducting an interview, producing content related to conflict prevention and peacebuilding, etc.).\n\n**Selection Criteria / Qualifications and Experiences**\n\n* Open to students enrolled in a Master's degree **throughout the entirety** of the internship (preferably in relevant fields of international relations, development studies, crisis and security management, etc.);\n* Candidates must be able to work in the EU and meet the administrative requirements for working in the Netherlands (by obtaining a BSN number);\n* Professional competence in English **AND** French i", "source": "indeed"}, {"company": "Henkel", "job_title": "Internship in Supply Chain Controlling", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Henkel", "job_url": "https://nl.indeed.com/viewjob?jk=cb8e143fd800d250", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "#### **Please apply only if you are currently living in the Netherlands and you are still a student or you have graduated maximum 3 months prior to the internship start date.**\n\n#### **About this Position**\n\n\nAt Henkel, you can build on a strong legacy and leading positions in both industrial and consumer businesses to reimagine and improve life every day. If you love challenging the status quo, join our community of over 50,000 pioneers around the globe. Our teams at Henkel Consumer Brands continuously drive the evolution in dynamic categories: Laundry \\& Home Care and Hair. With our trusted brands, including Persil and Schwarzkopf, our cutting\\-edge technologies and our disruptive solutions, you will have countless opportunities to explore new paths and develop What makes you a good fit. Grow within our future\\-led businesses, our diverse and vibrant culture and find a place where you simply belong. All to leave your mark for more sustainable growth.  \n\n  \n\n#### **What you´ll do**\n\n* Global Supply Chain Experience: Immerse yourself in the dynamic world of supply chain\n  \n\ncontrolling within the Henkel Consumer Brands Division, gaining valuable insights into\n  \n\nglobal operations and processes, investments and sustainability.\n* Collaboration with International Stakeholders: Work closely with various international\n  \n\nstakeholders and departments, fostering collaboration and communication to ensure\n  \n\nthe seamless flow of information and efficient decision\\-making.\n* Global Finance Supply Chain Projects: Contribute to and support global finance supply\n  \n\nchain projects, including efficiency improvements, success analysis and harmonization.\n  \n\nGain hands\\-on experience in project management and execution.\n* Continuous improvement: Develop a proactive, analytical mindset by continuously\n  \n\nseeking ways to improve supply chain controlling processes. Embrace a problem\\-solving\n  \n\napproach to identify inefficiencies, challenge the status quo, and propose actionable\n  \n\nsolutions.\n* Operational KPI Monitoring: Support in monitoring, steering, and contributing to the\n  \n\nfurther development of operational Key Performance Indicators (KPIs) to enhance the\n  \n\noverall performance of the supply chain.\n\n\n#### **What makes you a good fit**\n\n* Bachelor or Master student in Business Administration, Finance, Accounting, Economics, or a related field.\n* Relevant work or internship experiences are a plus!\n* Good knowledge of the Microsoft Office tools, especially Excel and PowerPoint; (Power BI is a plus)\n* Excellent English communication and presentation skills\n* Team player with strong analytical skills\n* Pro\\-active mindset with a commitment to delivering quality results within established timelines.\n* Available for a full\\-time internship starting July 2026\\.\n\n#### **Some perks of joining Henkel**\n\n* Opportunity to work in a multi\\-cultural dynamic environment\n* An exciting and educational full\\-time internship in an international FMCG business\n* You’ll b", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship: Global Diversity, Equity and Inclusion", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=788e76a2300ae24a", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "Internship: Global Diversity, Equity and Inclusion (DEI)\n\n\n\nAre you passionate about creating a diverse and inclusive workplace? Do you want to contribute to meaningful projects in Diversity, Equity \\& Inclusion (DEI)? Then this internship is for you!\n\n\n\nThe department\n\n\n\nThe Social Sustainability team plays a vital role in driving HEINEKEN’s positive impact on society by fostering inclusive workplaces, strengthening communities, and ensuring equitable opportunities across our operations and value chain.\n\n\n\nAs part of HEINEKEN’s broader Sustainability agenda, the team focuses on embedding Diversity, Equity \\& Inclusion (DEI) into the way we work, while contributing to our ambitions around social impact, well\\-being, and inclusive growth.\n\n\n\nIn this internship, you’ll have the unique opportunity to contribute to Diversity, Equity \\& Inclusion, supporting global initiatives that promote a culture of belonging and help create meaningful impact for our people and communities.\n\n\n\nThe internship\n\n\n\n* Diversity, Equity \\& Inclusion (DE\\&I;):\n\n\n* Support the design and delivery of global DE\\&I; initiatives.\n\n\n* Assist in planning and executing campaigns that promote DE\\&I; awareness and engagement.\n\n\n* Coordinate activities with DE\\&I; ambassadors and Employee Resource Groups worldwide.\n\n\n* Gather and analyse data to provide insights and recommendations for continuous improvement.\n\n\n\nThroughout your internship, you’ll get hands\\-on experience in global talent strategies, working closely with professionals across the organization. You’ll also have the freedom to shape your own internship experience by taking ownership of specific projects that inspire you.\n\n\n\nDuring your internship you will get the opportunity to get to know HEINEKEN as a company, also outside your department. We give you the trust and freedom, so you can work like a real entrepreneur. We like to bring the outside world inside and therefore we embrace new, fresh ideas with enthusiasm. Of course, always with the guidance that is right for you.\n\n\n\nThe terms of employment\n\n\n* A full\\-time internship, starting on September 1, 2026\n* The duration of the internship is 5 or 6 months (to be agreed upon with your internship supervisor)\n* Your home office will be located in Amsterdam.\n* At HEINEKEN, we work with a hybrid model, typically spending three days a week at the office and two days working from home\n* You will receive a monthly internship allowance of €650 gross based on a 40\\-hour workweek\n* You will earn 2 vacation days per month (based on a full\\-time internship)\n* If you do not have a public transport student subscription, your commuting costs will be fully reimbursed\n\n\nThe start of your internship\n\n\n\nTogether with a diverse group of interns from different departments you will start your internship at HEINEKEN. Together you will be introduced to the organization. Furthermore, you can organize fun activities with your fellow interns.\n\n\n\nThe unique you!\n\n\n* Pro\\-active, pragmatic with a ", "source": "indeed"}, {"company": "Philips", "job_title": "AI Internship: Using AI for Classification of Service Calls", "location": "Best, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Philips", "job_url": "https://nl.indeed.com/viewjob?jk=8dfee96a140b6ed3", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-20", "recruiter_email": null, "applicant_count": null, "description": "### **Job Title**\n\nAI Internship: Using AI for Classification of Service Calls\n### **Job Description**\n\n**Please remember when applying that you need to be enrolled at the university for the whole internship duration!**\n\n**Start Date:** as soon as possible\n\n\n**Duration:** 6 months\n\n\n**Type:** Internship (thesis possible)\n\n\n**Weekly Presence:** 40h (minimum 32h)\n\n\n**Location:** Best (min. 3x per week)\n\n\n**AI Internship: Using AI for Classification of Service Calls**\n\nWe are seeking a motivated intern to join our Service Operations Team. The intern will improve analysis of service calls in order to find opportunities to reduce\n  \n\ncall rate and service cost (labor \\& spare parts).  \n\n\n\n  \n\n**Your role:**\n\n* With the help of AI/language models/machine learning, you will be responsible for building a solution for classifying service calls into main categories (Level 1\\) and sub\\-categories (Level 2 and 3\\). The AI solution will analyze free text data entered by the service engineer describing the problem and the resolution. There will be own L2 classification of the problem and separate L3 classification of the resolution.\n* You should have an analytical mindset so that you can improve the call classification model in order to help us in the ultimate goals of 1\\) identifying best practices in order to reduce labor hours and service cost 2\\) improving SW \\& HW reliability 3\\) improving proactive alerts 4\\) improving service \\& troubleshooting instructions.\n\n  \n\n**You're the right fit if:**\n\n* Currently pursuing a Bachelor’s or Master’s degree in Computer Science, Data Science, Engineering, Business Informatics, or a related field.\n* You have a good understanding of AI/language models/machine learning\n* Experience or coursework in Python, R, or Java; familiarity with AI/ML libraries (e.g., TensorFlow, PyTorch, scikit\\-learn) is preferred.\n* Strong analytical and problem\\-solving skills.\n* You can proactively collaborate with different stakeholders and\n  \n\ndemonstrate great inter\\-personal and communication skills.\n* Good communication skills in English (Dutch is a plus)\n\n**How we work together**\n\nWe believe that we are better together than apart. For our office\\-based teams, this means working in\\-person at least 3 days per week. Onsite roles require full\\-time presence in the company ’ s facilities. Field roles are most effectively done outside of the company ’ s main facilities, generally at the customers ’ or suppliers ’ locations.\n\n\nMonthly full\\-time allowance between € 500 \\- € 700 gross, depending on educational level and if you would need to relocate to The Netherlands. If you will perform a part\\-time internship you will receive the allowance pro\\-rata.\n\n\nHousing compensation, in case of relocating to the vicinity of the office, € 300,\\- net if location is in the vicinity of Amsterdam, € 255,\\- net for all other Philips locations. You need to provide a rental contract of the land lord, and your normal home\\-work travel distance need to be more", "source": "indeed"}, {"company": "Sofitel", "job_title": "Cost Control Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Sofitel", "job_url": "https://nl.indeed.com/viewjob?jk=1173c446c0e47b67", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-20", "recruiter_email": "efi.triantafyllou@sofitel.com", "applicant_count": null, "description": "* **Available from August/September 2026**\n\n### **Let your passion shine as Cost Control Intern**\n\n### **Job description**\n\n\nIn the Cost Control department of The Grand, we ensure that all goods and supplies for the various departments of the hotel are efficiently managed. This includes physically checking deliveries, organizing stock, and making sure that all orders are distributed correctly. You will also assist with keeping the purchase administration up to date and support the manager with invoice processing and inventory reporting.\n\n### **What do we offer?**\n\n\nOur team is young and full with passion and motivation. The Grand highly values personal and professional growth, therefore, we have a full time Learning \\& Development Manager who contributes do your development. Not only during, but also after your internship, we see possibilities and career opportunities. You also have the possibility to do various cross trainings in different departments to broaden your hotel knowledge. As part of your internship experience, you'll get the opportunity to take part in an operational shift once a month, giving you valuable hands\\-on insight into our daily operations.\n\n  \n\nThe internship allowance is €600 gross per month, based on 38 hours per week. Besides this, you also have the possibility to receive travel allowance. Every day you can enjoy a meal (for free) in our staff canteen.\n\n  \n\nDo you like to go out for dinner and drinks? Good! You will get up to 50% discount in several restaurants and bars in 4 and 5 star hotels in Amsterdam!\n\n### **Information**\n\n\nSofitel Legend The Grand Amsterdam offers five\\-star de\\-luxe in a unique Amsterdam historical ambience, with French elegance and grandeur. The international hotel is part of the Accor Hospitality Netherlands Group. Housed in the former town hall of Amsterdam, The Grand offers 179 rooms, of which 52 are suites. The Grand also features 19 InspiredMeeting rooms, an urban spa, an Garden Bistro and a fine dining restaurant, Bridges.\n\n### **What will you do?**\n\n* ﻿Communicating daily with suppliers.\n* Checking internal delivery systems and updating all records.\n* Physically organizing containers with goods at our receiving center.\n* Ensuring stock levels are updated.\n* Picking up deliveries and sorting them for each department.\n* Coordinating with all departments to meet their needs.\n\n### **Student profile**\n\n\nWe are looking for you if you meet these requirements:\n\n* You are fluent in English.\n* You are well organized and interested in Luxury Hospitality.\n* You are enrolled in school for the entire duration of the internship.\n* You are available for at least 22 hours per week.\n\n  \n\nEnthusiastic? Apply immediately!\n\n  \n\nWe are looking forward to receiving your application. Don't hesitate to reach out to me via efi.triantafyllou@sofitel.com or \\+31 (0\\)6 51 50 45 23\\.", "source": "indeed"}, {"company": "APG", "job_title": "Internship Compliance Asset Management", "location": "Werk van thuis, NL", "careers_url": "https://nl.indeed.com/cmp/Apg-877e77fe", "job_url": "https://nl.indeed.com/viewjob?jk=bea2c99fc85ede12", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-19", "recruiter_email": null, "applicant_count": null, "description": "**Are you looking for an internship where you can gain hands‑on experience in compliance within a leading asset manager?**\n--------------------------------------------------------------------------------------------------------------------------\n\nLocation\nHome office, Amsterdam\nEducation\nUniversity Degree (Bachelor)\nPublication date\n19 May 2026\n  \n### **This is going to be your job**\n\n  \n\n**The role**  \n\n  \n\nWithin APG Asset Management, the Compliance team plays a key role in safeguarding compliance with laws, regulations, internal policies, and ethical rules. The team supports the organization by giving advice, monitoring, reporting, and assessing compliance risks.\n\n\nAs a Compliance Intern, you will support the team in managing day‑to‑day compliance operations while also contributing to training, control testing and automation initiatives. You will gain hands‑on experience in how compliance frameworks operate in practice within a large, regulated asset management environment.\n\n\nYour work will support structured follow‑ups on controls and risk items, reporting and team coordination, training initiatives and AI‑assisted workflows.  \n\n\n\n**What you would do**\n\nThe exact assignment will be shaped together with you, based on your interests and learning goals. Possible activities include:\n\n  \n\n\n\n**Training \\& Communications**\n\n\n* Support and streamline training administration through templates, checklists and repeatable processes.\n* Assist in the preparation and delivery of training sessions (content, slides, logistics).\n* Improve the clarity, structure and consistency of reports, presentations and policy updates (always with review by the team).\n\n**Compliance Controls**\n\n\n* Follow up on risk items and control testing actions (status tracking, reminders, consolidating updates).\n* Maintain clear overviews of pending or overdue control uploads, tests and reviews.\n* Support action and task tracking across the Compliance team.\n* Track follow‑up of team meeting actions.\n\n**Documentation Management \\& AI Enablement**\n\n\n* Set up and document reusable prompt templates for common Compliance activities (e.g. summarising, structuring, drafting), following a strict review principle.\n* Help reorganize and structure the Compliance SharePoint environment, including training and presentation archives.\n* Support updates and content housekeeping for the Compliance intranet page.\n\n  \n\n\n\n**What you bring**\n\n* You are an HBO or WO student (3rd/4th year) in Law, Risk Management, Business, Economics, Data Analytics or a related field.\n* You are eager to learn and take initiative.\n* You work accurately and enjoy bringing structure to complex information.\n* You have strong organizational and analytical skills.\n* You are a team player, but can also work independently.\n* You have affinity with digital tools, data, reporting and/or process improvement.\n* Interest in compliance, governance, controls or riskmanagement is a strong plus.\nExperience with tooling such as Excel, PowerPo", "source": "indeed"}, {"company": "Hai Robotics Europe", "job_title": "Supply Chain & Spare Parts Intern", "location": "Hoofddorp, NH, NL", "careers_url": "https: n hands\\-on tourism experience at our **Amsterdam depot** at **Grevelingstraat 77, 2161 WE Lisse, Netherlands.**\n\n\n\nAs our **Tourism \\& Operations Intern**, you'll be the friendly face of our brand \\- welcoming guests, setting them up for road trips of a lifetime, and ensuring their journey ends just as wonderfully as it began. If you thrive on meeting new people, love a challenge, and enjoy the buzz of a fast\\-paced environment, your next adventure starts here!\n\n  \n\n\n**WHAT WILL YOU WORK ON?**\n\n\n**Front\\-office activities:**\n\n\n* **Customer service and sales:** Take care of check\\-ins and check\\-outs, register guests, process payments, explain campervan functionalities, terms and conditions, upsell road trip extras.\n\n\n**Back\\-office activities:**\n\n\n* **Operations handling:** Align the reservations with the available campervans, verify and prepare campers and road trip extras and kits.\n* **Quality control:** Maintain the campervans in top condition, identify and act on possible maintenance or repair needs.\n* **Support activities:** Support the team in monitoring the existing stock, coordinating the fleet of campervans, troubleshooting operational issues.\n\n  \n\n\n**WHO ARE WE LOOKING FOR?**\n\n\n* You are a student or recent graduate in Hospitality, Tourism, International Studies, Business Administration or a related field looking for an internship;\n* You are fluent in English, have a work permit (if applicable), and avalid driver's licence (for both manual and automatic vehicles);\n* You like international environments and meeting new cultures;\n* You possess a natural talent for connecting with people and have a strong customer service orientation;\n* You have a problem\\-solving mindset, thriving to create solutions and feeling comfortable with getting your hands dirty.\n\n  \n\n\n**THE INDIE COMMITMENT**\n\n  \n\n* All internships are compensated;\n* Online and on\\-the\\-job training to develop relevant s", "source": "indeed"}, {"company": "Triple Jump", "job_title": "Investor Relations & Business Development Intern", "location": "Amsterdam Zuid, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Triple-Jump", "job_url": "https://nl.indeed.com/viewjob?jk=f7c1f9acb8844280", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-15", "recruiter_email": null, "applicant_count": null, "description": "**Investing with purpose: Triple Jump welcomes passionate professionals**\n\n\nTriple Jump, a Dutch impact investment manager with a global portfolio, is looking for an:\n\n**Investor Relations \\& Business Development (IRBD) Intern**\n\n\n32\\-40 hours per week, based in Amsterdam\n\n\nAre you passionate about sustainable development, impact investing, and creating positive change? Join the Investor Relations \\& Business Development team (IRBD).\n\n\n**About the IRBD department**\n\n\nAs an IRBD Intern, you will be part of the Investor Relations \\& Business Development (IRBD) team, a multidisciplinary team responsible for managing relationships with investors and clients, supporting fundraising activities, and coordinating the development and management of Triple Jump’s funds and mandates. The team works closely with colleagues across the organization to ensure accurate information flows, effective internal coordination, and compliant communication throughout the lifecycle of funds and mandates.\n\n**About the Role**\n\n\nWe are looking for a detail‑oriented intern to support the implementation of a new CRM system used across Triple Jump. The primary responsibility of this role is to ensure that information on all Triple Jump funds and mandates is accurately, consistently, and fully translated into the CRM.\n\n\nIn addition to CRM‑related work, the intern will support the IRBD team with other administrative and coordination tasks, depending on team needs. This role involves close collaboration with colleagues across IRBD and other teams, and requires flexibility and adaptability as priorities and system requirements evolve.\n\n**Key Responsibilities**\n\n* Transferring and structuring information on all Triple Jump funds and mandates into the CRM system.\n* Ensuring that data is accurate, complete, consistent, and aligned with internal source documents (e.g. fund documentation, reporting templates, trackers).\n* Reviewing existing information and flagging gaps, inconsistencies, or unclear data.\n* Applying agreed naming conventions, categorizations, and data standards within the CRM.\n* Working closely with team members to clarify data points and validate information.\n* Adapting data entry and structuring approaches as the CRM setup evolves.\n* Supporting basic quality checks to ensure the CRM can be reliably used across teams.\n* Documenting data definitions and assumptions where relevant, to support long‑term system use.\n* Supporting other IRBD administrative tasks as needed (e.g. maintaining trackers, supporting internal coordination, or assisting with documentation).\n\n**About Triple Jump**\n\n\nWe are not just a company. We are Triple Jump. Our mission is to empower underserved markets worldwide by granting access to finance, creating a profitable outcome for all involved. We are not bound by the limitations of traditional financial services or the restrictions of an NGO. Instead, we have forged our own path, driven by the belief that prosperity should be distributed equitably acr", "source": "indeed"}, {"company": "Microsoft", "job_title": "Critical Environment Technician Intern", "location": "Middenmeer, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Microsoft", "job_url": "https://nl.indeed.com/viewjob?jk=d3c51ca59265fddf", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-14", "recruiter_email": null, "applicant_count": null, "description": "**Overview**  \n\n Join Microsoft’s Cloud Operations \\& Innovation (CO\\+I) team – the engine behind our global cloud services. As a **Critical Environment Technician Intern**, you’ll play a vital role in supporting the infrastructure that powers products like Microsoft Azure, Office 365, Xbox, and OneDrive.\n\n\nAt Microsoft, we live our values by fostering an inclusive workplace where everyone can thrive. This internship offers hands\\-on experience, professional growth opportunities, and access to training programs.\n\n\nOur global network includes hundreds of datacenters and millions of servers serving over 1 billion customers and 20 million businesses in more than 90 countries. Sustainability and operational excellence are at the heart of everything we do, and we’re looking for passionate individuals to help us deliver world\\-class cloud solutions.\n\n**Ready to make an impact? Join us and be part of the team that empowers billions worldwide.**\n\n **Responsibilities**  \n\nAs a CET Intern, you will:\n\n\nWork onsite at our datacenters in Middenmeer.\n\n\nCarry out basic operational tasks such as site rounds, recording observations, and taking measurements under supervision.\n\n\nLearn to operate critical systems safely and professionally, with the opportunity to earn your Microsoft CET Level 1 certification.\n\n\nMonitor and inspect facility equipment (HVAC, electrical, mechanical, fire/life safety systems) and report abnormal conditions.\n\n\nUse our Computerized Maintenance Management System (CMMS) to track assets and manage work orders.\n\n\nAssist with emergency monitoring and response following established procedures.\n\n\nSupport incident investigations by gathering data and contributing to root\\-cause analysis.\n\n\nParticipate in planned, predictive, and corrective maintenance activities, including preparing materials and administrative tasks.\n\n\nCollaborate with senior technicians to troubleshoot complex systems.\n\n\nDocument maintenance and troubleshooting activities and escalate issues as needed.\n\n\nContribute to developing Methods of Procedure (MOPs) and Standard Operating Procedures (SOPs) for safe operations.\n\n\nConduct technical research on relevant topics to enhance your knowledge.\n\n **Qualifications**  \n\nHigh School Diploma or equivalent.\n\n\nBasic knowledge of electrical and/or mechanical systems\n\n\nMinimum of 18 years of age\n\n\nYou need to be a Dutch National or, have residency and you must be eligible to work in the Netherlands  \n\n\n\n**Background Check Requirements:**\n\n\nAbility to meet Microsoft, customer and/or government security screening requirements are required for this role. These requirements include, but are not limited to the following specialized security screenings:\n\n\nMicrosoft Cloud Background Check: This position will be required to pass the Microsoft Cloud background check upon hire/transfer and every two years thereafter.\n\n **Preferred Qualifications:**\n\n\nCompleted qualification in Facilities Management, Mechanical, Electrical engineering or related qual", "source": "indeed"}, {"company": "TNO", "job_title": "Internship | Test-Time Adaptation for Robust AI", "location": "Den Haag, ZH, NL", "careers_url": "https://nl.indeed.com/cmp/Tno", "job_url": "https://nl.indeed.com/viewjob?jk=f3912b6ffb29d926", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-13", "recruiter_email": null, "applicant_count": null, "description": "**About this position**\n-----------------------\n\n\nDo you want to contribute meaningfully to our AI research by applying Test\\-Time Adaptation to help robots and drones tackle challenging situations more intelligently?\n\n\nRecently, a new paradigm emerged in the Machine Learning (ML) research field called Test\\-Time Adaptation (TTA). TTA is a generically applicable technique to make pre\\-trained ML models adapt to the situation or environment of a system during operations or test\\-time. The direct impact of this research is that a autonomously driving vehicle with mud on its sensors would still detect obstacles on its path with an adaptive model where a non\\-adaptive model would fail. The adaptation process happens continuously. A key challenge is to extract knowledge from the situation during test\\-time without any semantic meaning supplied by humans..\n\n\n**What will be your role?**\n---------------------------\n\n\nThe Test\\-Time Adaptation concept has existed now for several years. In this time the state\\-of\\-the\\-art has moved fast in different directions. One of those is the adaptation of a model on as little data as possible whilst optimizing for performance gain. Another direction is adaptation with little extra computational resources on cheap hardware. Stability of the adaptation process is another hotly researched direction. Stability guarantees are difficult to verify and controlling stability is a key challenge in TTA.\n\n\nThe extraction of knowledge from raw data brings additional challenges, such as the optimal use of the available information, control and stability of the adaptation process and the optimal use of compute resources associated with these extra functionalities.\n\n\nIn this assignment you will tackle one or more of these research directions and challenges in your applied research. You will work with state\\-of\\-the\\-art ML techniques and implement and evaluate those in military\\-relevant scenarios. The applications of your research are numerous and you can decide which to pick. We expect you to perform a critical analysis of the limitations of current methods and that you propose new, improved or extended methods to bring the TTA field one step further.\n\n\nYour thesis project will be part of the Collaborative Autonomous Systems department within TNO. This department is a dynamic and interdisciplinary team of approximately 35 experts working on advanced autonomy and AI solutions for ground, air and maritime systems. The department has strong expertise in mission autonomy, localization and navigation, situational awareness and robotics.\n\n\n**What we expect from you**\n---------------------------\n\n\nWe are looking for a motivated master’s degree student with an interest in Machine Learning and Deep Learning for defence related applications. This position is a great fit for students who enjoy combining theoretical concepts with hands\\-on experiments and applications.\n\n\nRequirements:\n\n\n* You are in the last phase of your master’s degree in ", "source": "indeed"}, {"company": "The Social Hub", "job_title": "Membership Operations Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Social-Hub-1", "job_url": "https://nl.indeed.com/viewjob?jk=0958a8205a440c3d", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-13", "recruiter_email": null, "applicant_count": null, "description": "**Your Mission, Should You Choose to Accept It**\n\n\n\nBehind every buzzing coworking space, every smooth check\\-in and every member who feels instantly at home, there's someone quietly making it all happen. That someone could be you. As our Member Operations Intern, you'll keep the engine running across our member spaces, from bookings and tours to solving the little things before they become big things. One moment you're helping a member get set up for the day, the next you're spotting ways to make the whole experience even better. You'll work closely with a team that loves ideas, backs each other up and knows how to keep things moving without making it feel corporate. If you like variety, people and the satisfaction of a space that just works, you'll fit right in. Bonus points if you're the type of person who notices the crooked pillow before anyone else does.\n\n\n**In Case You Don't Know Who We Are**\n\n\n\nKnown for being the rule breakers in hospitality, TSH is a fun, creative and inspiring environment where everyone can work, stay, learn and play and most importantly – be themselves. As an employer we look, act and think like a hotel, but instead we offer a lot more. Think student accommodation, long and short stay options, gyms, talks, events, rooftop bar and eat \\& drink escapes as well as community and coworking spaces. Located in The Netherlands, Germany, Austria, Italy, France, Spain, Portugal, and the UK, with several new openings on the way, this hybrid hospitality concept may take root in the heart of Europe, but our plans are set for going global.\n\n\n**What You'll Do**\n\n\n* Support the day\\-to\\-day flow of our coworking and member spaces\n* Manage desk and meeting room bookings so everything runs smoothly\n* Welcome members, answer questions and help them feel at home\n* Lead tours and show people what makes our spaces different\n* Spot maintenance issues, restock essentials and keep the space looking sharp\n* Jump in to solve operational hiccups as they come up\n* Work with the team on smarter ways to improve how things run\n\n\n**What You'll Have**\n\n\n* You are currently enrolled at a university within the EU\n* You are studying Hospitality, Business, Marketing, Sales or something similar\n* You bring a hands\\-on attitude and genuinely enjoy working with people\n* You have a sharp eye for detail and stay organised even when things get busy\n* You're comfortable switching between tasks and figuring things out on the go\n* You are fluent in Dutch and English. Extra languages are always welcome\n* You are available for a full\\-time internship for 6 months starting 1st September\n\n\n**What We Offer**\n\n\n* The opportunity to work at a dynamic, multi\\-national company. Not just another hotel \\- we're a game changing innovator, challenging every convention and defining the future\n* The opportunity to work for a Certified B Corp® company that balances profit with positive impact, collaborating with organizations like Movement on the Ground and the TSH Talent Foundat", "source": "indeed"}, {"company": "The Kingfish Company", "job_title": "Intern assigment: Process Optimization within a fish farm", "location": "Kats, ZE, NL", "careers_url": "https://nl.indeed.com/cmp/The-Kingfish-Company", "job_url": "https://nl.indeed.com/viewjob?jk=0aa5c2b8579a21bf", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-13", "recruiter_email": null, "applicant_count": null, "description": "APPLICATIONS OPEN ONLY TO RESIDENTS OF THE NETHERLANDS AND EU COUNTRIES\n\nThe Kingfish Company is growing faster than ever and our production team plays a key part of realizing the Future of Fish!  \n\n\n**Process Optimization and Efficient Working within a Fish Farm**\n\n\n**Objective of the internship**  \n\nTo analyze, improve, and optimize operational processes within the fish farm, with the goal of increasing efficiency, saving time, and improving productivity and quality.\n\n\n**Background**\n\n\n\nDaily operations within the fish farm include processes such as feeding, water management, monitoring, maintenance, and logistics. While essential, these processes often offer opportunities for improvement in efficiency, standardization, and workforce utilization.\n\n\n**Assignment description**\n\n\n\nThe intern will analyze one or more core processes within the farm and map them out. Based on this analysis, the intern will develop concrete improvement proposals and, where possible, test and implement them.\n\n\n**Key activities**\n\n\n* Map current processes (e.g., using process flows and observations)\n* Conduct time studies and identify bottlenecks\n* Identify waste (e.g., waiting time, unnecessary actions, errors)\n* Interview employees about their workflows and improvement ideas\n* Analyze available data (e.g., production, losses, cycle times)\n* Develop improvement proposals (e.g., more efficient workflows, tools, planning)\n* Test improvements in practice (pilot projects)\n* Develop standard operating procedures (SOPs)\n* Present findings and recommendations to the team/management\n\n**Possible sub\\-projects (choose 1–2 focus areas)**\n\n\n* More efficient workforce planning and task allocation\n* Improvement of monitoring and data registration systems\n* Reduction of manual work through simple automation\n* Standardization of daily routines (SOPs)\n* Optimization of internal logistics (movement, storage, process flow)\n\n**Expected results**\n\n\n* Clear overview of current processes (visual and well\\-documented)\n* Analysis of bottlenecks and improvement opportunities\n* Concrete and well\\-substantiated improvement proposals\n* At least one tested or implemented improvement initiative\n* Final report with practical recommendations\n* Optional: work instructions or SOPs for employees\n\n\n**Supervision and collaboration**\n\n\n* Guidance from the Production Manager and Head of production\n* Close collaboration with employees on the work floor\n* Regular progress meetings\n\n  \n\n\n### **Intern profile**\n\n  \n\n\n* Student in business administration, engineering, agriculture, food/aquaculture, or similar\n* Interest in process optimization and efficiency improvement\n* Analytical and curious mindset\n* Strong communication skills and comfortable working on\\-site\n* Hands\\-on and proactive attitude\n* Fluent in English\n\n**The Kingfish Company**\nThe Kingfish Company is a pioneer and leader in sustainable land\\-based aquaculture. We produce the Yellowtail Kingfish (also known as Ricciola/Hiramasa/Greater Amberjack) ", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship - Talent Acquisition Coordinator", "location": "Leiden, ZH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=fc2302393e0eccb5", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-13", "recruiter_email": null, "applicant_count": null, "description": "Internship – Talent Acquisition Coordinator\n\n\n\n“Be ready to jump into the real world of recruitment! During my internship, I truly felt like I was making a real impact. I was trusted with meaningful responsibilities, challenged to grow, and exposed to many areas of recruitment (from learning how to make job descriptions all the way to onboarding new interns). What really stood out was the supportive environment. The team was always willing to answer any of my questions, no matter how small, and to also share their knowledge in recruitment. On top of that, there was also really nice intern community, which is a great opportunity to bond with your peers, and grow alongside them.” \\- Julieta (former TA intern)\n\n\n\nThe internship\n\n\n\nHEINEKEN is on a journey to become the best\\-connected brewer in the world. This ambition is supported by our Talent Acquisition Team in bringing in the best Talents for our organization. One of our focus areas is creating a best\\-in\\-class candidate journey in our recruitment efforts. So, we are looking for ways we can ensure a best\\-in\\-class candidate onboarding journey.\n\n\n\nIn this internship you will be responsible for the following:\n\n\n* Working directly with the Head of Talent Acquisition, TA Leads and Talent Acquisition Business Partners on administration side around our candidate experience and onboarding.\n* Collaborate closely with our People Operations, Mobility, and People Teams, gaining hands\\-on exposure to how HR functions work in a global organization\n* Support the end\\-to\\-end onboarding experience for new intern hires, helping ensure a smooth, welcoming start to their journey\n* Participate in team meetings and provide input on recruitment and onboarding initiatives\n* Help deliver an exceptional candidate experience, serving as a friendly and professional point of contact throughout the recruitment process\n* Handle sensitive employee and candidate information with care, maintaining confidentiality and professionalism at all times\n* Support the planning and coordination of team events, strengthening engagement and collaboration\n* Supporting your team in coordinating and scheduling interviews with Hiring Managers, playing a key role in keeping the recruitment process running smoothly\n\n\nDuring your internship, you’ll dive into the world of recruitment and onboarding, that means learning the ropes directly from experienced and supportive colleagues. You’ll have real opportunities to share your ideas, take initiative, and help us make our hiring process even better.\n\n\n\nYour new team and workplace  \n\nOur Talent Acquisition Team collaborates closely with colleagues across various Operating Companies in the Netherlands, as well as other People teams in Amsterdam, including People Analytics and Global Talent Acquisition. You’ll get to work with a diverse group of passionate professionals every day: people who care about what they do and enjoy working together.\n\n\n\nDuring your internship, you’ll have every opportunity ", "source": "indeed"}, {"company": "ASML", "job_title": "Communications internship: people operations", "location": "Veldhoven, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Asml", "job_url": "https://nl.indeed.com/viewjob?jk=dcc94243e4f32fce", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-12", "recruiter_email": null, "applicant_count": null, "description": "**Introduction**\n----------------\n\nYou will be joining the Global Operation Excellence team at ASML, driving improvements and efficiency. The team consists of specialists in different areas, including Communications, Knowledge Management, Transition, Lean, and Data \\& Analytics. This is a unique opportunity to contribute to impactful projects in People Operations at ASML. We are looking for a motivated Communication Intern to join our Global Operational Excellence team at ASML Netherlands, focusing on HR operations. This internship offers a unique opportunity to gain hands\\-on experience in communication management in a leading technology company.  \n\n\n\n**Your assignment**\n-------------------\n\nSelected intern will cover variety of different assignments and tasks, be part of the dynamic team in the team. Main responsibilities include:\n\n\n* Support in the development and implementation of (project) communication plans\n* Increase community engagement through coordinating and executing department meetings and engagement initiatives\n* Support the planning and implementation of leadership events\n* Execute communication tasks and newsletters\n* Implement a content calendar and create content for internal social media\n* Coordinate with (regional) communications specialists.\n\nThis is a bachelor's (4th year) or a master's level internship (non thesis), starting in mid August 2026, for minimum 5 months with possibility to extend. The team offers hybrid working environment.  \n\n  \n\n\n\n**Your profile**\n----------------\n\nTo be a good fit, you are ideally enrolled in communications, international business or similar discipline. Additionally, you possess the following skills:\n\n\n* Fluent in English, with a talent for written communication.\n* Able to manage and collaborate with stakeholders\n* Able to manage time, prioritize and multitask across different assignments and tasks.\n\nAdditional nice to have:\n\n\n* Experience with MS O365, Viva Engage, ServiceNow, CSM system.\n* Experience in an international, matrix organizational structure.\n* Experience in HR, Communications. etc.\n* Experience creating content.\n\n**Other requirements you need to meet:**\n\n* You are enrolled at an educational institute for the entire duration of the internship ;\n* Attach your cover letter with a clear motivation why you are interested in this internship assignment in particular;\n* You need to be located in the Netherlands to perform your internship. In case you are currently living/studying outside of the Netherlands, your CV/motivation letter needs to include the willingness to relocate.\n* If you are a non\\-EU citizen, studying in the Netherlands, your university is willing to sign the documents relevant for doing an internship (i.e., Nuffic agreement).\n\n**Inclusion and diversity**\n---------------------------\n\nASML is an Equal Opportunity Employer that values and respects the importance of a diverse and inclusive workforce. It is the policy of the company to recruit, hire, train and promote pers", "source": "indeed"}, {"company": "Cocon Company", "job_title": "HR & Finance Intern", "location": "Werk van thuis, NL", "careers_url": "https://nl.indeed.com/cmp/Cocon-Company-1", "job_url": "https://nl.indeed.com/viewjob?jk=10c9fb478ca8d4d8", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-12", "recruiter_email": null, "applicant_count": null, "description": "**HR \\& Finance Intern \\| COCON (Spas \\& Wellness)**\n\n**Location:** Remote (European Countries \\- Netherlands preferred)\n\n**Hours:** Part\\-Time, 2\\-3 days per week (minimum 2 days)\n\n**Duration:** 3 months minimum, with potential extension\n\n**Salary:** Paid internship (aligned with experience)\n\n**About the Opportunity**\n\nCOCON is a fast\\-growing spa \\& wellness operator, expanding from Amsterdam into the UK in 2024\\. We currently operate multiple luxury spa locations within 5\\-star hotels and have ambitious expansion plans across London.\n\nThis is more than a typical “data\\-entry” internship. You will work closely with the Founders and our Finance \\& HR Lead, gaining hands\\-on exposure to how a scaling, cross\\-border business operates.\n\n**The Role: Finance \\& HR Support**\n\nYou will support the day\\-to\\-day operations of our UK and Netherlands business, helping maintain strong financial and administrative processes as we scale.\n\n**1\\. Finance Administration** \n\n* **Invoice Management:** Assist with the invoice process, including locating missing invoices, verifying details, and posting them to the accounting system.\n* **Bank Reconciliation:** Support the weekly and monthly reconciliation to ensure accurate records.\n* **Audit Preparation:** Maintain a clean, organised digital filing system for all financial documents to ensure the operation remains audit\\-ready at all times.\n* **Chasing Invoice:** Ensuring all invoices from partners are paid in a timely manner.\n\n**2\\. Therapist Payroll \\& Coordination**\n\n* **Payroll Ownership:** Support the preparation of therapist invoices to ensure accurate and timely payments.\n* **Capacity Building:** Assist Spa Leads with administrative coordination to improve operational flow.\n\n**3\\. HR \\& Database Management**\n\n* **Talent Pipeline:** Update and maintain the internal database of therapist applications.\n* **HR Projects:** Support the recruitment process, including candidate screening and updating internal HR policies and documentation.\n\n**4\\. Systems \\& Compliance**\n\n* **Data Accuracy:** Help identify discrepancies in financial or personnel records.\n* **Software Support:** Work with tools such as Xero, Excel, or Google Sheets to support reporting and tracking\n\n**Candidate Requirements**\n\n* **Education:** A degree ideally in Finance, Accounting, HR, or Business Management.\n* **Language:** Proficiency in **English.**\n* **Numerical Accuracy:** Exceptional attention to detail. You are someone who notices the smallest discrepancy and enjoys organising data systematically.\n* **Discretion \\& Trust:** Professional integrity is mandatory, as you will be handling sensitive financial and personnel data.\n* **Software Literacy:** Proficiency in Microsoft Excel or Google Sheets. Familiarity with **Xero** is a significant plus.\n\n**Why COCON?**\n\n* **Mentorship:** Direct mentorship from senior leadership and founders.\n* **Dynamic Environment:** Hands\\-on experience in a fast\\-growing, international business\n* **Autonomy:** Owners", "source": "indeed"}, {"company": "KARL LAGERFELD", "job_title": "Full Price Buying Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Karl-Lagerfeld", "job_url": "https://nl.indeed.com/viewjob?jk=430cfd70b467bf70", r this internship, you:\n\n\n* Are enrolled in a program such as, Accounting, Tax Law, Fiscal Economics, Tax Technology, Management Information Systems, Computer Science, or something related.\n* You are passionate about technology, data \\& AI, particularly in their application within the finance and/or tax domain.\n* Are analytical, pro\\-active and eager to learn.\n* Have a keen interest to develop your skills in a challenging and dynamic business environment;\n\n**Other requirements you need to meet:**\n\n* You are enrolled at an educational institute for the entire duration of the internship ;\n* Attach your co", "source": "indeed"}, {"company": "Kraft Heinz", "job_title": "HR (Internal Communications) Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Kraft-Heinz-3e502a27", "job_url": "https://nl.indeed.com/viewjob?jk=93a842b11cad0d56", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-18", "recruiter_email": null, "applicant_count": null, "description": "**Internal Communications Intern**\n\n**What's on the menu**\n\nWe have an outstanding learning opportunity for an enthusiastic Bachelor or Master student who is interested in making a difference in Internal Communications at Kraft Heinz!\n\n\nAt Kraft Heinz are the owner of your ideas and of your career. We offer an upbeat and innovative work environment. Aside from your daily tasks, you are motivated to speak up and generate new ideas. We appreciate a new point of view!\n\n\nOur team consists of creative problem solvers and high performers worldwide. We stand committed to responsible, sustainable practices that extend to every facet of our business, our consumers, and our communities. Every day, we redefine the food industry with daring thinking and outstanding results. If you share our passion – and are ready to create the future, build a legacy, and lead as a global citizen – there’s only one thing to do: Join our table and let’s make life delicious  entire internship duration.\n\n**NOTE:** EU working rights are required *(Either y", "source": "indeed"}, {"company": "Vertiq Hospitality Partners", "job_title": "RESERVATIONS INTERNSHIP RADISSON HOTEL & SUITES", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Vertiq-Hospitality-Partners", "job_url": "https://nl.indeed.com/viewjob?jk=5882782271a05776", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-18", "recruiter_email": null, "applicant_count": null, "description": "**INFORMATION****Job Ref:**  \n\nPN1575497AmsRIRHS\n\n\n**Location:**\n  \n\nAmsterdam, Amsterdam, Netherlands\n\n\n**Postcode:**  \n\n1083 DJ\n\n\n**Type of contract:**\n  \n\nContract\n\n\n**Salary:**  \n\n€650\\.00 to €650\\.00 Per Month\n\n\n**Posted Date:**\n  \n\nMonday, May 18, 2026\n\n\n**Closing Date:**\n  \n\nTuesday, June 30, 2026\n\n  \n\n\n\n**RESERVATIONS INTERNSHIP RADISSON HOTEL \\& SUITES**Ready to turn inquiries into experiences and connections into revenue?\n\n\nCome join our team at **Radisson Hotel \\& Suites Amsterdam South**, part of Radisson Hotels, as a **Reservations Intern**, where no two days are the same!\n\n\nThis property is managed by Vertiq Hospitality Partners, formerly known as Cycas Hospitality, established in 2008\\. Vertiq Hospitality Partners is evolving from a hotel management company to an operating partner with a clear **Vision: to be the trusted operating partner in European hospitality investments.**\n\n\nRadisson Hotel \\& Suites Amsterdam South has 227 suites and rooms and opened in April 2021\\. We want to appeal to both transient and longer\\-staying travellers visiting the Dutch capital. Each of the studio’s, one\\-bed and two\\-bed apartments has its own fully equipped kitchen. It is up to us to make our guests feel at home with our family of associates! All rooms are suites with more living and working space than you would find in an any other hotel room.\n\n\nAs Reservations Intern, you will becom ity to gain hands\\-on experience in strategic planning, reporting, data analysis, cost benchmarking and more.\n\n\n\nYou will have significant internal exposure to senior stakeholders and need to be committed to deliver.\n\n\nIn this role you will:\n\n\n* Gather and compile data from various external benchmark sources.\n* + Ensure data quality and integrity by performing cleaning and validation processes.\n* + Analyze benchmark data to identify trends, patterns, and anomalies.\n* + Compare external data against internal performance metrics.\n* + Utilize statistical methods and tools to interpret data sets.\n* + Create detailed reports and presentations to summarize findings.\n* + Maintain automated dashboards and visualization tools to communicate insights effectively.\n* + Assist in preparing executive summaries and strategic recommendations\n* + Identify opportunities for process improvements\n* + Stay updated with the latest trends externally with peer companies\n\n\nDuring your internship you will get the opportunity to get to know HEINEKEN as a company, also outside your department. We give you the trust and freedom, so you can work like a real entrepreneur. We like to bring the outside world inside and therefore we embrace new, fresh ideas with enthusiasm. Of course always with the guidance that is right for you.\n\n\n\nYour working environment\n  \n\nYou will report to the Global Program Lead\\- Design to Sustainable Value. You will work closely with the Packaging and Raw Materials Team. The team consists of a very ambitious, diverse, international group of sourcing professionals. The role is cross functional interacting closely with Commerce, Finance, Supply Chain, Innovation, Transformation Teams etc\n\n\n* Your starting date is 1 September 2026\n* The internship is fulltime\n* The duration of the internship is 6 months\n* It is a practice\\-oriented internship\n* You will be based in Amsterdam\n* During your internship, you have the flexibility to work in
