 2 months, which can be extended up to a total period of 6 months. The Internship is UNPAID and full\\-time. Interns work 5 days per week (35 hours) under the supervision of a staff member in the programme, project or unit to which they are assigned. Applicants for this internship position are expected to undertake the internship in a hybrid modality: applicants are expected to work from the premises in The Hague, The Netherlands, as well as remotely. Therefore, applicants must have all necessary arrangements and equipment (including a computer and internet connection) to perform assignments in teleworking. Under the supervision of the Head of the Centre, the intern will assist in the implementation of the activities of UNICRI’s Centre for AI and Robotics. In particular, the intern will contribute to the improvement of a project website. Examples of duties to be performed by the intern may include: Export all content from a Drupal website. Provide support on the configuration of a WordPress website. Assist in editing, updating, importing and uploading available content, such as text, documents, images, videos, etc., in a visually appealing way onto the WordPress website. Evaluate the effectiveness of technical elements and make recommendations for improvements. Monitor local, regional and international sources for relevant trends, developments, technological innovations, articles and news items. Communicate project status, issues and risk factors to the project team. Participate in determining technical requirements and planning technical aspects of various UNICRI Centre projects. Perform other related duties as assigned.\nQualifications/special skills\nApplicants must at the time of application meet one of the following requirements: (a) Be enrolled in, or have recently completed, a graduate school programme (second university degree or equivalent, or higher); (b) Be enrolled in, or have completed, the final academic year of a first university degree programm", "source": "indeed"}, {"company": "Eurofins Belgium Forensic Services", "job_title": "Data Privacy Compliance Internship", "location": "Maastricht, LI, NL", "careers_url": "https://nl.indeed.com/cmp/Eurofins-Belgium-Forensic-Services", "job_url": "https://nl.indeed.com/viewjob?jk=1bd21df729c31da9", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "**Bedrijfsomschrijving**  \n\nEurofins Forensics Benelux consists of laboratories located in both Belgium (Bruges) and The Netherlands (Maastricht/Amsterdam). As a Forensic Service Provider, Eurofins Forensic Benelux works in a highly regulated environment and must maintain and evidence high standards continuously. At present, the laboratories hold accreditation to ISO/IEC 17025:2017 and work in compliance with ISO/IEC 27001:2022\\. Due to the nature of the work, all laboratories handle sensitive, special category data on a daily basis and therefore management and protection of this information is critical.\n\n **Aanvullende informatie** **Internship overview**\n\n\nThis internship will provide a Dutch/Belgian student with in‑depth, practical experience in data privacy management, with a strong focus on Data Protection Impact Assessments (DPIAs) and the sustainable embedding of privacy risk management within the organization.\n\n\nThe intern will be actively involved in assessing privacy risks related to personal data processing activities, particularly in contexts involving special categories of data and criminal or law‑enforcement‑related data. The internship aligns theoretical knowledge of EU, Belgian and Dutch privacy legislation with real‑world governance, operational processes, and compliance requirements.\n\n*The internship is learning**‑**oriented and does not require a dedicated end project, though a formal assignment or report can be arranged if required by the educational institution.*\n\n**Objective**:\n\n\nThe primary objective of the internship is to enable the student to develop practical competency in conducting DPIAs, managing privacy risks and assisting with identified improvement actions in a sustainable manner.\n\n\nThis will include:\n\n* Gaining hands‑on experience in performing and documenting DPIAs.\n* Learning how to assess compliance with the EU General Data Protection Regulation (GDPR).\n* Understanding and applying Belgian and Dutch sector\\-specific data privacy legislation.\n* Developing skills to embed DPIAs into organizational governance and management systems.\n* Understanding how privacy risks are identified, mitigated, monitored, and reviewed over time.\n* Supporting with internal and external data and information audits.\n* Strengthening professional skills in legal interpretation, structured analysis, reporting, and stakeholder collaboration.\n\n\nThe intern will receive structured supervision and regular feedback. If required by the educational institution, learning objectives, competencies, and assessment criteria can be formally aligned and documented.", "source": "indeed"}, {"company": "Workwize", "job_title": "Customer Success Manager Internship", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/work-wize", "job_url": "https://www.linkedin.com/jobs/view/4419558749", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-27", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "alpha.one", "job_title": "Content Marketing Intern", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/alpha.one", "job_url": "https://www.linkedin.com/jobs/view/4417221289", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-27", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Boomerang. Part of Publicis Groupe", "job_title": "Int gie.\n* **Vertalen van kennis naar AI\\-ondersteuning**  \n\nSamen met consultants onderzoek je hoe we onze inhoudelijke expertise kunnen inzetten in AI\\-tools, zodat deze beter aansluiten op de praktijk en meer waarde leveren.\n* **Experimenteren met nieuwe AI\\-mogelijkheden**  \n\nJe verkent en test de nieuwste generaties AI\\-tools om te bepalen hoe ze concreet ingezet kunnen worden in ons werk en bij klanten.\n\n\n**Wie ben jij?**\n\n* Je bent een masterstudent (of 3e jaars bachelor) in Artificial Intelligence, (Behavioural) Data Science, Econometrie, Wiskunde, Statistiek of vergelijkbaar\n* Je hebt ervaring met Python of R en Excel\n* Je hebt een sterke interesse in AI en volgt actief de ontwikkelingen in het veld\n* Je vindt het interessant om AI praktisch toepasbaar te maken in organisaties\n* Je bent analytisch én creatief: je ziet snel de kern en bedenkt slimme oplossingen\n* Je hebt affiniteit met het werken op het snijvlak van mens, gedrag en technologie\n* Je spreekt en schrijft vloeiend Nederlands en Engels\n* Je bent beschikbaar voor een meewerkstage (4 dagen per week, ±5 maanden)\n\n\n**Wat bieden we je?**\n\n* Een inspirerende werkomgeving met collega’s van wie je veel kunt leren\n* Intensieve begeleiding en de ruimte om echt bij te dragen aan projecten\n* Flexibiliteit om thuis of op kantoor (Utrecht/Amsterdam) te werken\n* Een stagevergoeding van €800 bruto per maand (bij 4 dagen per week)\n\n\nOnze cultuur laat zich het beste omschrijven door onze kernwaarden *intensiteit, authenticiteit, vriendschap* en *playfulness*, waarmee we een innovatie", "source": "indeed"}, {"company": "KPMG", "job_title": "Stagiair(e) HR Insights & Portfoliomanagement", "location": "Amstelveen, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Kpmg-0828bc85", "job_url": "https://nl.indeed.com/viewjob?jk=3b50dba75b42259b", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-28", "recruiter_email": null, "applicant_count": null, "description": "**B ocesses:** het verbeteren van terugkerende HR\\-cycli zoals beoordelingen en surveys.\n* **HR Data, Insights \\& Analytics:** het verzamelen, analyseren en visualiseren van HR\\-data voor datagedreven besluitvorming.\n* **Data Governance Employee Domain:** het waarborgen van datakwaliteit en compliance binnen het HR\\-domein.\n* **HR Controls \\& Compliancy:** het naleven van interne en externe richtlijnen en het versterken van HR\\-controles.\n\n\nAfhankelijk van jouw studieachtergrond, interesses en leerdoelen kijken we samen hoe we de stage zo goed mogelijk kunnen vormgeven. Je kunt je verdiepen in één van de focusgebieden van het team, zodat de stage optimaal aansluit bij jouw ontwikkeling en ambities. Bijvoorbeeld:\n\n* Tijdens je stage ondersteun je bij het ontwikkelen en implementeren van innovatieve oplossingen die HR\\-processen automatiseren en verbeteren. Je helpt bij het structureren en monitoren van het HR\\-projectportfolio, stelt projectplannen op, bewaakt voortgang en signaleert risico’s. Daarnaast denk je mee over het ", "source": "indeed"}, {"company": "Dorst & Lesser", "job_title": "Stage Social Media Specialist", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Dorst-&-Lesser", "job_url": "https://nl.indeed.com/viewjob?jk=45d1eacf1a5ad8c1", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-28", "recruiter_email": null, "applicant_count": null, "description": "Stage Social Media Specialist\n\n\nInternship · Amsterdam\n\n\n\n**Ben jij altijd als eerste op de hoogte van wat er speelt op Instagram en TikTok? En wil je weten waarom bepaalde content wél werkt en andere niet? Dan zoeken we jou!**\n\n\n**Als Stagiair(e) Social Media Specialist bij Team Connect (Dorst \\& Lesser) werk je mee aan de dagelijkse social activiteiten voor merken als Action, Alpro, HORNBACH, Jägermeister, Center Parcs, Fritz\\-kola, Hoog Catharijne en John West. Team Connect is verantwoordelijk voor de channels \\& performance v nen social media;\n* Een stagevergoeding van €350,\\- per maand;\n* Een heerlijke gezamenlijke lunch en gezellige vrijdagmiddagborrels;\n* Een inspirerende werkplek in hartje Amsterdam, vol jonge en creatieve collega's, de nieuwste trends en eindeloze momenten om van én met elkaar te leren.\n\n  \n\n  \n\n**Startdatum**: september 2026  \n\n\nwant to team up? get in touch.\n\n\n\nwe're ready when you are.", "source": "indeed"}, {"company": "IKEA", "job_title": "Stage Corporate Communications", "location": "Haarlem, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Ikea", "job_url": "https://nl.indeed.com/viewjob?jk=16d356d02ab281fb", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-27", "recruiter_email": null, "applicant_count": null, "description": "\"You care about making a positive impact in the world. You understand greatness requires thinking differently. An inclusive and accepting work environment is important to you.\n\n\n\nA job at IKEA is so much more than home furnishings. Together, we work to make a better everyday life for the many. It's the perfect fit if you want to contribute, grow, and share. Join the team and start a better life for yourself.\"\n\n\n\n* Location\nHaarlem\n* Department\nMarketing \\& Communicatie\n* Deadline\n2026\\-06\\-19\n\n  \nCandidate Profile (text) Een dag in je leven met ons\n  \n\nBen jij de imbussleutel die alles aan elkaar verbindt, de KALLAX die het overzicht bewaart of wil je gewoon wat vaker Zweedse balletjes eten? Kom dan nu ervaring op doen in het Communicatie \\& Marketingteam van IKEA Nederland. In deze rol leer je meer over marketing en corporate communicatie, met een focus op PR en interne communicatie.\n  \n\n  \n\nWat je gaat doen:\n  \n\n* Monitoren, bijhouden en delen wat er in de media over IKEA wordt gedeeld;\n* Support bij het maken van (interne) video’s, posters en andere communicatiematerialen;\n* Support bij de het uitlenen van onze producten aan journalisten en influencers;\n* Support bij de strategie en uitvoer van het LinkedIn account van IKEA in Nederland.\n\n  \n\nOns team binnen IKEA\n  \n\nKun je het je voorstellen? IKEA begon als een klein postorderbedrijf in Älmhult, een klein dorp in Zweden. Tegenwoordig zijn we actief in 63 landen met een uniek assortiment. Werken bij IKEA betekent werken in een wereld aan ideeën, door onze collega's beschreven als een plek waar iedereen welkom is en je jezelf kunt zijn. Altijd vanuit het idee om een beter dagelijks bestaan te creëren voor zoveel mogelijk mensen. Bij IKEA kan je je carrière kunt vormgeven en is er volop ruimte is voor je praktische creativiteit en ideeën. Dit alles terwijl je in een geweldig team werkt met collega's die er altijd voor je zijn en klaarstaan om te helpen wanneer dat nodig is.  \n\n  \n\n  \n\n  \n\nJe komt te werken in het Communicatie \\& Marketingteam, waar we met ongeveer 25 collega’s werken aan het versterken van het merk IKEA.\n  \n\n  \n\nWie je bent\n  \n\nBij IKEA vinden we het belangrijk dat je jezelf kunt zijn en dat je niet bang bent om je mening te delen. Wat je verder nog nodig hebt:\n  \n\n* Interesse in marketing en communicatie (zowel intern als extern);\n* Je volgt een HBO\\-opleiding en bent op zoek naar een meewerkstage;\n* Je bent een aanpakker en hebt weinig instructies nodig om aan de slag te gaan;\n* Je maakt graag video’s, posters of andere vormen van content en begrijpt dat dit binnen de huisstijl en tone\\-of\\-voice van IKEA gebeurt.\n\n  \n\n  \n\nWat er nog meer belangrijk is\n  \n\n  \n\nWat je kan verwachten als je stage loopt bij IKEA:\n  \n\n  \n\n* We zijn trots op onze informele, open werksfeer waar jouw mening telt.\n* Een leuke, educatieve, dynamische plek om stage te lopen en jezelf te ontwikkelen.\n* Naast alle kennis en ervaring die je bij ons opdoet, ontvang je een maandelijkse stagevergoeding van €3", "source": "indeed"}, {"company": "Klepper & Klepper - De Beste Drop Ooit", "job_title": "Stage: Social Media (Content Creator)", "location": "Edam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Klepper-&-Klepper---De-Beste-Drop-Ooit", "job_url": "https://nl.indeed.com/viewjob?jk=27c4909713b85801", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-27", "recruiter_email": null, "applicant_count": null, "description": "**Word onze nieuwe Social Media (Content Creator) Stagiaire?** \n\n**Ben jij klaar om impact te maken?**  \nWil jij de zoete smaak van succes proeven? Dan is dit jouw kans! Wij zijn De Beste Drop Ooit, de crème de la crème van de dropwereld. Met ons premium assortiment, dat niet alleen heerlijk is maar ook nog eens glutenvrij en gelatinevrij, veroveren we Nederland. Onze producten vind je niet in de doorsnee supermarkt maar wel in zo’n 2500 winkels en nog 8 andere landen. Elke dag zetten we een stapje dichter naar een duurzame toekomst en dit wordt beloond, met trots mogen we sinds 2023 zeggen dat we officieel B\\-Corp gecertificeerd zijn! Om ons bereik te vergroten, bedenken we de meest knallende campagnes en tofste acties voor al onze socials. Zo was onze laatste campagne (Bedenk de Smaak) een groot succes met miljoenen views en meer dan tienduizend inschrijvingen.\n\nBen jij een ware storyteller met een passie voor filmen en editen? Wil jij jouw creatieve brein laten sprankelen in een dynamisch marketingteam? Dan zijn wij op zoek naar jou! Als Stagiair Social Media (Content Creator) krijg je de kans om niet alleen bij te dragen aan onze groeiende community, maar ook om jouw eigen stempel te drukken op onze online aanwezigheid.\n\n**Je werkzaamheden kunnen bestaan uit:**\n\n* Kick\\-ass marketing campagnes ondersteunen\n* Samenwerken met ons marketingteam om pakkende content te creëren voor onze socials.\n* Onze website up\\-to\\-date houden\n* Het bedenken en uitvoeren van creatieve campagnes die onze doelgroep aanspreken\n* Filmen, editen en delen van boeiende videocontent die onze merkidentiteit versterkt.\n* Actief meedenken over nieuwe en innovatieve manieren om ons merk te promoten\n* Kennisbank artikelen en nieuwsbrieven maken\n\n**Wat wij jou kunnen leren:**\n\n* Je leert schakelen tussen TikTok (jongere doelgroep) en Instagram/Facebook (oudere doelgroep).\n* Niet alleen \"content maken\" maar ook leren en onderzoeken wat het effect hiervan is\n* Leren werken met een overkoepelende strategie\n* Door wekelijkse 1 op 1 momenten met je stagebegeleider krijg je echt de kans om jezelf te ontwikkelen\n* Je leert zelfstandig werken, maar je staat er nooit alleen voor\n\n**Wat wij vragen:**\n\n* Je leeft en ademt social media en contentcreatie.\n* Een passie voor marketing en een creatieve geest die altijd op zoek is naar nieuwe ideeën\n* Ervaring met het editten van video's .\n* Je vindt zoetwaren/drop interessant\n* Je **D\\*urft,** R**elativeert, bent** O**nsaai en hebt** P\\*assie!\n* Een frisse kijk en nieuwe perspectieven\n\n**Wat wij bieden**\n\n* Een dynamische werkplek waar jouw creativiteit tot leven komt.\n* Stagevergoeding van €400,\\- euro per maand \\+ lunch\n* Ruimte voor eigen initiatief en persoonlijke ontwikkeling.\n* Een hecht, team dat samenwerkt in een informele en energieke omgeving.\n* Een omgeving waar jouw ideeën worden gehoord en gewaardeerd.\n* Leuke teamactiviteiten, zoals etentjes, borrels en teamuitjes, om successen samen te vieren.\n\n**Durf jij de uitdaging aan?** ", "source": "indeed"}, {"company": "Dandelie", "job_title": "Internship Marketing & Communication", "location": "Groningen, GR, NL", "careers_url": "https://nl.indeed.com/cmp/Dandelie", "job_url": "https://nl.indeed.com/viewjob?jk=a915bdfe0c6bca82", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": "isabelle@dandelie.com", "applicant_count": null, "description": "As a **Marketing and Communications intern**, you will be working on the internal and external branding of Dandelie, and help implement the marketing activities. You will be contributing to the company by planning and creating new and unique content based on continuously developing strategies.\n\nYou will be **responsible** for creating and editing content, including static images, videos, and newsletters. You will be running paid campaigns and making reports of the content performance (organic \\& paid).\n\nWe encourage you to stay updated on the latest news regarding digital marketing and social media, giving you many different learning opportunities.\n\n**Who are you?**  \nYou are an enthusiastic and positive communicator, with a great internal drive to get the best results! You are detail\\-oriented and always focused on finding a solution, you like coming up with creative ideas and have some design experience. You are well organized, not afraid of deadlines nor afraid to communicate and you know how to keep a clear overview while working on multiple projects.\n\n**What do we offer?**  \nWorking as an intern at Dandelie means you’ll be working in a highly energetic and international environment. It is a place to learn, experiment, discover, and develop yourself in a fast\\-growing start\\-up located in Groningen. We encourage you to ask questions and are always open to refreshing ideas since we believe we grow and develop better together. We offer an internship compensation.\n\n**About us**  \nDandelie, founded by two sisters chasing their dream. Inspired by the cycle of the dandelion flower. After its blooming period the seeds are taken by the wind to find a new destination. Both the nomadic character and cycle of life are what we stand for. Collecting vintage and handmade treasures from all over the world, each with its own story.\n\n**Job requirements \\- You are:**\n\n* Available from July for our summer internship or start in September with our Fall internship.\n* Good writing skills in English. Dutch is a pre, but not necessary as all our communications are in English!\n* Active on social media and involved with writing blogs, articles, etc.\n* Passionate for Social Media and our style.\n* What makes you unique\n* Your communication skills are on point and you are not afraid to get involved and ask questions.\n* You have a good eye for details and design.\n* You are well organized and good at planning multiple projects at the same time.\n* You are accurate, flexible, and adaptable to change.\n* You are good at analyzing results.\n* You are able to propose solutions for issues and update strategies as needed.\n* Knowledge of/experience working with Canva and Adobe Package is a plus\n\nSend your resume and motivation letter or video to isabelle@dandelie.com\n\nSoort dienstverband: Stage  \nContractduur 5 maanden\n\nFlexibele taalvereiste:\n\n* Nederlands niet vereist\n\nTaal:\n\n* Engels (Vereist)\n\nWerklocatie: Fysiek", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship - Field Sales en Shopper Executie", "location": "Leiden, ZH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=04c57f3b87a52429", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "Internship – Field Sales en Shopper Executie\n\n\n\nElke dag resultaat zien van mijn werk in vrijwel iedere supermarkt in Nederland, daarom ga ik met plezier naar mijn stage!\n\n\n\nDe stage\n\n\n\nBen jij klaar om impact te maken op de winkelvloer én mee te werken aan sterke A\\-merken? Tijdens deze stage draai je volledig mee in het Field Sales Team van Heineken – de plek waar strategie tot leven komt. Je gaat een bijdrage leven aan:\n\n\n* De verkoop tools voor de Winkel Account Managers\n* Behalen van perfecte executie op de winkelvloer;\n* Vergroten van zichtbaarheid en verkrijgbaarheid van het Heineken Nederland portfolio op de winkelvloer\n* Vergroten van ons marktaandeel binnen een concurrerende markt.\n\n\nJouw nieuwe team en werkplek\n\n\n\nHet team bestaat uit 13 winkelaccountmanagers die door heel Nederland actief zijn op de winkelvloer. Vanuit kantoor in Leiden werkt een kernteam van vijf collega’s (National Field Sales Manager, Sales Manager, Coördinator en twee Activatiecoördinatoren) nauw met hen samen – en met jou als stagiair.\n\n\n\nBinnen dit dynamische team werk je mee aan de dagelijkse uitvoering van onze commerciële plannen. Van opvallende merkactivaties en de lancering van nieuwe producten tot het ondersteunen van winkels bij de verkoop van Heineken\\-producten: geen dag is hetzelfde.\n\n\n\nDe echte uitdaging? Alle verschillende inzichten, kansen en ideeën samenbrengen en vertalen naar een krachtige executie op de winkelvloer. Jij speelt hierin een actieve rol en leert hoe je commerciële impact maakt waar het er echt toe doet: bij de klant\n\n\n\nTijdens je stage krijg je alle ruimte om HEINEKEN als organisatie te leren kennen, niet alleen binnen jouw eigen afdeling, maar ook daarbuiten. We geven je het vertrouwen en de vrijheid om te werken als een echte ondernemer. Bij HEINEKEN halen we de buitenwereld graag naar binnen en staan we open voor nieuwe, frisse ideeën. Natuurlijk zorgen we daarbij voor de begeleiding die bij jou past.\n\n\n\nDe unieke jij!\n\n\nWij geloven dat iedereen unieke talenten heeft en zijn daarom op zoek naar jou! Energie, drive en de wil om te groeien: bij HEINEKEN geloven we dat dát het verschil maakt. Daarnaast neem jij ook het volgende mee:\n\n\n* Je bent bezig met een HBO of WO opleiding\n* Je bent geïnteresseerd in commercie en retail\n* Je bent op zoek naar een leuke meewerkstage waar je veel verantwoordelijkheid krijgt\n* Je bent ondernemend, houdt van aanpakken en komt zelf met ideeën\n* Je bent sociaal, communicatief sterk (Nederlands) en houdt van een beetje reuring\n\n\nZelfs als je denkt dat je niet aan alle criteria voldoet, moedigen we je aan om te solliciteren. Een stage is de perfecte kans om te leren en te groeien!\n\n\n\nVoorwaarden vanuit HEINEKEN\n\n\n\n* Je bent gedurende de vol taald** Ja\n**Organisatie** Oranje Fonds\n**Organisatie**\n---------------\n\n\nEen samenleving waarin niemand er alleen voor staat en iedereen mee kan doen. Daar staat het Oranje Fonds voor. Het gevoel dat je ertoe doet, is helaas niet voor iedereen vanzelfsprekend. Bijvoorbeeld door armoede, uitsluiting, eenzaamheid of psychische problemen. Zelfs al ben je sterk en kun je veel zelf: je komt er niet altijd alleen uit.\n\n\nGelukkig zijn er in Nederland en op de Cariben talloze sociale initiatiefnemers. Dat zijn mensen die een probleem zien en er iets aan doen!\n\n\nWij zijn er voor deze initiatieven. We helpen hen vrijwilligers te mobiliseren \\- bijvoorbeeld via NLdoet en Maatjes \\- en bieden initiatieven ook steun waarvan de waarde niet in geld is uit te drukken: de erkenning en zichtbaarheid die ze verdienen én nodig hebben om succesvol te kunnen zijn.\n\n\n**Taken**\n---------\n\n\nAls stagiair(e) marketing communicatie bij het Oranje Fonds word je onderdeel van het team Communicatie \\& Merk. Je werkt mee op de afdeling in een team van twaalf marketing communicatie\\-experts. Het team bestaat o.a. uit Communicatie Adviseurs, Content Marketeers, Online Marketeers en een Brand Manager. Als stagiaire marketingcommunicatie krijg je begeleiding van het contentteam en mag je meewerken aan verschillende communicatie\\-uitingen van het Oranje Fonds. Vooral digitaal. Zo werk je mee aan de websites, social media, online video campagnes, (digitale) nieuwsbrieven en online strategie (zoals webcare, social media en de website). En leuk als je aanschuift en meedenkt bij strategische online en content marketing overleggen!\n\n\nJe gaat je het content management systeem (CMS) eigen maken, waarmee je de inhoud van 5 verschillende websites van het Oranje Fonds kan beheren en verbeteren. Je krijgt een kijkje in de keuken bij de projecten van het Oranje Fonds zoals NLdoet en Burendag, waarbij communicatie naar de verschillende doelgroepen een cruciaal en leerzaam onderdeel is. Kortom een leuke leerzame stage voor iemand die ambities heeft om zich te ontwikkelen tot een echte communicatieprofessional.\n\n\n### **Wat maakt deze stage extra bijzonder?**\n\n\n\nIn januari viert het Oranje Fonds zijn 25\\-jarig jubileum in het GelreDome, waarbij ook de Koning en Koningin aanwezig zijn. Rondom dit bijzondere evenement gebeurt veel op communicatiegebied: van campagnes en social content tot video’s, nieuwsbrieven, uitnodigingen en interne communicatie.\n\n\n\nAls stagiaire krijg je de kans om hier niet alleen aan mee te werken, maar ook van dichtbij te ervaren hoe de communicatie rondom zo’n groot evenement wordt opgezet en uitgevoerd. Je ziet dus hoe alles samenkomt in de praktijk én draagt zelf actief bij aan de uitwerking.\n\n\n\nKortom: een leerzame, creatieve en veelzijdige stage waarin je echt meewerkt aan communicatie die ertoe doet.\n\n\n### **Functie\\-eisen en profiel**\n\n\nBen jij op zoek naa", "source": "indeed"}, {"company": "DPG Media", "job_title": "Stagiair Learning & Development", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Dpg-Media", "job_url": "https://nl.indeed.com/viewjob?jk=018cb1eefa373343", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "**Ben jij klaar om jezelf te ontwikkelen en impact te maken?**\n\n**Amsterdam** \\- Als stagiair(e) bij ons Learning \\& Development (L\\&D) team krijg je de kans om jouw talenten in te zetten en mee te werken aan het succes van 6\\.000 collega’s. We zoeken een enthousiaste student die ons helpt om leren leuker, slimmer en toegankelijker te maken. Of je nu een passie hebt voor het ontwerpen van learning journeys of het ontwikkelen van (digitale) trainingen: bij DPG Media krijg je de ruimte om te schitteren!\n\n**Wat wij doen**\n\n\nAls L\\&D professionals helpen wij DPG Media voorop te blijven lopen. Dit doen we door een relevant open aanbod van trainingen, webinars en e\\-learnings aan te bieden op de online Academy en jaarlijks een strategisch ontwikkelplan op maat voor business units te ontwikkelen. Dit alles doen wij in lijn met de strategie van DPG Media.\n\n**Wat ga je doen?**\n\n\nTijdens jouw stage werk je aan echte projecten en krijg je de ruimte om je creativiteit en kennis in te zetten.\n\n\nJouw taken:\n\n* Learning journeys ontwerpen: Je ontwikkelt leertrajecten die aansluiten bij de behoeften van verschillende teams of doelgroepen.\n* E\\-learnings creëren: Je helpt bij het ontwikkelen en verbeteren van digitale leermiddelen, waarbij jouw didactische expertise centraal staat\n* Trainingen en webinars organiseren: Samen met onze L\\&D Specialisten en Coördinatoren werk je aan het logistieke en inhoudelijke proces.\n* Onboarding ondersteunen: Je speelt een actieve rol in de onboarding van nieuwe collega’s in Amsterdam en Antwerpen.\n* Aanbod van leveranciers: Vanuit jouw didactische kennis kun je meebeslissen over selectie van leveranciers voor onze maatwerktrainingen.\n\n\nHeb jij zelf ideeën over hoe je waarde kunt toevoegen? We horen ze graag! Na jouw stage kun je zeggen dat je toffe dingen hebt bereikt en hebt gewerkt bij het grootste mediabedrijf van Nederland. Zet dat maar op je cv!\n\n**Wat we bieden**\n\n* Een meewerk stageplek bij een enthousiast team, in het hart van HR, waar je kennismaakt met het volledige bedrijf.\n* Aantal uur (tussen 32 en 40\\) en dagen in overleg in te vullen.\n* Marktconforme stagevergoeding en toegang tot onze online Academy.\n* Een dynamische werkomgeving waarin je veel kunt leren over Learning \\& Development en media.\n\n **Wat de ideale stagiair(e) biedt**\n\n* HR\\-gerelateerde opleiding op HBO of WO niveau, bijv. HR(M), Opleidingskunde, Arbeids\\- en organisatiepsychologie.\n* Je hebt een passie voor leren en ontwikkelen, met specifieke interesse in didactiek en (digitale) leeroplossingen.\n* Je bent zelfstandig, proactief en communicatief ingesteld.\n* Je spreekt, leest tack, employer branding, social), en één die creatives gaat maken voor onze klanten. Welke kant het beste bij jou past? Dat zoeken we samen uit in het gesprek. Je hoeft dus nog niet te kiezen.\n\n\n\nBij ons ben je als stagiair een onmisbaar radertje in het geheel. Want stagiairs doen bij ons echt een deel van de Dingen Die Ertoe Doen. Jij ondersteunt het content\\- en socialteam met video, foto, design en alles wat erbij komt kijken. Van een reel voor een klant tot een carrousel voor onze eigen , van een productvideo tot een snelle social ad.\n\n\n\nEn terwijl jij zo lekker aan het filmen, monteren en designen bent, halen wij koffie voor je.\n\n\n### **Ons track record**\n\n\n**Wij zijn Doublesmart, en wij zijn me er eentje.**\n---------------------------------------------------\n\n\nWij zijn me er eentje: we zijn niet alleen heel bescheiden, maar we zijn ook nog eens het allertofste onlinemarketingbureau van Gouda en omstreken.\n\n\n\nWie Doublesmart zegt, zegt ‘online koplopers’. We leveren SEO, SEA, social media en content aan heel veel verschillende bedrijven die hun klantenkring en omzet op een duurzame, slimme manier willen laten groeien. En goeie content — bewegend én stilstaand — is daarin steeds belangrijker. Daar kom jij om de hoek kijken.\n\n\n\nWe zijn altijd bezig met winnen voor onze klanten. Alles wat we doen, doen we vol overgave. Als we ergens niet voor de volle 100% voor kunnen gaan, doen we het niet. Dat geldt ook voor de creatives die hier de deur uitgaan: liever één goeie video dan tien middelmatige.\n\n\n\nMet z’n 40’en zitten we in een mooi pand in de binnenstad van Gouda. Een goed uitziend kantoor (lekker als achtergrond voor een filmpje, trouwens), 3 minuten lopen naar de trein. En een broodje of ijsje halen we zo vanaf onze werkplek.\n\n\n\nJe ziet: we hebben echt heel weinig te ", "source": "indeed"}, {"company": "Sofitel", "job_title": "Sales Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Sofitel", "j zing. Echter kan er nog steeds contaminatie van de motor afkomen. Contaminatie kan vele verschillende oorzaken hebben. Denk hierbij een behuizing die toch niet helemaal goed sluit, zodat er toch gassen van binnenuit komen. Tevens kan er ook contaminatie op de motor achterblijven door het productie proces. Denk hierbij bijvoorbeeld aan huidvet van vingerafdrukken of de productieomgeving waarin de producten worden gefabriceerd.  \n\n  \n\nDe mate van contaminatie word gemeten door middel van een methode genaamd Rest Gas Analyse (RGA). Hierbij word een product of een sample in een vacuüm kamer gebracht en afgepompt. Vervolgens wordt met massa spectrometrie en drukmetingen bepaald wat de mate van contaminatie is. Tevens wordt met deze methode ook een massaspectrum bepaald.\n\n**Wat ga je doen?**\n\n* In kaart te brengen welke contaminatie bronnen er (zouden kunnen) zijn\n* Deze bronnen classificeren in ernst door bewust contaminatie aan te brengen op een schoon sample zodat dit gemeten kan worden met onze RGA machine\n* Deze informatie gebruiken om een database aan te leggen\n* Ontwerpen van een standaard sample blokje voor het uitvoeren van deze metingen\n* Het maken van een tool waarmee we het RGA spectrum uit de ruwe data bestanden van de RGA machine kunnen halen\n* Met deze informatie vervolgens een RGA “footprint” afleiden voor elke afzonderlijke contaminatie\n\n**Wat neem je mee?**\n\n* Je volgt een hbo opleiding Technische Natuurkunde\n* Je vindt het leuk om dingen zelf uit te zoeken én gestructureerd te werken\n* Je werkt nauwkeurig en kunt technische keuzes goed onderbouwen\n* Je past goed in een informele, innovatieve en resultaatgerichte werkomgeving\n* Goede beheersing van de Nederlandse én Engelse taal in woord en geschrift.\n\n**Wat bieden wij jou?**\n\n* Een uitdagende stage met veel ruimte voor eigen initiatief\n* Begeleiding door ervaren engineers en toegang tot hightech faciliteiten\n* Een actieve rol in een opstartend innovatieproject met zichtbare impact\n* Een prettige werksfeer met korte lijnen en betrokken collega’s\n* Stagevergoeding en kans op een loopbaan bij Tecnotion na je afstuderen\n\n**Tecnotion**  \n\nTecnotion ontwikkelt en produceert lineaire en torque motoren welke wereldwijd worden ingebouwd in industriële toepassingen. Al bijna 30 jaar worden onze motoren gebruikt voor semiconductors, werktuigmachines, robotica en automatisering, wetenschap en display toepassingen.  \n\nMet 425 collega’s wereldwijd, waarvan ruim 250 op ons hoofdkantoor in Almelo, hebben wij unieke kennis in huis en bedienen wij het complete proces, van productontw", "source": "indeed"}, {"company": "Ballast Nedam", "job_title": "Stage Human Resource Management", "location": "Kootstertille, FR, NL", "careers_url": "https://nl.indeed.com/cmp/Ballast-Nedam", "job_url": "https://nl.indeed.com/viewjob?jk=62be6380ebeba2fc", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": null, "applicant_count": null, "description": "#### **Wat ga je doen**\n\n\nWil jij je zo breed mogelijk ontwikkelen op het gebied van HRM? Voel jij je prettig in een organisatie waar je de ruimte krijgt om je eigen ideeën te ontwikkelen en impact te maken in de organisatie? Solliciteer dan op onderstaande vacature!\n\n\nSamen met onze HR\\-bussinespartner ben jij verantwoordelijk voor het gehele HR\\-proces. Je kijkt en doet mee van on\\- tot offboarding. Je leert hoe je de behoefte aan ontwikkeling bij je collega’s omzet in de juiste trainingen en komt van alles te weten over arbeidsvoorwaarden en ziekteverzuim. Doordat de stage zo breed is opgezet, maak je kennis met alle facetten van HR. Zo ontdek je wat bij je past en waar jouw interesses liggen. Je krijgt bij ons de ruimte om je verder te verdiepen in de onderdelen die jij het meest interessant vindt.\n\n\nEen greep uit de mogelijke opdrachten:\n\n* Een actieve bijdrage leveren aan de optimalisatie van het functiehuis en de bijbehorende werkzaamheden;\n* Meewerken aan ons vitaliteitsprogramma;\n* Training geven gerelateerd aan de gesprekkencyclus;\n* Het organiseren en coördineren van een training ‘werkhouding \\& tilinstructies’en PMO (Periodiek Medisch Onderzoek);\n* Opdrachten die relevant zijn voor jouw opleiding.\n\n\n“Als stagiaire bij Haitsma Beton leer je niet alleen mega veel, maar krijg je ook de kans om mee te werken aan interessante projecten waar jouw ideeën tellen. Je krijgt echt de ruimte om jezelf te laten zien! Kortom, een leuke en leerzame stage waar je volop kansen krijgt!” \\- Mees Bezoet de Bie (oud stagiaire Haitsma Beton).\n\n#### **Wat breng jij mee**\n\n#### **Wat je van ons krijgt**\n\n* Je beheerst de Nederlandse taal zowel in spraak als schriftelijk op goed niveau;\n* Je bent op zoek naar een meewerk of afstudeerstage voor ongeveer 5 maanden in de richting van Human Resource Management;\n* Je vindt het leuk om dingen zelf uit te denken en op te starten en weet daarin zelf ook de juiste collega’s om hulp te vragen;\n* Je brengt energie, bent leer(nieuws)gierig en hebt een ‘getting things done’ mentaliteit.\n* Een laptop van de zaak met toegang tot alle informatie die je nodig hebt;\n* Een stagevergoeding van €600,\\- per vier weken;\n* De eerste twee weken mag je gelijk meekijken of \\-doen in ons productiebedrijf, zodat je leert over onze producten, processen en collega’s\n  \n\nContactpersoon: Claire De Groot\n\n\nHeadertitel: Daag jezelf uit\n\n\nHeader Subtitel: Kom bij ons werken\n\n\nOpleidingsrichting: HRM\n\n\nOver ons: Ballast Nedam is een Nederlands bouw\\- en ontwikkelbedrijf met internationale invloeden. We richten ons op mensen en resultaten. Met grote toewijding bouwen we samen met onze partners aan een duurzame leefomgeving. Elke dag dagen we onszelf uit om te verbeteren. Dat betekent dat we onszelf hard maken om toegevoegde waarde voor onze klanten te creëren en om het welzijn van onze leefomgeving te verbeteren. We zijn open\\-minded, gretig om te leren en gericht op het maken van echte verbinding. We passen onze unieke manier van werken toe om m", "source": "indeed"}, {"company": "Berenschot Groep BV", "job_title": "Stagiair Performance Management & Organisatieontwikkeling", "location": "Utrecht, UT, NL", "careers_url": "https://nl.indeed.com/cmp/Berenschot-Groep-Bv", "job_url": "https://nl.indeed.com/viewjob?jk=791c0a727e86d62e", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": null, "applicant_count": null, "description": "*\\*\\*\\-\\*\\* uur per week \\| Utrecht \\| Hybride \\| \\*\\*\\*\\*\\*\\| \\*\\*\\*\\* \\| Wo*\n\n**Jouw vooruitgang begint bij Berenschot**\n------------------------------------------\n\n\nWil jij bouwen aan de basis van performance management én impact maken op hoe organisaties sturen op resultaat en ontwikkeling? We maken graag kennis met je.\n\n**Dit ga je doen**\n------------------\n\n\nWil jij bijdragen aan hoe organisaties sturen op prestaties én talent? In deze stage werk je aan de fundamenten van performance management én help je deze door te vertalen naar concrete adviesproducten.\n\n\nEen belangrijk onderdeel van je stage is het werken aan zogenaamde referentieprofielen behorende bij het USB systeem en resultaatgericht werken. Je houdt je bezig met:\n\n* Het herstructureren van bestaande referentieprofielen naar een nieuw, toekomstbestendig format dat voldoet aan de format vereisten van Berenschot.\n* Het analyseren van de referentieprofielen en vertalen naar heldere verwachtingen door het scherp formuleren van resultaatgebieden en output\\-indicatoren per referentieprofiel waarbij gebruik gemaakt kan worden van de onlangs ontwikkelde ‘prompt’.\n* Op basis van deze fundamenten werk je daarnaast aan een verdiepend onderzoek naar performance management. Je onderzoekt onder andere:\n* Wat zijn de belangrijkste trends en ontwikkelingen in performance management?\n* Hoe verschuiven organisaties van beoordelen naar continu ontwikkelen?\n* Hoe kun je talent optimaal laten bijdragen aan zowel individuele groei als organisatieresultaten?\n* Je vertaalt jouw inzichten naar praktische toepassingen in onze dienstverlening. Daarbij draag je actief bij aan het versterken van onze adviespropositie:\n* Ontwikkelen van een heldere en aantrekkelijke brochure\n* Opstellen van standaardpresentaties en offertematerialen\n* Vormgeven en verbeteren van workshops en klantinterventies\n\n\nKortom: een veelzijdige stage waarin je werkt aan zowel de inhoudelijke basis (functie en resultaat) als de doorvertaling naar sturen op performance en talent.\n\n**Quote**\n---------\n\n\nBeoordelen is verleden tijd. Tijdens deze stage bouw jij mee aan de toekomst van performance management.\n\n**Hier kom je terecht**\n-----------------------\n\n\nBerenschot is een zelfstandig en onafhankelijk Nederlands organisatieadviesbureau in Utrecht, waar we met meer dan 500 gedreven collega’s werken aan duurzame oplossingen voor de vraagstukken van onze opdrachtgevers. We dragen bij aan vooruitgang in organisaties en de maatschappij met onze adviezen en oplossingen. Onze organisatie heeft een platte structuur zonder partners, waardoor je invloed hebt op de projecten die je uitvoert.\n\n**Dit zijn je directe collega’s**\n---------------------------------\n\n\nWij zijn een adviesgroep die organisaties ondersteunt bij het realiseren van betere prestaties door het optimaal inzetten van talent. We combineren inhoudelijke diepgang met pragmatische oplossingen en werken nauw samen met onze klanten aan duurzame verbetering.\n\n**Dit neem je mee**\n---------", "source": "indeed"}, {"company": "Infotopics B.V.", "job_title": "Stage Marketing", "location": "Oldenzaal, OV, NL", "careers_url": "https://nl.indeed.com/cmp/Infotopics-B.v.", "job_url": "https://nl.indeed.com/viewjob?jk=3e3c6deb456ad68b", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-25", "recruiter_email": null, "applicant_count": null, "description": "Zit jij in het 3*e* of 4*e* jaar van je Hbo\\-studie Media informatie \\& Communicatie of Commerciële Economie met specialisatie digitale marketing, en ben je op zoek naar een leuke meewerkstage om werkervaring op te doen? Bij Infotopics bieden we een leuke stageplek aan vanaf januari/februari. Iets voor jou? Lees dan snel verder!\n\n\n* 32\\-40 uur\n* Oldenzaal\n**Eerst iets over ons**\n\n\n**Wij zijn Infotopics**\n=======================\n\n\n\nLeuk om kennis te maken! Wij als Infotopics zijn in 2003 opgericht met als doel om organisaties te voorzien van Business Intelligence. Bij ons draait het om het inzicht dat je haalt uit je data, niet om de ICT\\-component die dit mogelijk maakt. Daarom zijn heldere datavisualisaties een essentieel onderdeel van al onze rapportages en dashboards.\n\n\n\nWe ondersteunen organisaties, afdelingen en bovenal mensen bij het verkrijgen van inzicht en het beantwoorden van vragen op basis van data. We maken data toegankelijk voor iedereen, waarbij we zowel experts in analytics als datastarters verder helpen met datagedreven werken. Zo kan iedereen succesvoller zijn dankzij de nieuwe inzichten die data biedt.\n\n\n\n Reageer gelijk\n\n\n**Taakverdeling**\n* Ontwikkelen van social media posts\n* Meewerken aan maandelijks terugkerende mailingen\n* Ontwikkelen van blogs en kennisartikelen\n* Schrijven van wervende en informerende teksten\n* AI tools gebruiken voor je werk\n**Is marketing jouw passie?**\n\n\n**Ontwikkel jezelf tijdens een stage marketing**\n------------------------------------------------\n\n\n**Wat ga je doen in je stage?**\n\n\n\nBinnen je stage ga je meewerken met ons marketing team wat bestaat uit je drie nieuwe collega’s. Bij de werkzaamheden kun je denken aan; het ontwikkelen van social media posts, meewerken aan de inhoud van onze maandelijkse mailing naar klanten, het ontwikkelen van blogs en kennisartikelen en het schrijven van wervende en informerende teksten over onze producten en diensten voor op onze website. Ook is er de mogelijkheid om als opdracht uit te zoeken hoe wij AI kunnen gebruiken om onze werkzaamheden te versnellen of verbeteren.\n\n\n**Wat krijg je?**\nJe krijgt een stagevergoeding van €500 per maand van ons.\n\n\nEen leerzame stage met begeleiding en ruimte voor eigen inbreng.\n\n\nEen team van professionals dat jou helpt om je verder te ontwikkelen.\n\n\nJe gaat stage lopen bij een bedrijf waar mensen, feestjes, borrels en uitjes hoog op de agenda staan! Naar onze kwartaal bijeenkomsten wordt ook reikhalzend naar uitgekeken!\n\n\nEn \"last but not least\"! Jouw ontwikkeling staat bij ons centraal!\n\n\n**Dit vragen wij**Jij bent bezig met het 3e of 4e jaar van je Hbo\\-studie Media informatie \\& Communicatie of Commerciële Economie.\n\n\nJe hebt specialisatie digitale marketing opgenomen in je studie. Verder bieden we bij Infotopics een stageplek aan vanaf september. Je moet dus in deze periode kunnen starten.\n\n\nJe bent gemotiveerd en actief opzoek naar een leuke meewerkstage om werkervaring op te doen.\n\n\nNederlands is de voertaal binnen ons ", "source": "indeed"}, {"company": "de Rechtspraak", "job_title": "(Afstudeer)stage Planning & Control", "location": "Groningen, GR, NL", "careers_url": "https://nl.indeed.com/cmp/De-Rechtspraak", "job_url": "https://nl.indeed.com/viewjob?jk=b4a50cf52581a967", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "Werken bij de Rechtspraak betekent werken aan een rechtvaardige samenleving. Ook als stagiair werk jij daar samen met het team aan mee. Wil je weten hoe? Ik vertel het je graag.\n\n**Wat ga je doen?**\n-------------------\n\n\nAls stagiair bij team planning \\& control (P\\&C) lever je een bijdrage aan het in control houden van de processen in onze organisatie. Het management van de rechtbank Noord\\-Nederland kan niet zonder sturingsinformatie en adviezen. Die onmisbare informatie wordt geleverd door team P\\&C. Belangrijke gegevens over bijvoorbeeld productie, financiën, personeel en ICT moeten goed in de boeken komen. Hierbij is P\\&C verantwoordelijk voor diverse planning \\& control producten, denk hierbij aan de begroting, verantwoordings\\-rapportages en de jaarrekening.\n\n\nAls stagiair bij team planning \\& control ga je aan de slag met het verbeteren en documenteren van werkprocessen binnen het team. Je brengt de belangrijkste processen in kaart, onderzoekt hoe deze processen verbeterd en efficiënter kunnen worden gemaakt en maakt werkbeschrijvingen voor de processen. Hierbij werk je samen met de (junior) adviseurs planning \\& control en de Business Controllers. Doordat je meewerkt met alle verschillende taken en processen binnen het team, kijk je een unieke inkijk in deze processen en in onze organisatie. Met jouw procesmatige blik en analytisch vermogen, lever je een belangrijke bijdrage aan het werk dat team P\\&C doet.\n\n**Dit krijg je ervoor terug**\n-----------------------------\n\n\nWe bieden jou als stagiair een uitdagende en afwisselende stageplaats bij een unieke werkgever. Het is ook mogelijk om de stage in ve vullen als afstudeerstage. Het betreft een fulltime stageplaats voor de periode van september 2026 tot januari/februari 2027\\.  \n\n  \n\nVoor hbo\\-studenten bedraagt de stagevergoeding €720 bruto, op basis van 36 uur per week. Deze vergoedingen zijn gebaseerd op een vijfdaagse werkweek, waarbij wordt uitgegaan van 36 uren stage per week. Bij een stage van minder dan 36 uur per week, wordt de stagevergoeding berekend naar evenredigheid van het aantal afgesproken uren. Meer stage\\-informatie vind je via deze link: Stage\\-informatie voor stagiairs \\| O\\&P Rijk P\\-Direkt .\n\n**Wat we van jou verwachten**\n-----------------------------\n\n\nWe zijn op zoek naar een stagiair die op dit moment een hbo\\- of wo\\-opleiding volgt in een financieel/economische studierichting, bijvoorbeeld Finance \\& Control, Accountancy of Bedrijfskunde.\n\n\nAls stagiair ontwikkel je tijdens je stageperiode natuurlijk allerlei nieuwe vaardigheden, we leren je de fijne kneepjes van het vak bij onze organisatie. Om je goed op weg te kunnen helpen, is het van belang dat je over de volgende competenties beschikt:\n\n* Je hebt sterk analytisch vermogen en denkt op schaal;\n* je werkt nauwkeurig.\n\n\nTwijfel je of je over de juiste competenties beschikt? Ook dan nodigen we je van harte uit om te solliciteren. Je kunt natuurlijk ook altijd even contact opnemen om de mogelijkheden te bespreke", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship - Global Media Team", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=58940a8e516c6227", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "Internship – Global Media Team\n\n\n\n‘I really enjoy being able to help with the communication processes that help drive a great company from behind the scenes to external channels!’\n\n\n\nThe internship\n\n\n\nAs our intern, you will be part of the Global Media, Issues and Crises team and support the team to implement and execute global external communications and corporate media relations campaigns. To strengthen and protect the company’s reputation, we use a variety of communication channels including traditional media, digital platforms, and social media.\n\n\n\nIn this role, you will gain hands\\-on experience and provide essential support in various external communication activities. Your responsibilities will include:\n\n\n* Assisting in the development and execution of external communication and global media plans.\n* Supporting the preparation and coordination of media interviews.\n* Contributing to the creation of external communication assets, such as Q\\&A;'s, key messages, quotes, visuals, etc.\n* Support the Issue and Crisis Management process, working with OpCos, Regions and External Agencies.\n* Participating in brainstorming sessions.\n* Drafting communication materials for various platforms and audiences.\n* Compiling coverage overviews and analysing media coverage.\n* Internal stakeholder management.\n\nThis is an excellent opportunity to develop your skills in corporate communications and global media relations and gain practical experience in the dynamic and fast\\-paced environment of HEINEKEN. You will report to the Global Head of Media.\n\n\nDuring your internship you will get the opportunity to get to know HEINEKEN as a company, also outside your department. You have the trust and freedom to work like a real entrepreneur. We like to bring the outside world in and therefore we embrace new, fresh ideas with enthusiasm. Of course, always with the guidance that is right for you.\n\n\nThe department\n\n\n\nThe Global Media, Issues and Crises team is part of Global Communications at HEINEKEN, which sits within the Global Corporate Affairs (CA) function. CA also includes Global Public Affairs and Sustainable Development. Our team leads external corporate communications with the objective to strengthen our company's reputation. We create and execute a comprehensive global strategy that focuses on broad storytelling, integrating communications efforts across global functions and countries to ensure a cohesive and compelling narrative.\n\n\nThe terms of employment\n\n\n* Your starting date is 1 September 2026\n* The internship is fulltime (in consultation 4 days a week also possible)\n* The duration of the internship is 5 or 6 months (in consultation with your internship supervisor)\n* You must be enrolled in a university and need to submit proof of enrolment for the duration of your internship. Please find the exact requirements below\n* It is a practice\\-oriented internship, i.e. no thesis research internship\n* You will be based in Amsterdam\n* During your internship, you have t", "source": "indeed"}, {"company": "O My Bag", "job_title": "People & Culture Stage", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/O-My-Bag", "job_url": "https://nl.indeed.com/viewjob?jk=43a929222fd259dd", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "### **Ben jij nieuwsgierig naar alles wat er achter een sterk, gelukkig en groeiend team zit?**\n\n\nLijkt het je leuk om niet alleen mee te draaien in de dagelijkse HR werkzaamheden, maar ook actief bij te dragen aan grotere People \\& Culture projecten binnen een duurzaam fashion merk?\n\n\nDan hebben wij een hele leuke stageplek voor je.\n\n\nVanaf september 2026 (of eerder!) zijn wij bij O My Bag op zoek naar een enthousiaste en proactieve People \\& Culture stagiair(e) die ons HR team komt versterken voor een periode van 6 maanden.\n\n\nJe werkt nauw samen met onze Head of Talent en HR \\& Office Assistant en ondersteunt een team van ongeveer 35 collega’s, verdeeld over ons kantoor in Amsterdam en onze winkels.\n\n\nOmdat O My Bag blijft groeien, krijg je de kans om van dichtbij mee te bouwen aan belangrijke HR projecten. Zo openen we in Q3 een nieuwe winkel, wat betekent dat er achter de schermen veel gebeurt op het gebied van recruitment, onboarding, teamontwikkeling en processen. Een unieke kans om al in een vroeg stadium betrokken te zijn bij gave People \\& Culture projecten binnen een groeiend bedrijf.\n\n### **Wat ga je doen?**\n\n\nTijdens deze stage krijg je een veelzijdig takenpakket waarbij je zowel operationeel als projectmatig meewerkt.\n\n#### **Recruitment \\& onboarding**\n\n* Vacatures online plaatsen\n* Sollicitaties screenen en gesprekken inplannen\n* Contact onderhouden met kandidaten\n* Meedenken over de candidate experience\n* Ondersteunen bij onboarding van nieuwe collega’s\n* Helpen bij recruitment voor onze nieuwe winkelopening\n\n#### **HR Operations**\n\n* Ondersteunen bij HR administratie\n* Personeelsdossiers up\\-to\\-date houden\n* Contracten en documenten voorbereiden\n* HR processen verbeteren en structureren\n* Employee handbook updates verwerken\n* Onderzoek doen naar nieuwe HR tools en ontwikkelingen\n\n#### **People \\& Culture projecten**\n\n\nNaast de dagelijkse werkzaamheden krijg je veel ruimte om mee te denken over grotere projecten, zoals:\n\n* onboarding \\& employee experience verbeteren\n* learning \\& development initiatieven\n* AI en automatisering binnen HR\n* employer branding\n* wellbeing \\& cultuur initiatieven\n* HR processen rondom groei en schaalbaarheid\n\n\nAfhankelijk van jouw interesses kijken we samen welk project goed bij je past en waar jij ownership over kunt nemen.\n\n#### **Office \\& team support**\n\n\nBij O My Bag geloven we dat een fijne werkomgeving een groot verschil maakt. Daarom ondersteun je ook bij:\n\n* team events en celebrations\n* office management taken\n* het creëren van een prettige en inspirerende werkplek\n* dagelijkse ondersteuning van het team\n\n### **Dit is wie je bent**\n\n* Je wordt enthousiast van mensen, cultuur en organiseren\n* Je werkt zelfstandig en durft initiatief te nemen\n* Je denkt graag over verbeteringen\n* Je werkt gestructureerd en nauwkeurig\n* Je krijgt energie van een dynamische werkomgeving\n* Je hebt interesse in HR, employee experience en organisatieontwikkeling\n\n\nDaarnaast:\n\n* Volg je een HBO\\- of WO\\-opleiding r", "source": "indeed"}, {"company": "MSD", "job_title": "Stagiair – HBO/WO - Asset Management & Improvement", "location": "Boxmeer, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Msd", "job_url": "https://nl.indeed.com/viewjob?jk=8502be59d643747b", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "Job Description\n\n\nWe zijn op zoek naar een gemotiveerde student in het derde/vierde jaar van de opleiding HBO/WO in de richting van richting Milieukunde, Technische bedrijfskunde, Werktuigbouwkunde, Energietechnologie of vergelijkbaar\n\n\nWil je graag weten hoe het is om deel uit te maken van een van de grootste multinationale bedrijven in de farmaceutische industrie? We bieden een stageplaats binnen onze afdeling Asset Management \\& Improvement waar je vrijheid en ruimte krijgt voor eigen initiatief.\n\n**Stagiair – HBO/WO \\- Asset Management \\& Improvement**\n\n**Welkom bij ons team**\n\n\nDe afdelingen Asset Management \\& Improvement en Indirect Procurement werken nauw samen om de operationele kosten te verlagen en de duurzaamheid te vergroten. Asset Management \\& Improvement richt zich op asset\\- en energiemanagement met het doel de operationele kosten, energie\\-efficiency te optimaliseren en CO2\\-uitstoot te reduceren. Indirect Procurement is verantwoordelijk voor het verbeteren van samenwerking met leveranciers en het realiseren van kostenefficiënte inkoopoplossingen.\n\n**Jouw stageopdracht**\n\n\nAls stagiair(e) ga je aan de slag met het optimaliseren van de bedrijfsvoering van onze Waste Water Treatment Plant (WWTP). Je levert een concrete analyse en voorstel voor verbeteringen op het gebied van procesvoering, energiegebruik en duurzaamheid.\n\n**Jouw verantwoordelijkheden**\n\n* Analyse van de bedrijfsvoering van de WWTP: je onderzoekt hoe de installatie functioneert, identificeert kritische randvoorwaarden en brengt processtromen in kaart.\n* Analyse van energieverbruik en afvoerstromen inclusief transport: je verzamelt en analyseert data over energiegebruik en afvalstromen en bepaalt welke parameters hierop van invloed zijn.\n* Optimalisatievoorstellen: je ontwikkelt concrete voorstellen om de bedrijfsvoering, het energiegebruik en de operationele kosten te verlagen. Hierbij betrek je duurzaamheidsperspectieven zoals CO2\\-emissies en vermindering van afvalstromen.\n* Onderzoek naar load management: je onderzoekt mogelijkheden om load management toe te passen in relatie tot netcongestie en piekvermijding.\n* Frisse blik en rapportage: je brengt een onafhankelijke kijk op de processen en deelt je bevindingen en aanbevelingen in een helder eindrapport en een presentatie.\n\n\nDe beschreven taken vormen het basispakket en zullen vaak zelfstandig worden uitgevoerd na een juiste training en leerperiode. Deze taken kunnen worden aangevuld met andere projecten en/of taken op eigen initiatief of op verzoek van de organisatie.\n\n**Wat is vereist**\n\n* Student in het derde/vierde jaar van het HBO/WO in richting Milieukunde, Technische bedrijfskunde, Werktuigbouwkunde, Energietechnologie of vergelijkbaar\n* Bekendheid met ervaring met data\\-analyse (Excel, Python of vergelijkbaar), procesanalyse en rapportage.\n* Competenties: proactief, goede communicatieve vaardigheden in het Nederlands en/of Engels, zowel schriftelijk als mondeling en een teamspeler\n\n**Wat wij bieden**\n\nS", "source": "indeed"}, {"company": "Beter Horen", "job_title": "Stage Digital Marketing", "location": "Utrecht, UT, NL", "careers_url": "https://nl.indeed.com/cmp/Beter-Horen", "job_url": "https://nl.indeed.com/viewjob?jk=0526513c83c85804", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "**Job Description**\nBen jij vanaf september 2026 op zoek naar een meewerkstage in een internationaal bedrijf gevestigd in Utrecht? Waar je zowel de kans krijgt om met stakeholders te schakelen, mediakanalen te onderhouden en uitvoerend bezig te gaan? Dan hebben wij bij Amplifon Nederland \\| Beter Horen een mooie kans voor jou!\n\n\n**Wat ga jij doen?**\n\n\nAls Digital Marketing stagiair(e) help je ons bij het verbreden van de online aanwezigheid van Beter Horen via de website en online mediakanalen. Denk hierbij verschillende SEO\\-activiteiten, nieuwe content creëren en door middel van data inzichten verbeterkansen signaleren voor de website. Hierbij schakel je ook op dagelijkse/ wekelijkse basis met collega's in Italië.\n\n**Denk hierbij aan...**\n\n  \n\n* Ondersteunen, uitvoeren en optimaliseren van online marketingcampagnes\n* Een rol spelen in campagne evaluaties, KPI's gebaseerd op prestaties en inzichten verkrijgen in de campagnes om resultaten te verbeteren/optimaliseren;\n* Updaten en onderhouden van content voor de website, blog, mediakanalen, de e\\-commerce webshop en andere digitale projecten;\n* Creëren, implementeren en onderhouden van het sociale media marketingplan;\n* Het onderhouden en updaten van de shopdatabase en bijbehorende listings;\n* Werkt nauw samen met partners en stakeholders (intern en extern) en werkt samen met interne rollen zoals content creators om te zorgen voor effectieve communicatie;\n* Andere ad hoc dag\\-tot\\-dag activiteiten die we kunnen toelichten tijdens een gesprek.\n\n**Wat krijg je van ons?**\n\n  \n\n* Een stagevergoeding van €400,\\- bruto o.b.v. een fulltime stage (40 uur);\n* De mogelijkheid om te werken voor een doelgedreven organisatie waarbij je een echt verschil kan maken in de levens van mensen;\n* Een stage bij 's werelds grootste retailer in de hoorzorg;\n* Een modern, duurzaam en inspirerend kantoor in Utrecht op de 18e verdieping, dus je kunt rekenen op een prachtig uitzicht tijdens je werkdag!\n* Een 'smart working policy', waarbij je de kans krijgt om een paar dagen thuis te werken. Zo creëren we de perfecte balans tussen werk en privé;\n* Een stage bij een inspirerend, internationaal bedrijf met mooie carrière kansen;\n* Iedere dag een heerlijke, gratis lunch met biologische producten (dat scheelt weer boterhammen met pindakaas smeren 's ochtends).\n\n  \n\nJe zult bij Amplifon meewerkstage lopen samen met stagiaires uit andere vakgebieden. Amplifon stimuleert engagement en samenwerking tussen de stagiaires ter bevordering van een leuke en nog leerzamere ervaring.**Dus ben jij...**\n\n  \n\n* Een hbo student met een relevante opleiding in de richting van marketing en/ of communicatie;\n* Op zoek naar een e": "indeed"}, {"company": "Berg", "job_title": "Customer Service Stage (MBO)", "location": "Ede, GE, NL", "careers_url": "https://nl.indeed.com/cmp/Berg", "job_url": "https://nl.indeed.com/viewjob?jk=547fdd4002e2f8bb", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-19", "recruiter_email": null, "applicant_count": null, "description": "***Stagiair Afdeling Customer Service***\n\nBen jij op zoek naar een stageplek in een internationale, commerciële omgeving? Wil jij onderdeel worden van een team van aanpakkers en teamspelers dat streeft naar een zo hoog mogelijke klanttevredenheid? Dan ben je bij BERG aan het juiste adres!\n\nWij zijn BERG! Altijd op zoek naar de nieuwste producten en innovaties om mensen van alle leeftijden naar buiten te krijgen. Maar in dit geval, zijn wij op zoek naar jou!\n\n***take control***\n\nWij voelen ons thuis, zodra we buiten zijn. Om buiten zijn nog leuker te maken ontwikkelen en produceren wij het meest innovatieve en kwalitatieve buitenspeelgoed voor jong en oud. Dit alles met een hoge fun factor! Daar hoort ook een hoog service niveau bij. Als stagiair ga jij hieraan bijdragen door met je collega’s van de Customer Service een variëteit aan klantvragen te beantwoorden en streef je er samen naar, om van iedere klant een fan te maken.\n\nBij BERG zijn we altijd aan het innoveren. Speelplezier, veiligheid en kwaliteit zijn de drie pilaren waar ons succes op rust. De afdeling Customer Service draagt voor een belangrijk deel bij aan die kwaliteit. Dit internationale team van ca. 10 personen staat dagelijks voor onze klanten klaar en is verantwoordelijk voor de snelle verwerking van klantvragen over producten, retouren, verzending en nog veel meer…\n\n***you got this***\n\nWij hebben plaats voor een enthousiaste en gemotiveerde MBO student in de richting van commercie, communicatie, international business of soortgelijk, die beschikt over een hands on mentaliteit en niet bang is internationaal te werken. Jouw Nederlands en Engels zijn goed in woord en geschrift en het is helemaal mooi als je over nog meer talenkennis beschikt. Je bent pragmatisch ingesteld en IT vaardig. Daarnaast draai je je hand niet om voor administratieve taken en met commerciële klantcommunicatie. Je zult namelijk veel schakelen tussen onze eigen webshopklanten én klanten van marketplaces zoals Amazon, Bol en Decathlon. Daarbij gebruik je communicatie kanalen, zoals whatsapp, chat, telefoon en email.\n\n***what’s in it for you?***\n\nBERG biedt jou een leerzame en uitdagende stageplaats waar jij als student veel ervaring op kan doen in een commerciële rol binnen een innovatieve en internationale organisatie. Jouw vooruitgang staat centraal en je leert hoe jij je persoonlijke doelen en de doelen van de organisatie kan waarmaken. Daarnaast staan wij garant voor een goede begeleiding en stagevergoeding (€350 bruto per maand bij fulltime stage).\n\n***welcome to our woRld. it’s yours now***\n\nBen jij klaar voor een supertoffe stageplek? Upload je CV en overtuigende portfolio hier. Heb je nu nog brandende vragen over de stage? Neem dan contact op met Thecla Huf (CS Manager) of Liset Bloem (HR) via telefoonnummer 0318 46 70 26\\. Voor meer informatie over BERG, check www.BERG.com.\n\nSalaris: €300,00 \\- €350,00 per maand\n\nWerklocatie: Fysiek", "source": "indeed"}, {"company": "Abbott", "job_title": "Master Scheduling Intern", "location": "Zwolle, OV, NL", "careers_url": "https://nl.indeed.com/cmp/Abbott", "job_url": "https://nl.indeed.com/viewjob?jk=9f9cb63a7387ad7b", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-19", "recruiter_email": null, "applicant_count": null, "description": "**STAGE ABBOTT LOGISTICS – MASTER SCHEDULING**\n\nBij Abbott willen we mensen helpen om zo veel mogelijk uit het leven te halen dankzij een goede gezondheid. Dit doen we met een breed scala van op wetenschap gebaseerde voedingsproducten, diagnostische apparatuur en medische hulpmiddelen. Elke dag ontdekken we weer nieuwe manieren om het leven verder te verbeteren.\n\n\nAbbott Logistics is een locatie waar mensen werken met een divers pakket aan functies en regionale rollen. Hier richten we ons op het uitvoeren en verbeteren van onze bedrijfsprocessen omtrent; inkoop, planning \\& service, distributie \\& transport, douane \\& finance. Het is een internationale organisatie waarbij we iedere dag in contact staan met leveranciers, fabrieken en klanten uit alle delen van de wereld.\n\n**DE****OPDRACHT**\n\n\nHet **Master Scheduling\\-team** is verantwoordelijk voor het opstellen en onderhouden van even passend productieplan voor de wereldwijde toekomstige verkoop. Dit productieplan moet de beschikbare capaciteit, voorraad en service (orders) optimaliseren over een horizon van 24 maanden.\n\n\nSommige producten ondergaan na fabricage nog een extra ‘finishing’\\-bewerking op een andere locatie. Dit deel van het productieplan wordt momenteel met eenvoudige hulpmiddelen gegenereerd. Voor dit proces zijn wij op zoek naar een toekomstbestendige en systematische oplossing.\n\n\nJe begint met het analyseren van de huidige processen en het verzamelen van vereisten voor een nieuw systeem. Vervolgens onderzoek je welke verbeteropties er zijn. Op basis van één van deze opties ontwerp je een concept, test je dit met verschillende datasets en valideer je de resultaten. Tot slot werk je aan de implementatie door de oplossing te documenteren en training te geven aan de eindgebruikers.\n\n**De verwachte resultaten zijn:**\n\n* een verbeterd en geautomatiseerd systeem dat planning genereert op basis van orders, voorraad en vraag;\n* voorstellen ter verbetering van efficiëntie en nauwkeurigheid in het planningsproces.\n* documentatie en training voor eindgebruikers.\n* Voor deze opdracht is basiskennis van programmeertalen zoals SQL of Python gewenst, evenals inzicht in logistieke processen en supply chain management.\n\n\nJe krijgt de ruimte om de opdracht aan te passen aan de vereisten van je opleiding. Daarnaast ontvang je regelmatige begeleiding en feedback van een ervaren mentor, toegang tot de benodigde software en tools, en ondersteuning bij het verzamelen van relevante gegevens en informatie.\n\n**DE STUDENT DIE WIJ ZOEKEN**\n\n\nVolgt een Bachelor of Master studie en wil een afstudeeropdracht of masterscriptie uitvoeren. Verder heeft de student de volgende kennis en vaardigheden\n\n* Kennis van vakken als operations research, statistiek en optimalisatie, data management\n* Begrip van MS Office 365 powersuite applicaties\n* Begrip van Phyton of Java\n* Heeft oog voor details én voor het grotere geheel.\n* Werkt met collega’s uit Nederland en met allerlei andere nationaliteiten, daardoor is een goede Ne", "source": "indeed"}, {"company": "BUZZ Power Bank", "job_title": "Sales Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Buzz-Power-Bank", "job_url": "https://nl.indeed.com/viewjob?jk=d339c46424aedf86", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-19", "recruiter_email": null, "applicant_count": null, "description": "**About BUZZ**\n\nBuzz is the fastest\\-growing power bank sharing company in Europe, helping thousands of people to stay charged.\n\nWe are a startup with vibrant energy and freedom of action, where everyone feels part of a fast\\-growing international project. The team is united by trust, speed, creativity, and a sense of real impact – you can literally see your ideas becoming part of the city and bringing value to people.\n\n**About the Role (Sales, Marketing \\& Account Impact)**\n\nWe’re looking for an energetic, action\\-oriented professional with a hunter mindset who enjoys sales but also understands the value of long\\-term relationships and clean processes.\n\nThis is a hybrid B2B role combining sales, field marketing, and account management in the HoReCa \\& Entertainment segment: cafés, restaurants, bars, clubs, and venues where Buzz stations live and grow.\n\n**Your mission:**\n\nBring new partners into the Buzz network, activate them successfully, and help existing locations grow further.\n\n**What You Will Do**\n\n***Sales \\& Growth***\n\n* Prospect new venues: calls, messages, visits, and meetings with owners and managers\n* Qualify leads and move them through the funnel — from first contact to signed location\n* Support door\\-to\\-door and on\\-site meetings together with senior sales colleagues\n\n***Marketing \\& Partner Activation*** \n\n* Represent Buzz on the ground: explain the product, value proposition, and placement logic\n* Help partners understand how Buzz drives foot traffic, guest experience, and extra revenue\n* Collect market insights and feedback from venues to improve messaging and approach\n\n***Account \\& Pipeline Operations***\n\n* Stay in touch with existing partners to drive upgrades, reorders, and referrals\n* Keep CRM clean and structured: log calls, update deal stages, track follow\\-ups\n* Support weekly pipeline updates and basic reporting\n\n**What to Expect**\n\n* Daily action: calls, WhatsApp, emails, and in\\-person visits\n* Clear sales playbooks, training, and coaching from day one\n* Measurable KPIs: meetings booked, active pipeline, partner activation\n* Real ownership — your work directly turns into live locations\n\n**You Are**\n\n* Proactive, confident, and comfortable taking initiative\n* A natural communicator with a hunter mindset — you like opening doors and moving things forward\n* Have a growth mindset and positive energy, always open to knowledge and new learning experiences\n* Fluent in English is a must; conversational Dutch or fluent in many languages is a strong plus\n* Organised and reliable (you follow up, keep notes, and close loops)\n* Sales or horeca experience is welcome, but not required\n* Students enrolled at a university and eligible for an internship are welcome\n\n**We Offer**\n\n* Full training, scripts, and tools from day one\n* Fair compensation and a modern office in the centre of Amsterdam\n* Close work with experienced sales professionals\n* Fast responsibility and steep learning curve\n* Clear growth path to Sales Executive based on", "source": "indeed"}, {"company": "PreZero", "job_title": "Stagiair Inkoop", "location": "Arnhem, GE, NL", "careers_url": "https://nl.indeed.com/cmp/Prezero", "job_url": "https://nl.indeed.com/viewjob?jk=7a40b5b52dbd9793", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-19", "recruiter_email": null, "applicant_count": null, "description": "**Stagiair Inkoop**\n===================\n\nArnhem Parttime/Fulltime Stage 01\\.09\\.2026\nWil jij bijdragen aan een duurzamere wereld, werkervaring opdoen binnen een inkoopafdeling én je vaardigheden naar een hoger niveau tillen? Wij zijn op zoek naar een enthousiaste en leergierige Stagiair Inkoop die ons team komt versterken.  \n\n  \n\n**Wat ga jij doen?**\n\n  \n\n\n\nTijdens jouw meewerkstage maak je kennis met alle aspecten van inkoop binnen onze organisatie. Je werkt samen met ervaren inkopers en krijgt de kans om bij te dragen aan projecten die directe impact hebben op onze duurzaamheid en bedrijfsvoering. Je krijgt diverse werkzaamheden, denk bijvoorbeeld aan het ondersteunen bij het opstellen van inkoopplannen en contractbeheer. Maar ook aan het analyseren van offertes en leveranciersprestaties, het onderzoeken van nieuwe, duurzame inkoopmogelijkheden en het meehelpen bij prijsonderhandelingen en leveringsafspraken. Tot slot hou je je bezig met het optimaliseren van administratieve processen en systemen.  \n\n  \n\nKortom: een stage waarin je veel leert én actief bijdraagt aan onze missie om afval slimmer en duurzamer te verwerken. Mis je iets? Laten we samen kijken hoe we jouw stage tot een succesvol einde kunnen brengen!  \n\n  \n\n**Wie ben jij?**\n\n  \n\n\n\nJe bent een proactieve teamplayer die zelfstandig en nauwkeurig kan werken. Je volgt momenteel een HBO\\-opleiding, bijvoorbeeld in de function getSector(company) {
  const cl = company.toLowerCase();
  for (const [key, sec] of Object.entries(SECTOR_MAP)) {
    if (cl.includes(key)) return sec;
  }
  return 'Other';
}

// ── Match scoring ─────────────────────────────────────────────────────────────
function scoreJob(j) {
  const title = (j.job_title || '').toLowerCase();
  const company = (j.company || '').toLowerCase();
  const sector = getSector(j.company);
  const desc = (j.description || '').toLowerCase().slice(0, 800);
  let score = 0;

  // Role type (0–50)
  const ROLES = [
    [50, ['strategy intern','corporate strategy intern','strategic planning intern']],
    [48, ['consultant intern','consulting intern','associate consultant intern','management consultant intern']],
    [46, ['operations intern','business operations intern','strategy & operations intern','strategy and operations intern','commercial intern']],
    [45, ['product manager intern','product management intern','associate product manager intern','apm intern']],
    [42, ['business analyst intern','business analyst intern','commercial analyst intern']],
    [38, ['mba intern','graduate intern','management trainee intern']],
    [35, ['programme manager intern','program manager intern','project management intern']],
    [30, ['procurement intern','supply chain intern','sourcing intern']],
    [25, ['project manager intern']],
  ];
  for (const [pts, kws] of ROLES) {
    if (kws.some(k => title.includes(k))) { score += pts; break; }
  }
  if (score === 0) score += 15;

  // Sector fit (0–30)
  score += ({ Energy:30, Consulting:28, Tech:22, Industrial:20, Finance:16, FMCG:15, Other:8 })[sector] || 8;

  // Company bonus (0–20)
  const CO = [
    [20, ['shell','eneco','vattenfall','tennet','alliander','stedin','orsted','ørsted','sbm offshore','neste','fugro']],
    [18, ['bcg','bain','mckinsey','oliver wyman','kearney','strategy&','roland berger','ey-parthenon','deloitte','accenture']],
    [15, ['adyen','booking','uber','databricks','prosus','backbase','catawiki','tomtom']],
    [12, ['unilever','heineken','akzonobel','dsm','firmenich','ahold','frieslandcampina']],
    [12, ['asml','nxp','signify','philips','wolters kluwer','vanderlande','tno']],
    [10, ['ing ','rabobank','abn amro','nn group','aegon','van lanschot']],
  ];
  for (const [pts, kws] of CO) {
    if (kws.some(k => company.includes(k))) { score += pts; break; }
  }

  // Keyword signals in title/desc (+0–10)
  let bonus = 0;
  for (const [kw, pts] of [['strategy',3],['operations',3],['sustainability',2],['energy',2],
      ['product',2],['mba',2],['transformation',2],['commercial',1],['analytics',1],['innovation',1]]) {
    if (title.includes(kw)) bonus += pts;
    else if (desc.includes(kw)) bonus += Math.round(pts / 2);
  }
  score += Math.min(10, bonus);
  return Math.min(100, score);
}

function getEffectiveScore(j) {

function matchBadgeHtml(score, isAi, reason) {
  let cls;
  if (score >= 85) cls = 'ex';
  else if (score >= 70) cls = 'str';
  else if (score >= 55) cls = 'gd';
  else if (score >= 40) cls = 'ok';
  else cls = 'low';
  const sup    = isAi ? '<sup style="font-size:8px;margin-left:1px">AI</sup>' : '';
  const tipTxt = isAi && reason ? reason : (isAi ? 'AI-scored by Claude' : 'Keyword match score');
  return `<span class="match-badge match-${cls}" title="${esc(tipTxt)}">${score}%${sup}</span>`;
}
