 love denim. Live and breathe it. It’s in our DNA.  \n\nAt G\\-STAR, we see no limit to what denim can do. We believe it can be force of progress and innovation for both people and planet. How? By hiring the most creative, curious and caring minds. People who think beyond fashion. Bringing big ideas to big challenges. Driven by possibility. Those who work hard, make mistakes, but always continue to grow. Denim is in our DNA, our people are our stitching.  \n\nJoin the denim heads making raw denim!\n\n\n\nWe are committed to creating an inclusive environment and welcome applications from all qualified candidates, regardless of background, identity, or experience.\n\n\n\n**HERE’S WHAT WE WILL DO TOGETHER:**\n\n\n\nWe are currently seeking Product Manager Interns with a passion for quality, details and fashion for our Product Department. In this role, you know what’s happening in the industry and you’re familiar with the latest trends and developments. Our Intern Product Manager will assist in all our daily tasks during the development of our collection. You will assist for quality compliance and the timely completion of sample and production books. Working together with Product Managers, Design and Merchandise, you safeguard the unique G\\-STAR look \\& feel. G\\-STAR offers you a challenging position in a creative environment at one of the world’s most innovative companies, where you will share responsibility for transforming creative designs into high quality end products.\n\n**MISSION:**\n\n\n\nThis is a Product Manager internship for someone who would like to gain more experience in either this area or on an organizational/ coordination level. You will assist our product category teams. We are looking for interns in the following categories; **Denim**, **Woven**, and **Knits**.  \n\nWe strongly believe that curiosity and initiative go a long way. The more passion, proactivity, and ownership you show, the more you'll be involved, and the more you’ll learn. This is your chance to grow your skills and network, expand your knowledge, and truly experience the fast\\-paced and creative world of fashion product development.\n\n**YOUR TASKS AND RESPONSIBILITIES:**\n\n\n* **Taking part in daily product manager activities** — from concept to final sample, supporting the team in turning creative ideas into tangible garments.\n* **Engaging with global vendors and suppliers** — helping to ensure clear communication, accurate execution, and on\\-time delivery of developments.\n* **Managing and reviewing sample**s — tracking incoming styles, organizing reviews, and supporting in the creation and timely delivery of sample\\- and production books.\n* **Preparing and attending fittings** — observing fit sessions, taking notes, and learning how design, fit, and function come together.\n\n\n**WHAT YOU BRING TO THE TABLE:**\n\n\n* Fashion? You live and breathe it!\n* Good communication and organizational skills.\n* Team player, flexible and detail\\-oriented.\n* You are available full", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship - Sustainability Reporting Water & Wastewater", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=85f581ffe9c8d19a", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": null, "applicant_count": null, "description": "Internship \\- Sustainability Reporting Water \\& Wastewater\n\n\nAre you a student, passionate about sustainability, and looking for an experience in an international environment?\n\n\n\nHEINEKEN is committed to becoming net zero carbon by 2030 (scope 1 \\& 2\\) and to reducing its water usage significantly. To achieve this ambition, we run multiple projects, and we want to measure the impact of those projects. That’s when accurate sustainability reporting is essential. As part of this internship, you will support sustainability reporting, coordinate the overall process, provide supporting materials, manage different stakeholders, and review data accuracy and performance.\n\n\nThe internship is based in Schiphol and available on the 1st of September for a duration of a minimum of 6 months.\n\n\n\nYour Responsibilities\n\n\n\nIn this internship, you will:\n\n\n* Support HEINEKEN Operating companies worldwide with sustainability water and wastewater reporting\n* Analyse reporting data, highlight issues, and provide feedback to reporting sites\n* Update documentation and guidance on reporting\n* Create training materials for our production sites\n* Support the development and automation of reports and dashboards to track (waste) water trends and identify improvement opportunities\n\nThe Unique You!\n\n\n\nWe believe that everyone has unique talents, and we are therefore looking for you!\n\n\n* You are currently studying for a master’s or bachelor's degree in environmental sciences (biotechnology, chemical/environmental engineering, etc.), or a similar area\n* You have a passion for sustainability and want to make an impact on a global scale\n* You have basic knowledge of water and wastewater treatment systems\n* You have strong data analytics skills. PowerBI knowledge is appreciated\n\n\nThe Department\n\n\n\nThe Sustainable Production department (part of Global Production, Supply Chain) consists of a multidisciplinary team, working on different subjects of sustainability of our operations, such as water and energy usage, decarbonization, wastewater management and reporting. The team is made up of professionals from different countries, expertise and academic background with all one goal to make our operations more sustainable.\n\n\nDuring your internship you will get the opportunity to get to know HEINEKEN as a company, also outside your department. We give you trust and freedom, so you can work like a real entrepreneur. We like to bring the outside world inside and therefore we embrace new, fresh ideas with enthusiasm. Of course, always with the guidance that is right for you\n\n\n\nThe terms of employment\n\n\nThe following terms apply:\n\n\n* Your starting date is 1st September 2026\n* The internship is full\\-time, with a duration of 6 months\n* It is a practice\\-oriented internship\n* You will be based in Amsterdam\n* During your internship, you have the flexibility to work in a hybrid setup\n* You will receive an internship fee of €650 gross pm based on 40 hours per week\n* You will enjoy 2 vacation days per", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship - Water Reclamation PlantPerformance Review", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=4dca00ebb500d3b9", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": null, "applicant_count": null, "description": "Internship – Water Reclamation Plant (WRP) Performance Review\n\n\n\n“Gaining hands\\-on experience in evaluating real\\-world advanced water reuse systems and contributing to meaningful improvements in our operations makes this internship a unique learning journey.”\n\n\n**The Internship**\n==================\n\n\n\nHEINEKEN operates many Water Reclamation Plants (WRPs) across its global brewing operations. A WRP is a process unit that upgrades treated effluent to service or soft water quality using membrane technology, producing a reclaimed water (permeate) flow and a concentrated brine flow. These facilities are critical to managing our environmental footprint, ensuring regulatory compliance, and supporting our ambition to become a net\\-zero, water\\-resilient company by 2030\n\n\n\nAs part of this internship, you will support a structured review of our existing WRPs – assessing their original design intent against actual operational performance, identifying common challenges, and helping to build the foundation for an organisation\\-wide improvement programme.\n\n\n\nIn this internship, you will have the opportunity to:\n\n\n* Collaborate with operating companies worldwide to gather operational insights and support knowledge sharing across the network\n* Assess the current status of WRPs across HEINEKEN’s operations, identifying potential gaps, common issues, and areas of good practice\n* Support the development of an improvement plan and good practices guide for WRP operations, including actionable recommendations for operating companies\n* Contribute to a capability and training needs assessment, helping to identify knowledge gaps and propose targeted training solutions for WRP operators and engineers\n* Review and provide input to HEINEKEN’s existing internal standards and guidelines on WRP design and operations, suggesting updates based on findings\n* Compile operational data from multiple sites into structured overviews or dashboards (encaja con el PowerBI requirement)\n\n\nDuring your internship, you will get the opportunity to get to know HEINEKEN as a company, also outside your department. We give you trust and freedom, so you can work like a real entrepreneur. We like to bring the outside world inside, and therefore we embrace new, fresh ideas with enthusiasm. Of course, always with the guidance that is right for you.\n\n\n**The department**\n==================\n\n\n\nThe Sustainable Production department (part of Global Production, Supply Chain) consists of a multidisciplinary team working on different subjects of sustainability in our operations, including water and energy usage, decarbonisation, wastewater management, and reporting. The team is made up of professionals from different countries, with diverse expertise and academic backgrounds – all united by one goal: to make our operations more sustainable.\n\n\n**The Terms of Employment**\n===========================\n\n\n* Your starting date is 1 September 2026\n* The internship is full\\-time\n* The duration of the internship is ", "source": "indeed"}, {"company": "Hewlett Packard Enterprise | HPE", "job_title": "NWE Business management Intern (Defense Industry Europe)", "location": "Amstelveen, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Hewlett-Packard-Enterprise-Hpe-3", "job_url": "https://nl.indeed.com/viewjob?jk=d2e342df5225fb06", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": null, "applicant_count": null, "description": "NWE Business management Intern (Defense Industry Europe)  \n\n\n\nThis role has been designed as ‘Hybrid’ with an expectation that you will work on average 2 days per week from an HPE office.**Who We Are:**\n\n\nHewlett Packard Enterprise is the global edge\\-to\\-cloud company advancing the way people live and work. We help companies connect, protect, analyze, and act on their data and applications wherever they live, from edge to cloud, so they can turn insights into outcomes at the speed required to thrive in today’s complex world. Our culture thrives on finding new and better ways to accelerate what’s next. We know varied backgrounds are valued and succeed here. We have the flexibility to manage our work and personal needs. We make bold moves, together, and are a force for good. If you are looking to stretch and grow your career our culture will embrace you. Open up opportunities with HPE.\n\n**Job Description:**\n\n  \n\n\n\nHewlett Packard Enterprise offers university students the opportunity to join a leading IT company and gain invaluable experience through our Internship Program (minimum of 5 months). Hewlett Packard Enterprise offers you a highly dynamic, fast\\-paced, professional working environment and the chance to develop the skills you have gained at university in a real business environment. During your internship you will not only apply these skills in the IT industry, but also acquire a range of abilities to contribute to the business whilst working alongside industry professionals. Throughout the program, you'll have regular training and one\\-to\\-one meetings with your manager. Working together, you'll set goals and plot your development. And with our open\\-plan offices and friendly working culture, you'll have the chance to learn from senior managers who can help you in your future career.\n\n**Start Date: 1st of September 2026**\n\n**Location: Amstelveen (hybrid working model)**\n\n**What you’ll do :**\n\nDuring your internship you will be part of the HPE Defense Industry team for North \\& Western Europe. You will work closely with the Head of the Defense Industry vertical, based out of The Netherlands.\n\n* The Defense Industry, driven by geopolitical factors, is fast changing towards the ‘Digital Army concept’: AI, Drones, Robotics, secure private Cloud, real time ‘situational’ analytics\\& information, multi\\-dimensional networks and communications.\n* The above is leading to an increase on Defense spending for 2026 to 2030\n* New country regulations (sovereignty) open discussions on what \\-confidential\\- data can be shared or not. Where is data stored and who has access to these data.\n* HPE are looking for an intern who can make a business analysis for 2026 to 2030 based on\n\t+ IT spend of Defense (in other words: which % of Defense is IT related and addressable for HPE)\n\t+ Create a HPE value proposition for Defense based on HPE product portfolio\n\t+ HPE Competitive analysis\n\t+ Business case of estimated of Defense Investments\n\n**What you’ll need:**\n\n* ", "source": "indeed"}, {"company": "Signify", "job_title": "Marketing Communications Intern", "location": "Eindhoven, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Signify-4", "job_url": "https://nl.indeed.com/viewjob?jk=37f1430b9664158a", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-25", "recruiter_email": null, "applicant_count": null, "description": "Eindhoven, Netherlands\nCategory\n Marketing\nPosted Date\n 05/25/20 uous learning, creativity, and commitment to diversity and inclusion empowers you to grow your skills and career.\n\n\nJoin us, and together, we’ll transform our industry, making a lasting difference for brighter lives and a better world.\n\n**More about the role**\n\n\nSignify is one of the few companies in the world to achieve carbon neutrality and our next sustainability goals are even bolder: doubling our positive impact on the environment and society by 2025\\.\n\n\nAs **embedded software** **intern,** you get the opportunity to contribute to innovative projects focused on exploring how the latest advancements in Artificial Intelligence (AI), Machine Learning (ML), and Edge computing can be adopted to wireless embedded devices. These projects investigate how intelligent data processing and decision\\-making can be brought closer to the source of data. This includes optimizing models for resource constrained embedded devices, improving wireless bandwidth usage and enhancing sensory detection algorithms. You will gain hands\\-on experience with cutting\\-edge technologies and contribute to shaping the future of smart, connected IoT lighting systems.\n\n\nWe’re on the lookout for forward\\-thinking innovators with a passion for sustainability. If you match this description, get in touch!\n\n**Topic description**\n\n**Performance Evaluation and Application of Edge AI on Silicon Labs EFR32MG24 for Real\\-Time Anomaly Detection**\n\n\nThis project investigates the viability of deploying lightweight machine learning models on the EFR32MG24 (or a similar) microcontroller, focusing on its integrated AI/ML accelerator. The goal is to evaluate the chip's computational performance, power efficiency, and real\\-time inference capabilities for practical edge applications such as anomaly detection in sensor data.\n\n\nDuring this internship, the student will explore Silicon Labs Gecko SDK and AI/ML development packages to develop applications on embedded wireless sensor devices that are part of a smart IoT lighting system. The student will learn about the various techniques and tools used in the field and will gain hands\\-on experience working with real\\-world applications. The internship will provide an opportunity for the student to develop skills in embedded software development, AI/ML models, edge computing, as well as gain experience working on a complex and challenging project.\n\n **What you’ll do**\n\n* P", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship - Global Sustainability Raw Materials", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=84981317eacd95ae", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "Internship \\- Global Sustainability Raw Materials\n\n\n\n\"It is great to be part of the global HEINEKEN Sustainability team, where I connect with inspiring people around the world, dive into real projects, and discover the impact of sustainability and procurement in a truly international setting – every day brings me new opportunities to learn, grow and make a difference!”\n\n\n\nThe internship\n\n\n\nAre you a graduate student that is passionate about Sustainability and Agriculture, and looking for a great experience in an international environment? Come and Brew a Better World with us!\n\n\n\nYou will work alongside your colleagues on daily projects and activities. Key responsibilities:\n\n\n* Research \\& data analysis: conduct research on sustainable raw materials and suppliers. Data gathering and analysis to model/develop sustainability insights that support decarbonization initiatives, eg the processing decarbonization roadmaps we build with key suppliers and/or data collection and compliance on sustainable sourcing.\n* Project Management and reporting: assist in managing sustainability projec R Intern & Office Management 2026 | Fast growing scale-up", "location": "Rotterdam, ZH, NL", "careers_url": "https://nl.indeed.com/cmp/Monday-Merch", "job_url": "https://nl.indeed.com/viewjob?jk=86d73e170e5d0a5d", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "### **HR \\& Office Management Intern**\n\n\nAre you ready to kickstart your career with a fast\\-growing company that's revolutionizing the merchandise industry? Join our dynamic team at Monday Merch in the heart of Rotterdam! We are looking for a versatile, proactive intern to bridge the gap between People Operations and Office Excellence.\n\n\nIn this dual role, you won't just be \"observing\"—you will be the heartbeat of the office and a key player in building an HR department from the ground up.\n\n#### **The Role**\n\n\nAs our Office Management \\& HR Intern, you will play a 360° role in shaping the employee experience. You will split your time between strategic HR support and ensuring our beautiful Rotterdam office runs like a well\\-oiled machine. This is a unique chance to develop operational mastery while gaining hands\\-on HR experi\n\n### **Key Responsibilities**\n\n* **Office Management \\& Daily Operations**\n* **Hospitality \\& Flow:** Be the face of the office—greeting guests, managing deliveries, and setting the daily vibe with morning ventilation and music.\n* **Elevate the Lunch Experience:** Act as the ultimate host by managing our daily team lunch. From coordinating the food setup to maintaining an organized and high\\-standard kitchen environment through proactive dishwasher and waste management, you’ll ensure the heart of our office remains a fresh, vibrant space for the team to connect.\n* **Facility \\& Plant Care:** Proactively handle maintenance (coffee/ice machine descaling, plant care) and keep the office stocked with premium seasonal products.\n* **Inventory \\& Storage:** Coordinate om the recruiter? Send an email.", "source": "indeed"}, {"company": "Yamaha Motor", "job_title": "Intern Digital Acquisition", "location": "Schiphol, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Yamaha-Motor", "job_url": "https://nl.indeed.com/viewjob?jk=9927cf032e69ffe3", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "**Share our passion:**  \n\nEver since our founder, Genichi Kawakami, established Yamaha Motor, it is our mission to give to ALL our customers KANDO. Not only with our products, but also to our employees. KANDO is a Japanese word to express the feeling of deep satisfaction and excitement you get when you encounter something of exceptional value, quality, and performance.\n\n  \n\n\n\nYou have the opportunity to be part of the Yamaha team.\n\n  \n\n\n\nFor Yamaha Motor Europe N.V.(YME), located at Schiphol\\-Rijk in the Netherlands, we are looking for a Digital Acquisition Intern in our Marketing Division.\n\n  \n\n\n**About the role:**  \n\nDuring this internship you will support the Digital Marketing and CRM Department in the area of Digital Acquisition. Your day starts at 09:00\\. You get a good cup of coffee, catch up with the team lead and prioritize your actions for the day and next few days. You will have quite a few meetings per day with people from your team but also external parties.\n\n  \n\n\n**Your responsibilities:**  \n\n* Following up all Digital Acquisition (social media and online campaigns) activities in more than 28 countries across Europe and for all products groups;\n* Give support in the creation of the social media editorial plan as well as digital assets creation;\n* Activate the necessary online campaigns required to reach desired sales and brand/model awareness: from audience creations in Google and Facebook Business Manager, till the draft set up (related to budget, duration of the campaign, keywords and targeting;\n* Work cts include:\n\n\n* Visual Merchandising:  \n\nTaking responsibility for the display and presentation of all merchandise in and around the Heineken Flagship Store. You will set up a structured in\\-store display plan, take ownership of all displays and ensure Store staff is informed and aligned with the display guidelines.\n* Sales \\& Customer Analysis:  \n\nAnalysing sales performance and customer behaviour, including developing methods to measure the success of different display strategies. You will work closely with the Merchandise Manager to identify opportunities for optimization within the Flagship Store.\n* Data \\& Reporting:  \n\nSupporting the Operations Team in the creation and analysis of Store Operations reports, such as daily conversion rates and units per transaction, providing valuable insights into store performance.\n* Store Request Online Support:  \n\nAssisting with internal online merchandise orders and coordinating the packing and shipment of these orders.\n* Warehouse Support:  \n\nSupporting the Warehouse Manager in Retail tasks, e.g. printing RFID labels and ensuring all merchandise is properly tagged.\n\n\nYour new team and workplace\n\n\n\nYou will be working at the Heineken Experience, located in the former Heineken brewery in the heart of Amsterdam. As one of the city’s main attractions, it welcomes almost one million visitors per year from all over the world.\n\n\n\nDuring this internship, you will be part of the Retail team, whose mission is to bring the Heineken Experience home through merchandise, where every item extends the brand experience beyond the visit. This comes to life in the iconic Heineken Flagship Store, one of the largest branded merchandise stores in the world, offering everything from keychains and glasses to Heineken\\-branded apparel.\n\n\nYou will collaborate closely with the Merchandise Manager, Operations Manager, Warehouse Manager, Assortment Coordinator, Store Shift Leaders and Logistics Employees, and work cross\\-functionally with the Marketing, Sales, and Development \\& Innovations departments. You will move across the entire retail operation, from Store floor to office and warehouse, making this a hands\\-on, dynamic internship where no two days are the same.\n\n\n\nDuring your internship, you’ll have every opportunity to get to know HEINEKEN as an organization, not just within your own team, but across departments. We trust and empower yo", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship - Marketing Capabilities", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=6c884210433d12db", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "Internship – Marketing Capabilities\n\n\n\" The combination of creative projects, global collaboration, and constant learning is what makes this internship so rewarding!\" \\~ Giulia, Intern\n\n\n\nThe internship\n\n\n\nThis Internship is part of the Global Commerce University (GCU) that develops Marketing Capabilities across Brand Building, Innovation, RMG \\& Sales. Through online Masterclasses \\+ e\\-learnings, these capabilities are implemented throughout the Commerce organization worldwide. The GCU also leads the Capability Builders Community, a community that supports the embedding of the capabilities in the operating countries.\n\n\n\nKey Responsibilities\n\n\n* Support in development and deployment of Masterclasses and E\\-Learnings including related materials and communications\n* Logistical support for E\\-Learnings and Masterclasses (scheduling, coordination with relevant parties, technical support)\n* Coordinating communication to Commerce Community \\& Capability Builders\n* Maintenance of the internal website of Global Commerce University, updating Commerce events calendar\n* Support in development and roll\\-out of Regional Creative Councils at Heineken\n\nDuring your internship you will support the Senior Capability Managers from the GCU in developing and implementing marketing capabilities.\n\n\n\nYour new team and workplace\n\n\n\nThe Global Commerce University (GCU) at The HEINEKEN Company develops Marketing and Commerce capabilities across Brand Building, Innovation, Revenue Management, and Sales through global e\\-learnings, masterclasses and more. One of the team’s main challenges is creating engaging learning experiences that can be implemented across different markets worldwide.\n\n\n\nThe team is international, approachable, and highly collaborative, which makes it a great place to do an internship. The combination of creative projects, global exposure, and learning from experienced professionals creates a very dynamic and rewarding environment.\n\n\n\nDuring your internship, you’ll have every opportunity to get to know HEINEKEN as an organization, not just within your own team, but across departments. We trust and empower you to work with an entrepreneurial mindset. At HEINEKEN, we love bringing the outside world in and welcome fresh, new ideas with open arms. Of course, we’ll make sure you get the guidance that suits you.\n\n\n\nThe unique you!\n\n\n\nWe believe everyone has unique talents, which is why we’re looking for you! Energy, drive and the ambition to grow are what make the difference at HEINEKEN. In addition, you bring:\n\n\n* Project and Stakeholder Management skills\n* Excellent MS Suite Skills – particularly PowerPoint/Excel \\& Teams\n* Strong Creative and Analytical skills\n* Learning mindset and Can\\-do attitude\n* Strong communicator \\& Connector\n* Passion for Marketing and Brand Building\n* Currently enrolled/ a degree in Business and/or related fields\n* Canva/ design skills are a Plus\n\nEven if you feel you don’t meet all the criteria, we encourage you to apply. An int", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship - Global Procurement ESG Regulatory Compliance", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=11b6127d3380f0ef", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "Internship \\- Global Procurement ESG Regulatory Compliance\n\n\nLocation: Schiphol, The Netherlands  \n\nDuration: 6 months (full‑time, 4 days/week possible in consultation)  \n\nDepartment: HEINEKEN Global Procurement Enablement\\- Governance\n\n\n\nThe Internship\n\n\n\nAs a Global Procurement ESG Regulatory Compliance Intern you will support the Global Procurement ESG regulatory compliance agenda within HEINEKEN. You will work closely with the Procurement ESG Regulatory Compliance Managers and help shape how we respond to the fast\\-evolving landscape of sustainability regulations—like CSRD, EUDR, and CSDDD—with confidence and clarity.\n\n\n\nAt HEINEKEN, Procurement owns the Scope 3 agenda, playing a pivotal role in driving carbon footprint reporting and ensuring our supply chain aligns with our sustainability ambitions. Every year, our efforts contribute to HEINEKEN’s Annual Report, showcasing our progress and commitment to responsible business conduct.\n\n\n\nDuring your internship you will get the opportunity to get to know HEINEKEN as a company, also outside your department. We give you the trust and freedom, so you can work like a real entrepreneur. We like to bring the outside world inside and therefore we embrace new, fresh ideas with enthusiasm. Of course, always with the guidance that is right for you.\n\n\n\nYour Responsibilities\n\n\n* Support quarterly procurement reporting and data accuracy.\n* Support in implementing the HEINEKEN Business Partner Policy, including driving communications to all stakeholders.\n* Drive the Key Strategic Procurement Initiative with the Operating companies and track their progress\n* Assist with obtaining all relevant data relating to CSRD KPI’s, including tracking, coordination, and follow‑ups with Operating Companies.\n* Support documentation, record‑keeping, and audit‑readiness activities.\n* Contribute to continuous improvement by identifying trends, gaps, or insights in EU regulatory compliance data (CSRD, EUDR, CSDDD).\n\n\nYour New Team and Responsibilities\n\n\n\nWithin Global Procurement Enablement, we ensure HEINEKEN Global Procurement teams can do what they do best: build strong supplier relationships, ensure policy compliance, and deliver business value. The Governance team plays a key role in driving responsible sourcing, risk management, and global standards.\n  \n\nDuring your internship, you’ll have every opportunity to get to know HEINEKEN as an organization, not just within your own team, but across departments. We trust and empower you to work with an entrepreneurial mindset. At HEINEKEN, we love bringing the outside world in and welcome fresh, new ideas with open arms. Of course, we’ll make sure you get the guidance that suits you.\n\n\n\nThe Unique You!\n\n\nWe believe everyone has unique talents, which is why we’re looking for you! Energy, drive and the ambition to grow are what make the difference at HEINEKEN. In addition, you bring:\n\n\n* You are currently enrolled at a university (Bachelor’s or Master’s level).\n* You have an inter", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship - Procurement Transformation Europe", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=7fef56bf2f870321", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "Internship – Procurement Transformation Europe\n\n\n\n\"This internship showed me what transformation really looks like in practice. From streamlining and automating reporting to navigating stakeholders, I learned how procurement evolves from the inside out — and I loved every minute of it!\" “\\- Huten Vasell\n\n\n\nThe internship\n\n\n\nAre you eager to gain hands\\-on experience in business transformation, project management, and procurement? As an intern, you won't just watch; you will drive a high\\-impact regional program across Europe. You’ll work at the intersection of communication, data automation, and \"program hygiene.\" This role is perfect for someone who wants to move beyond theory and see how transformation really happens by keeping timelines moving and creating the documentation that ensures our long\\-term continuity.\n\n\n* Ownership \\& Delivery: Taking end\\-to\\-end responsibility for concrete deliverables and smaller workstreams or country coordination.\n* Program Excellence: Maintaining \"program hygiene\" (action logs, tracking) and building playbooks and handover packs to ensure continuity.\n* Data \\& Visibility: Standardizing and automating reporting to improve data accuracy and visibility across our OpCos.\n* Stakeholder Engagement: Creating structured communication materials and chasing inputs to keep regional projects on track.\n* Process Innovation: Identifying operational pain points and supporting lightweight automation to improve how we work.\n\n\nYour new team and workplace\n\n\n\nYou will be part of the HEINEKEN Global Procurement team, working for the region Europe and in close collaboration with the Strategic Sourcing Director for Commerce and Business Services and her full team. This function is integral to HEINEKEN's success, and the role offers significant opportunities to contribute to high\\-impact initiatives.\n\n\nDuring your internship, you’ll have every opportunity to get to know HEINEKEN as an organization, not just within your own team, but across departments. We trust and empower you to work with an entrepreneurial mindset. At HEINEKEN, we love bringing the outside world in and welcome fresh, new ideas with open arms. Of course, we’ll make sure you get the guidance that suits you.\n\n\n\nThe unique you!\n\n\n\nWe believe everyone has unique talents, which is why we’re looking for you! Energy, drive and the ambition to grow are what make the difference at HEINEKEN. In addition, you bring:\n\n\n* Strong analytical, communication, and interpersonal skills\n* The ability to work independently, take ownership, and collaborate well with others\n* Confidence in processing and analyzing data; advanced Excel skills (or the motivation to learn them)\n* Fluent English, both written and spoken\n* A natural interest in problem\\-solving and innovation\n* High energy and a willingness to learn, adapt, and grow in a fast\\-paced environment\n* Curiosity to explore a future career in Procurement\n\n\nEven if you feel you don’t meet all the criteria, we encourage you to apply. ", "source": "indeed"}, {"company": "Philips", "job_title": "Internship Quality Trainee Europe C&R", "location": "Eindhoven, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Philips", "job_url": "https://nl.indeed.com/viewjob?jk=9ef1e2c0dc14619f", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "### **Job Title**\n\nInternship Quality Trainee Europe C\\&R\n### **Job Description**\n\n**Start Date: As of July 2026**\n\n**Duration: at least / 6 months**\n\n**Type: Internship (non\\-thesis)**\n\n**Weekly Presence: 40h (minimum 32h)**\n\n**Location: Eindhoven \\- HTC 52**\n\n**Your role:**\n\nSupport Corrections \\& Removals activities in the Post Market Surveillance area:\n\n\n* Support in Field Safety Notice communication to customers and performing of C\\&R due diligence activities.\n* Management of customers’ replies\n* Management of Quality Work Orders in the Philips tool\n\nRequired Competencies and Skills:\n\n\n* Communication and problem\\-solving skills. Ability to cooperate with other functions in the organization\n* Educational level: bachelor degree (preferred in Biomedical Engineering)\n* **\\*Must be able to speak, understand and write fluently both English and Spanish\\***\n* Application software: Microsoft Office, Main Browsers.\n* Knowledge of EU MDR recommended\n* Recommended knowledge of ISO standards 9001 and 13485\n\nThe Intern, is responsible for managing a dedicated departmental support process which has an indirect impact on Philips’ med\\-tech products (e.g. audit processes within Finance) by collaborating with stakeholders and for supporting daily activities typically involving strategic, operational and/or administrative tasks etc. to meet dynamic and continuous improvement goals, exercising autonomy within established procedures. The role conducts research on relevant topics, analyzing data to identify significant trends and provides actionable recommendations for strategic direction. The role participates in team meetings, offering innovative ideas and capturing detailed minutes, while also preparing and presenting accurate reports for stakeholders. The role also organizes and maintains departmental documentation, ensuring operational efficiency and compliance, and stays updated on industry trends and best practices, displaying a commercial and growth mindset.\n\n\n**How we work together**\n\nWe believe that we are better together than apart. For our office\\-based teams, this means working in\\-person at least 3 days per week. Onsite roles require full\\-time presence in the company’s facilities. Field roles are most effectively done outside of the company’s main facilities, generally at the customers’ or suppliers’ locations.\n\n\n**We offer you:**  \n\nA non\\-stop growth opportunity within a global multinational company. In addition, we also want to renumerate you well for the opportunity. This includes:\n\n\n* Monthly full\\-time allowance between €500 \\- €700 gross, depending on your education level and if you need to relocate to The Netherlands. Part\\-time internships receive the allowance pro\\-rata.\n* Housing compensation. Should you need to relocate to near our office, we’ll offer you a monthly allowance of €300,\\- net if location is in the vicinity of Amsterdam, €255,\\- net for all other Philips locations. To be eligible, we’ll just ask for the rental contract fro", "source": "indeed"}, {"company": "Philips", "job_title": "SPS Global planning intern", "location": "Best, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Philips", "job_url": "https://nl.indeed.com/viewjob?jk=6c981b7cd2370e5b", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-21", "recruiter_email": null, "applicant_count": null, "description": "### **Job Title**\n\nSPS Global planning intern\n### **Job Description**\n\n**Start Date: As of August 2026**\n\n**Duration: at least / 6 months**\n\n**Type: Internship (Thesis internship)**\n\n**Weekly Presence: 40h (minimum 32h)**\n\n**Location: Best**\n\n**Internship Title**\n\n**SPS Global planning intern**\n\n**Job Description**\n\nJoin us for Supply chain internship at Philips. Our Service Parts Supply Chain Planning Team is currently looking for a passionate person to join the team.\n  \n\n  \n\n**Your role is to study the research question:**\n\nHow to plan very slow moving and intermittent demand parts which form the biggest portion of the Philips service parts portfolio especially for small locations? Due to unexpected demand quantities or first\\-time demand, it is not possible to reach provided fill\\-rate targets in the inventory optimization.  \n\n\n\n  \n\n**You're the right fit if:**  \n\n* Analytical thinking and problem solving mindset.\n* **Knowledge of service parts planning processes (forecasting, optimization and supply planning)**\n* Strong English written and verbal communication skills required.\n* You are currently studying towards your Master of Science (Msc.) within Supply Chain\nManagement or Operations Research.\n\n\n**How we work together**\n\nWe believe that we are better together than apart. For our office\\-based teams, this means working in\\-person at least 3 days per week. Onsite roles require full\\-time presence in the company’s facilities. Field roles are most effectively done outside of the company’s main facilities, generally at the customers’ or suppliers’ locations.\n\n\n**We offer you:**  \n\nA non\\-stop growth opportunity within a global multinational company. In addition, we also want to renumerate you well for the opportunity. This includes:\n\n\n* Monthly full\\-time allowance between €500 \\- €700 gross, depending on your education level and if you need to relocate to The Netherlands. Part\\-time internships receive the allowance pro\\-rata.\n* Housing compensation. Should you need to relocate to near our office, we’ll offer you a monthly allowance of €300,\\- net if location is in the vicinity of Amsterdam, €255,\\- net for all other Philips locations. To be eligible, we’ll just ask for the rental contract from your landlord, and your usual home\\-work travel distance needs to be more than 50 km or 1\\.5 hours of travel time (for a one way trip).\n* Travel compensation, if you are not eligible for a free public transport card; you will receive max. €192,\\- net as a monthly allowance.\n* Paid holidays per internship term.\n* The opportunity to buy Philips products at our Philips shop.\n\n**About Philips**\n\nWe are a health technology company. We built our entire company around the belief that every human matters, and we won't stop until everybody everywhere has access to the quality healthcare that we all deserve. Do the work of your life to help the lives of others.\n\n\n* Learn more about our business .\n* Discover our rich and exciting history .\n* Learn more about our p", "source": "indeed"}, {"company": "Unilever", "job_title": "Internship 26' - Customer Development Trade Marketing", "location": "Rotterdam, ZH, NL", "careers_url": "https://nl.indeed.com/cmp/Unilever", "job_url": "https://nl.indeed.com/viewjob?jk=f94e53f72dcff1cf", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-19", "recruiter_email": null, "applicant_count": null, "description": "*Are you ready to kick\\-start your career at one of the world’s most iconic companies?*\n\nAt Unilever, we’re not just about creating products – we’re about building dreams, opportunities, and innovation. With over 400 brands like Dove, Knorr, and Lipton, we’re committed to making sustainable living commonplace.\n\n\nThis is more than just an internship; it’s a chance to learn, grow, and leave your mark at one of the largest FMCG companies on the planet.\n\n\n**What makes this internship exciting?**\n\n\nAs a **Customer Development** **Trade Marketing Intern at Unilever**, you will have an exciting and dynamic role where you collaborate with multiple teams and gain exposure across different business functions. You will work closely with **Brand Marketing teams**, customer teams/account managers, and support more than **100 enthusiastic field sales representatives**.\n\n\nThis internship offers the unique opportunity to work across **all product categories and brands within Unilever Retail**. Even better, you will quickly see the impact of your work reflected in supermarkets throughout the Netherlands!\n\n**Your responsibilities will include:**\n\n* Contributing ideas, developing, and coordinating new promotional campaigns;\n* Presenting and introducing campaign initiatives to the Field Sales team;\n* Ensuring consistency between promotional activities and brand identity;\n* Coordinating various **in\\-store and outdoor marketing activities**, such as events and in\\-store demonstrations;\n* Creating engaging sales presentations in an app used by store account managers.\n\n**You’re the perfect fit if:**\n\n\n* You’re available for 5 to 6 months starting August\\-September 2026 (minimum 32 hours/week).\n* You are enrolled in a Bachelor (3rd or 4th year) or Master program, preferably in Marketing.\n* You are fluent in Dutch and/or English.\n* You have a passion for creativity and driving impactful ideas.\n* You have strong analytical thinking skills.\n* You understand digital marketing and marketing principles.\n* You can link marketing strategies with consumer love.\n* You have a passion for high performance.\n\n**Why you’ll love working with us?**\n\n\nWe know internships are all about growth and exploration – and we’ve got you covered.\n\n\n* A €625 gross/month allowance.\n* Travel reimbursement (if you don’t have a student travel card).\n* Fun and engaging intern programs – onboarding, events, and activities with fellow interns.\n* Access to extensive training programs for personal and professional growth.\n* A flexible working environment tailored to your success.\n* A behind\\-the\\-scenes experience at one of the world’s largest and most innovative FMCG companies.\n\n**Application Process**\n\n* Click \"Apply now\" and upload your CV and motivation letter. Don't forget to complete the questionnaire we send you. It's your chance to shine!\n* Our team will carefully review your application. We receive a lot of applications, so please bear with us as we give each one the attention it deserves.\n* If we t", "source": "indeed"}, {"company": "pladis Global", "job_title": "Regulatory Affairs Intern", "location": "Zaandam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Pladis-Global-2", "job_url": "https://nl.indeed.com/viewjob?jk=65f124812af6decb", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-19", "recruiter_email": null, "applicant_count": null, "description": "Want to help us bring happiness to the world? Want to join an ambitious and fast growing global biscuits and confectionery business investing heavily in iconic global brands, infrastructure and people? Then this is the place for you.\n\n\nAs proud bakers and chocolatiers and custodians of iconic global brands, we don’t compromise on the quality of ingredients in our products or on the people we hire. We are looking for entrepreneurial spirits who share our passion for bringing happiness to our consumers and who embody our Winning Traits.\n\n\nTo succeed at pladis you need to be **purpose\\-led**, **resilient** and **positive** to succeed here because we expect pace and **agility**, we insist on **collaboration** and demand accountability. If that is your thing, then pladis offers global ambition, a clear Vision and roadmap for success, challenge, and unrivalled opportunities to learn and make an impact\n\n  \n\nClick “Apply” to get started.\n\n*Are you curious about the legal aspects involved in bringing the tastiest cookies, chocolates, and snacks to the market?*\n\nThen we have a spot for you as an intern within the Regulatory Affairs team at Koninklijke Verkade in Zaandam starting in September 2026\\. During this internship, you will have the opportunity to work at a top A\\-brand organization with Verkade and Sultana as absolute favourites, but also McVities and Godiva. You will be involved throughout the entire process: from coming up with a new recipe to the final design, how cool is that?\n\n**Description**\n\n\nWithin the Regulatory Affairs team, we ensure daily that all our products meet all (legal) requirements. As an intern, you will support the entire team. You are truly part of the team and will have a lot of responsibility. We try to tailor the projects as much as possible to your interests and learning goals, so you can start your workday with pleasure. We work closely with other departments in Zaandam and teams within pladis, ensuring you have a varied internship and can orient yourself broadly.\n\n\nThe internship consists of supporting the Regulatory Affairs team in the following areas:\n\n* Implementing EU labelling legislation and other relevant regulations on our products within Europe, focusing on the Netherlands and France;\n* Conducting label checks.\n\n**Examples of responsibilities**\n\n\nDuring your internship, you will work on the following topics:\n\n* Entering recipes into our databases (e.g., Hamilton Grant) and preparing product specifications;\n* Checking possible claims and under what conditions;\n* Preparing pack copies of various artworks and conducting checks of the final artwork in close collaboration with Marketing;\n* Handling (customer) requests regarding the provision of product information;\n* Keeping databases such as Fairtrade up\\-to\\-date;\n* Supporting the team in projects such as clean labelling, management of change, optimizing (internal) processes.\n\n**Who are you**\n\n* You are a 3rd or 4th\\-year student with a university or HBO study in ", "source": "indeed"}, {"company": "KARL LAGERFELD", "job_title": "Digital Master Data Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Karl-Lagerfeld", "job_url": "https://nl.indeed.com/viewjob?jk=a58e5a8b40abf604", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-19", "recruiter_email": null, "applicant_count": null, "description": "Amsterdam (HQ), North Holland\nInterns – Digital Commerce /\nInternship /\nHybrid\n\n**ABOUT THE BRAND**\n\nAt Karl Lagerfeld, we are driven by Karl’s mantra: “Embrace the present and invent the future.”\n\nAlways contemporary and forward\\-looking, the House of KARL LAGERFELD shares the creative vision and design aesthetic of its iconic founder, Karl Lagerfeld.\n\nWe are the only fashion house that carries Karl’s name on its door and we strive to live up to this responsibility in everything we do, every day, with the utmost joy and passion.\n\nOur headquarters in Paris and in Amsterdam are home to a highly diverse and driven team of KARL family members that hail from over 35 countries. Together, we aim to create meaningful stories and product concepts that connect to Karl’s world and iconic attributes.\n\nWomen’s \\& Men's ready\\-to\\-wear, bags, small leather goods, swimwear and underwear are managed directly from our Amsterdam headquarters, while other categories, including footwear, fragrances, eyewear and more, are developed with best\\-in\\-class licensing partners.\n\nWe connect with our consumers on multiple levels, ensuring that our online and offline approach goes hand in hand. We thrive to maximize consumer engagement via more than 200 KL stores worldwide, our premium wholesale partners, and our strong digital footprint, spearheaded by our karllagerfeld.com flagship store, which reaches 96 countries. Our digital channels currently represent more than 30% of our overall full\\-price business.\n\nWe are a dynamic, fast\\-growing and inclusive company built on professionalism and strong values. At KARL LAGERFELD we’re committed to working toward the highest standards of sustainability and integrity across all areas of our business. In 2019, KARL LAGERFELD joined as a founding member of the Fashion Pact, a global sustainability initiative seeking to transform the fashion industry through objectives in three areas: climate, biodiversity and ocean protection. **PURPOSE OF THE ROLE**\nThe Digital Masterdata Intern will support the Digital Masterdata Specialist with the accurate and timely setup of product data for the Digital Commerce department. You will be working mainly on our PIM (Product Information Management) system as well as on our integrator platforms to ensure that product data is fully enriched so that they can be published on our digital platforms on set target dates.\n### **Key Responsibilities**\n\n* Assisting in creation and updating of seasonal E\\-commerce master data file.\n* Supporting with enriching product data in the PIM system.\n* Following up on master data error resolution by gathering information from partners and different departments to complete missing data.\n* Assisting in the export of master data from the PIM system to integrators.\n* Assisting in setup of seasonal data within the integrator.\n* Assisting in preparation of new marketplaces data requirements.\n* Assisting in improving the PIM system for better data organization and accessibility.\n", "source": "indeed"}, {"company": "MPAC", "job_title": "Internship - Wijchen", "location": "Wijchen, GE, NL", "careers_url": "https://nl.indeed.com/cmp/Mpac", "job_url": "https://nl.indeed.com/viewjob?jk=cf813dd1942179de", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-18", "recruiter_email": null, "applicant_count": null, "description": "**Internship at Mpac Wijchen**\n------------------------------\n\n  \n\nAre you looking for an internship and does working within an international company appeal to you? At Mpac, we are happy to work with you to find a suitable internship.\n\n### **What will you do?**\n\n  \n\nMpac is all about people. Without our colleagues, we wouldn't be able to deliver our unique and high\\-quality products. We believe it is important to train students to become professionals. As an intern at Mpac Langen, you will work within one of our departments. Depending on your studies, wishes, and needs, we will work together with you to find a suitable internship at Mpac Langen in Wijchen.\n\n  \n\nDuring your internship, you will be given significant responsibility and will truly be considered part of the team. We aim to provide you with a personalized internship experience. Opportunities are available in the following departments:\n\n  \n\n* ICT\n* Procurement\n* Engineering\n* Service\n* Product Management\n* Sales\n* HR\n* Operations\n\n### **What we offer**\n\n* An internship allowance between €300 and €500 gross per month\n* An internship within an international company\n* Fun company outings organized by our staff association\n\n### **Who are you?**\n\n* You are enrolled in an MBO and/or HBO program\n* You have a good command of Dutch and English, both spoken and written\n* You are enthusiastic and motivated , "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "TOMS Shoes", "job_title": "Marketing Intern - EMEA", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Toms-Shoes", "job_url": "https://nl.indeed.com/viewjob?jk=5304a3b80ca1cc4e", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-28", "recruiter_email": null, "applicant_count": null, "description": "**About TOMS**\n\n\nTOMS is in business to improve lives. When you wear or work with TOMS, you help positively impact lives — 106 million and counting. Every TOMS purchase helps support children’s education, health, and well\\-being, giving kids everywhere the gift of a better tomorrow.\n\n\nAs a Certified B Corp, we are proud to meet high standards of transparency, accountability, and social and environmental performance.\n\n**About The Role**\n\n\nAs the EMEA Marketing Intern, you will support the EMEA Marketing Team with day\\-to\\-day operations, in the fields of Social Media, PR, Brand and Wholesale marketing management.  \n\n  \n\nThis role is a unique opportunity to gain experience within a social enterprise, understanding the balance between brand, commerciality and purpose.  \n\n  \n\nDue to changing business priorities and the new intern’s skillset, the below is a proposal, and open for discussion. Not all tasks will be ‘on’ all the time.\n\n**What You’ll Do**\n\n**BRAND:**\n\n* Owning asset management across PR / Wholesale / Distributors\n* Craft and polish compelling copy\n* Build the seasonal product assortment board\n* Website content planning\n\n**PR \\& BRAND COMMUNICATIONS:**\n\n* Maintain an up\\-to\\-date PR calendar\n* Support on the creation of presentations and reporting for the PR agencies\n\n**SOCIAL MEDIA:**\n\n* Develop and execute the social content calendar\n* Content creation\n* Community engagement\n\n**WHOLESALE/DISTRIBUTORS:**\n\n* Keep Sell Through decks updated per key account\n* Owning the “Distro zone” asse
