  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

    header { background: var(--surface); border-bottom: 1px solid var(--border);

      position: sticky; top: 0; z-index: 100; flex-wrap: wrap; }
    header h1 { font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #ec4899);

    .hdr-sub { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px;
      background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
    .badge.purple { background: rgba(168,85,247,0.1); color: var(--accent); border-color: rgba(168,85,247,0.3); }

    .controls { padding: 16px 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input[type="text"], select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 9px 13px; font-size: 14px; outline: none;
      transition: border-color 0.2s; }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    #search { flex: 1; min-width: 220px; font-size: 15px; }

    .stats-bar { padding: 10px 24px; display: flex; gap: 14px; align-items: center;
      font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .stats-bar strong { color: var(--text); }

    .stat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .stat-chip { font-size: 11px; padding: 3px 10px; border-radius: 20px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); }
    .stat-chip.applied { background: rgba(34,197,94,0.1); color: var(--green); border-color: rgba(34,197,94,0.3); }
    .stat-chip.interview { background: rgba(59,130,246,0.1); color: #60a5fa; border-color: rgba(59,130,246,0.3); }
    .stat-chip.offer { background: rgba(168,85,247,0.1); color: var(--accent); border-color: rgba(168,85,247,0.3); }
    .stat-chip.rejected { background: rgba(239,68,68,0.1); color: var(--red); border-color: rgba(239,68,68,0.3); }
    .stat-chip.bookmarked { background: rgba(245,158,11,0.1); color: var(--yellow); border-color: rgba(245,158,11,0.3); }

    #list-container { padding: 16px 24px 60px; display: flex; flex-direction: column; gap: 10px; }

    .job-card { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px; display: flex; gap: 14px;
      align-items: flex-start; transition: border-color 0.2s; }
    .job-card:hover { border-color: var(--accent); }
    .job-card.status-applied { border-left: 3px solid var(--green); }
    .job-card.status-interview { border-left: 3px solid #60a5fa; }
    .job-card.status-offer { border-left: 3px solid var(--accent); }
    .job-card.status-rejected { border-left: 3px solid var(--red); opacity: 0.6; }
    .job-card.status-bookmarked { border-left: 3px solid var(--yellow); }

    .job-card-main { flex: 1; min-width: 0; }
    .job-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
    .job-company { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .job-sector { font-size: 10px; color: var(--text-muted); background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; }
    .source-badge { font-size: 10px; border-radius: 10px; padding: 1px 7px; font-weight: 600; }

    .job-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 5px; line-height: 1.3; }
    .job-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .job-meta span::before { content: '· '; }
    .job-meta span:first-child::before { content: ''; }
    .job-notes { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-top: 4px; }

    .job-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 90px; flex-shrink: 0; }
    .job-link { font-size: 12px; padding: 6px 12px; border-radius: 6px; background: var(--accent);
      color: #fff; text-decoration: none; font-weight: 600; white-space: nowrap; text-align: center; }

    .job-link:hover { opacity: 0.85; }
    .status-select { font-size: 11px; padding: 4px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; width: 100%; }

    .match-badge { font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 8px; white-space: nowrap; }
    .match-ex  { background: rgba(34,197,94,0.15);  color: #22c55e; border: 1px solid rgba(34,197,94,0.35); }
    .match-str { background: rgba(132,204,22,0.15); color: #a3e635; border: 1px solid rgba(132,204,22,0.35); }

    .match-low { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

    #no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); display: none; }
    #no-results h3 { font-size: 18px; margin-bottom: 8px; }
  </style>
</head>

 during the internship, you will work with our team on real client questions while developing a thesis topic that fits our energy and/or sustainability focus.\n\n  \n\nWe are looking for candidates who:\n\n* Have a strong affinity with energy and sustainability topics, emphasizing areas such as industrial decarbonization, grid expansion and modernisation, congestion, flexibility, offshore wind, hydrogen, digitalisation, data and AI.\n* Bring skills and interests that complement Guidehouse’s broad strengths, for example related to agentic AI, data automation, business process optimization, or risk management.\n* Demonstrate a consulting mindset: Commercially oriented, agile, and able to rapidly understand sector dynamics.\n* Possess strong soft skills, critical thinking, and problem\\-solving abilities.\n* Are proactive, independent, and passionate about consulting.\n\n\nWhat you will do:\n\n\nWe provide an internship opportunity that allows you to both focus on your thesis and work on ongoing projects. Depending on your internship set up, you will:\n\n* Write your thesis with support from our experts and contribute at least 8 hours/week to project work.\n* Contribute to diverse projects for international clients, from assessing environmental performance to supporting market development in new sectors.\n* Market and policy analysis, data\\-driven insights, interviews, workshops, synthesis of findings, models, dashboards and visualisations.\n* Uphold Guidehouse’s values of respect, integrity, innovation, stewardship, and excellence, supporting our culture of inclusion and diversity.\n* Build relationships with colleagues and participate in team and industry events.\n\n\nWhat you will need:\n\n\nAcademic Qualifications and Interests:\n\n* Enrolled in a relevant Master’s program (e.g., business, engineering, economics, mathematics, physical sciences, etc.).\n* Strong curiosity and/or experience in topics such as sustainability, advanced energy technologies, data and AI, e, we’ll make sure you get the guidance that suits you.\n\n\n\nThe unique you!\n\n\n\nWe believe everyone has unique talents, which is why we’re looking for you! Energy, drive and the ambition to grow are what make the difference at HEINEKEN. In addition, you bring:\n\n\n* You’re currently enrolled in a Bachelor’s or Master’s program in Business, Engineering, or a related field\n* You have a strong interest in project management, planning, and working in a collaborative team environment\n* You are comfortable with Excel or PowerPoint, with an interest in developing data analysis and visualisation skills\n\nEven if you feel you don’t meet all the criteria, we encourage you to apply. An internship is the perfect opportunity to learn and grow!\n\n\n\nConditions of HEINEKEN\n\n\n\n* You are enrolled at an educational institution for the entire duration of your internship and can provide proof of enrollment for the current academic year during your onboarding.\n\n\n\n\t+ In the case of non\\-EU nationality, you must be registered as an intern with a Dutch educational institution.\n\n\t+ In case of EU nationality, you may also be registered as an intern at educationa", "source": "indeed"}, {"company": "Tesla", "job_title": "Marketing Programs Internship", "location": "Amsterdam-Zuidoost, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Tesla", "job_url": "https://nl.indeed.com/viewjob?jk=519dc6b221555b14", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": null, "applicant_count": null, "description": "**What to Expect**\nStart date: August 16, 2026\n  \n\nLocation: Amsterdam\n  \n\nDuration: 6 Months\n  \n\nLength: Full time (40h a week)\n  \n\n  \n\nNOTE: YOU MUST BE ENROLLED IN EDUCATION DURING THE ENTIRE INTERNSHIP TO BE CONSIDERED.  \n\n  \n\n  \n\nTesla Energy seeks a Marketing Programs Intern to join the Energy Products Marketing team in Europe, Middle East, and Africa (EMEA). In this role, you will help drive growth for residential energy products like Powerwall across key markets, including the United Kingdom, Ireland, Germany, Switzerland, Italy, Malta, Spain, Portugal, South Africa, the Netherlands, and France.\n  \n\n  \n\nAs a Marketing Programs Intern, you will support the team in delivering lead generation campaigns through content creation and localization, event management for trade shows and in\\-store activations, cross\\-selling opportunities with other Tesla business units, and targeted email campaigns. You will also source influencer collaborations and use data insights to test, learn, and optimize campaigns.\n  \n\n  \n\nThe ideal candidate is a self\\-starter with strong ownership, able to juggle multiple tasks under tight deadlines. You will bring interpersonal skills, proactivity in spotting opportunities, and a team\\-oriented passion for learning. You will collaborate with diverse stakeholders—including engineering, marketing, design, copywriters, sales, and legal teams—to deliver impactful campaigns across the region.\n\n **What You'll Do*** Assist with planning and executing targeted email marketing campaigns to engage partners, support sales goals, and build relationships\n* Support the development, localization, and management of marketing content and collateral for customer\\-facing materials and promotions\n* Help coordinate logistical moves of Tesla assets and merchandise across the region\n* Collaborate with local stakeholders to build and present marketing strategy decks for internal audiences\n* Act as a brand ambassador by reviewing and approving marketing content for Certified Installers to ensure compliance with Tesla guidelines\n* Coordinate documentation, assets, and internal communications for key partners, keeping them updated in Tesla's proprietary platforms\n* Track campaign performance using data insights, optimize strategies, and prepare post\\-campaign reports to drive improvements\n  \n\n**What You'll Bring*** Currently pursuing a degree in Marketing or a related field, or demonstrates exceptional ability through equivalent experience\n* Fluent in English and native speaker of Dutch or German\n* Creative mindset with a focus on innovation, new ideas, and solving complex challenges\n* Strong sense of ownership and eagerness to drive projects forward\n* Positive \"can\\-do\" attitude, passion for the role, and ability to inspire and commit to team goals\n* Experience in renewable energy is a plus\n\nWillingness to travel approximately 10% within the region  \n\n  \n\n  \n\nTesla is an Equal Opportunity / Affirmative Action employer committed to diversity in t", "source": "indeed"}, {"company": "ZOA", "job_title": "Intern Institutional Relations", "location": "Apeldoorn, GE, NL", "careers_url": "https://nl.indeed.com/cmp/Zoa-2", "job_url": "https://nl.indeed.com/viewjob?jk=0875c666dade19e7", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-26", "recruiter_email": null, "applicant_count": null, "description": "**Job location:** Apeldoorn  \n\n**Starting date:** 1st September 2026  \n\n**Vacancy closing date:** 15 June 2026  \n\n**Duration position:** 4 to 6 months  \n\n**Working hours:** Maximum32 hours per week\n\n  \n\n**ZOA**, as an international NGO, supports people who have lost everything due to armed conflict or natural disaster. Together, we can come to their aid in emergencies and remain faithful to communities as they recover – providing new opportunities for them to help themselves again. The work of ZOA is coordinated from our office in Apeldoorn, the Netherlands. We are active in Africa, the Middle East region, and Asia. We work with approximately 900 employees worldwide and with (local) partners. We invite you to join our team of committed colleagues.\n\n\n\nAre you a Master’s student in international relations, international development, humanitarian affairs? Are you willing to contribute and learn more about institutional relations within an international NGO?\n\n  \n\n\n**ZOA is looking for an**\n\n\n**Intern – Institutional Relations**\n\n  \n\n**Team**\n\n\n\nThe Institutional Relations (IR) team, composed of six dynamic members, is pivotal to ZOA, as 70\\-75 % of the organization’s income consists of funding from institutional donors, including DG\\-ECHO, the Dutch Ministry of Foreign Affairs, DG\\-INTPA and UN agencies. Consequently, it is essential for ZOA to nurture and enhance positive relationships with all major institutional donors. Furthermore, our focus is on consistently submitting strategic proposals that clearly demonstrate ZOA’s expertise and distinctive approach in each country and context.\n\n  \n\n\n**Position**\n\n\n\nAs an intern, you will support the Institutional Relations (IR) team in strengthening ZOA’s access to institutional funding. You will help the team in implementing and further developing our IR strategy, contributing with research, coordination and day‑to‑day tasks. Working closely with the IR colleagues, you will assist in identifying funding opportunities from global institutional donors and in providing support to ZOA’s country teams in their fundraising efforts. You will also collaborate with colleagues across our global offices and HQ departments (Programmes \\& Development Support and Fundraising \\& Communications) to contribute to smooth proposal development processes and internal information sharing.\n\n  \n\n\n**Your challenge?**\n\nIn this internship, you will focus on:\n\n\n* **Support the development of a donor strategy** for ZOA’s key thematic sector – Food Security and Livelihoods\\- by conducting research, compiling internal information, and helping organise inputs.\n* **Assist in creating and updating country brochures and track records from previous projects**, including gathering information from country offices, drafting content, and coordinating visuals and layout with relevant teams.\n* **Contribute to communications on institutional funding**, such as drafting short posts or updates for internal and external channels, highlighting donor ", "source": "indeed"}, {"company": "C-Teleport BV", "job_title": "Finance Analyst Intern (Meewerkstage)", "location": "Rotterdam, ZH, NL", "careers_url": "https://nl.indeed.com/cmp/C--teleport-Bv", "job_url": "https://nl.indeed.com/viewjob?jk=f5ec1f0fd3be58ec", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-25", "recruiter_email": null, "applicant_count": null, "description": "**Location:** Rotterdam, Netherlands  \n\n**Start date:** June 2026  \n\n**Duration:** 20–25 weeks  \n\n**Type:** Meewerkstage  \n\n**Reporting to:** VP Finance\n\n#### **About the role**\n\n\nWe are looking for a highly analytical and ambitious Finance Analyst Intern to join our Finance team in Rotterdam. This is a project\\-based internship working directly with the VP Finance on strategic finance initiatives that support the company’s growth and long\\-term decision\\-making.\n\n\nUnlike traditional finance internships focused on operational or back\\-office work, this role offers hands\\-on exposure to corporate finance, investor\\-related projects, financial strategy, and business analysis. The internship is designed for candidates who want to develop strong analytical and strategic finance capabilities in a fast\\-growing international environment.\n\n\nHigh\\-performing interns may be considered for a full\\-time Finance Analyst role upon successful completion of the internship.\n\n#### **What you will work on**\n\n\nYou will contribute to high\\-impact finance projects such as:\n\n* Supporting investor relations and fundraising preparation\n* Building and improving financial models and business cases\n* Analysing company performance and strategic KPIs\n* Supporting accounts receivable and cash flow optimisation initiatives\n* Preparing management presentations and financial narratives\n* Translating financial and operational data into actionable insights\n* Conducting market, business, and financial research\n\n\nThe exact projects may evolve based on company priorities and your strengths.\n\n#### **What we are looking for**\n\n##### **Required**\n\n* Currently pursuing or recently completed a Master’s degree in Finance, Economics, Business, or a related field  \n\n*(exceptional final\\-year Bachelor’s students will also be considered)*\n* Strong analytical and quantitative skills\n* Advanced Excel and financial modelling capabilities\n* Structured thinker with strong attention to detail\n* Ability to work independently and take ownership of projects\n* Excellent communication skills in English\n\n##### **Nice to have**\n\n* Exposure to investor relations, corporate finance, consulting, or strategy projects\n* Experience with financial analysis, valuation, or data modelling\n* Dutch language skills\n\n#### **Working model**\n\n* Hybrid working setup:\n\n\n\t+ On\\-site in Rotterdam on Mondays, Tuesdays, and Fridays\n\t+ Home office on Wednesdays and Thursdays\n* Full\\-time internship (40 hours per week)\n\n#### **What we offer**\n\n* Direct mentorship from senior finance leadership\n* Exposure to strategic finance and high\\-level decision\\-making\n* A steep learning curve in a fast\\-growing international company\n* Meaningful ownership and responsibility from day one\n* Modern office environment in Rotterdam\n* €700 gross monthly internship allowance\n* Opportunity to transition into a full\\-time Finance Analyst role", "source": "indeed"}, {"company": "G-Star Raw C.V.", "job_title": "Intern Paid Social, Search & Display", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/G--star-Raw-C.v.", "job_url": "https://nl.indeed.com/viewjob?jk=477bc8dfb675670a", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "**WE ARE DENIM HEADS.**\n\n\n\nWe love denim. Live and breathe it. It’s in our DNA.  \n\nAt G\\-STAR, we see no limit to what denim can do. We believe it can be force of progress and innovation for both people and planet. How? By hiring the most creative, curious and caring minds. People who think beyond fashion. Bringing big ideas to big challenges. Driven by possibility. Those who work hard, make mistakes, but always continue to grow. Denim is in our DNA, our people are our stitching.  \n\nJoin the denim heads making raw denim!\n\n\n\nWe are committed to creating an inclusive environment and welcome applications from all qualified candidates, regardless of background, identity, or experience.\n\n\n\n**HERE'S WHAT WE'LL DO TOGETHER:**\n\n\n\nThe G\\-STAR Global Digital Marketing team is looking for a highly motivated and enthusiastic Intern Paid Social with a hands\\-on mentality and love for digital, social and data. We are looking for someone who feels at home in a dynamic and fast\\-moving environment, someone who likes to learn all about the world of performance marketing and has an analytical eye for good creative.\n\n\n\nAs part of the Global Digital Marketing team (HQ) you will learn how to manage the global Paid Social Media accounts of a multi\\-country online retailer. You will be involved from strategy to planning tactics and you will monitor, learn, and adapt while auditing your own results.\n\n\n\nDuring this internship you will support in all areas of performance Digital marketing being part of a global, multicultural team of digital heroes.\n\n\n\n**YOUR TASKS \\& RESPONSIBILITIES:**\n\n\n* Planning and publish – Coordinate the (Social \\& Display) Media planning and make sure all campaigns are scheduled and go LIVE as planned.\n* Set up conversion campaigns in social platforms like Facebook, Instagram, Snapchat, Pinterest and TikTok to drive product sales using various tactics and formats across the platforms.\n* Brief external Display partners on the upcoming campaigns, review their creatives and give feedback.\n* Reporting – track results daily and report media results on a weekly basis\n* Data analysis of past campaigns to give insights and recommendations for the future.\n* Learn and adapt campaigns – after learning by auditing your own campaign results you shift budgets, tactics or adapt content accordingly to improve performance.\n\n\n**WHAT YOU BRING TO THE TABLE:**\n\n\n* You must be enrolled in a Bachelor / Master in Communication / Marketing or a related field.\n* You are passionate about digital and social, and you have a high affinity for fashion and denim.\n* You are eager to learn, you want to discover how things work – you want to be the winner.\n* Vast knowledge of social media platforms: Facebook, Instagram, TikTok, YouTube and Pinterest.\n* Attention to detail, organized, analytical and good at planning\n* Ability to multi\\-task and execute\n* Be able to work in a group of digital heroes (your team) while you also are able to work independent.\n* You have a high interest", "source": "indeed"}, {"company": "The HEINEKEN Company", "job_title": "Internship - Global Government & Public Affairs", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Heineken-Company-5", "job_url": "https://nl.indeed.com/viewjob?jk=7c11e364a3565244", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-22", "recruiter_email": null, "applicant_count": null, "description": "Internship \\- Global Government \\& Public Affairs\n\n\nThe internship\n\n\n\nYou will work alongside the Global Governmental and Public Affairs team, as well as with the local operating companies and colleagues from across the business. Tasks include: monitoring political developments, monitoring tax and/or regulatory developments that might get an impact on our industry, conducting desktop research, stakeholder management, feeding global strategy and promoting Dutch Connectivity, which is our worldwide connection with the Dutch government as a proud Dutch Brewer. Other tasks include helping deliver important short and long\\-term projects for Brew a Better World Strategy \\- with a focus on internal communication \\- as well as covering various aspects of public policy, public affairs and governmental relations.\n\n\n\nThis is a great opportunity to learn first\\-hand about the relationship between public affairs and business, as well as work as part of a multinational team that focuses on global, regional and local issues that affect our operations in 70 countries and sales in many more countries.\n\n\n\nDuring your internship you will get the opportunity to get to know HEINEKEN as a company, also outside your department. We give you the trust and freedom, so you can work like a real entrepreneur. We like to bring the outside world inside and therefore we embrace new, fresh ideas with enthusiasm. Of course always with the guidance that is right for you.\n\n\n\nYour new team and workplace\n\n\n\nThe Global Governmental and Public Affairs team at HEINEKEN sits within the Global Corporate Affairs function, which also includes Global Communications and Sustainable Development. We manage the company’s relationship with a broad range of stakeholders, incl. government and international industry bodies as well as the company’s response to public policies on alcohol, international trade or business regulation. The Global Government and Public Affairs Team is a multinational team that works on issues across HEINEKEN markets worldwide.\n\n\n\nThe terms of employment\n\n\n* Your starting date is 1 September 2026\n* The internship is fulltime\n* The duration of the internship is 5 or 6 months (in consultation with your internship supervisor)\n* It is a practice\\-oriented internship\n* You will be based in Amsterdam\n* Working hybrid – home and from our head office in Amsterdam\n* You will receive an internship fee of €650 gross pm based on 40 hours per week\n* You will enjoy 2 vacation days per month (based on fulltime)\n* If you do not have a student OV product, your commuting expenses wi hnicians, and occasionally factory teams.\n\n\n\nA key part of the internship will involve developing a reliable scale\\-down strategy from industrial high\\-shear mixing to pilot scale and benchmarking pilot emulsions against factory references. You will also contribute to the development of standard operating procedures (SOPs) and present your findings and recommendations to the team at the end of the internship. You will take part in the intern challenge, collaborating with other interns on a shared project during your internship.\n\n\n\nJoin us in shaping the future of food process technology and emulsion innovation!\n\n\n**So, what does it take to be successful in this role?**\n\n\n* You are currently pursuing a Bachelor's or Master's degree in Food Technology, Chemical Engineering, Process Engineering, or a similar field at a Dutch or European university.\n* You are enrolled as a student for the full duration of the internship.\n* You are comfortable working hands\\-on in both pilot plant and laboratory environments.\n* You have an investigative mindset and enjoy designing experiments, analysing data, and solving technical challenges.\n* You are resilient, proactive, and able to work independently.\n* You are comfortable with experimental work, analytical testing, and interpreting technical results.\n* You have strong communication and collaboration skills and enjoy working in a multicultural team environment.\n* It is a plus if you have previous internship experience in the food industry or prior exposure to emulsions, rheology, mixing technologies, or process engineering concepts.\n\n\n**What's next?**\n\n\n\nIf this position sounds interesting, please hit the apply button now. The deadline to apply is 5th of June 2026\\.\n\n  \n\nWe understand your resume might not be up to date and recommend that you apply with what you have or your LinkedIn Profile. Flora Food Group i", "source": "indeed"}, {"company": "JDE Peet's", "job_title": "Intern Global FP&A", "loc er centric supply chains while writing your thesis!\n\n* **Team** Supply Chain \\& Operations is a crucial part of the Strategy \\& Consulting practice. The team plays a vital role in transforming the supply chains and operations of Fortune 500 companies in the Netherlands and around the world into future\\-ready, resilient, autonomous, and circular networks. We work across all aspects of the supply chain — from planning and fulfillment to sourcing, procurement, and manufacturing — helping clients solve complex business challenges through strategy development, process optimization, sustainable logistics solutions, and digital capabilities, while creating positive impact for business, society, and the planet.\n* **Daily tasks** As a Supply Chain Intern, you will get the chance to experience working as a consultant within Accenture, learn about the projects we do and see the impact we’re making for our clients. Through interactions with our colleagues, you'll learn about their personal experiences, immerse yourself in our company culture, and participate in exciting company events.\n* **Research** As a master’s thesis intern, you will embark on research projects focused on cutting\\-edge technologies and topics that are currently top of mind for supply chain executives. You will receive guidance and coaching from our experienced consultants, while benefiting from our vast industry and client experience. Potential research topics include leveraging (generative) AI in Supply Chain Planning, future looking resiliency assessments, Autonomous sourcing, near\\-shoring impact on Supply chain design, Generative AI on Supply Chain Management, or other technologies influencing Sustainable Supply Chains. A specific topic will be co\\-created based on input by industry leaders and academic relevance, and suggestions based on your interests are highly welcomed.\n  \n\nWithin all our internships, we offer you the opportunity to develop, learn, orient, build relationships and gain insights into what it’s like to work as a consultant. As an employer, we will be as flexible as possible to support your work as well as your academical needs and are happy to help you navigate in the beginning of your career. Therefore, within our recruiting process, we are highly interested in your motivations and academical interest.\n\n **Who we are**\n\n\nIn today’s world, business leaders want to reinv", "source": "indeed"}, {"company": "Ryan Specialty Group", "job_title": "M&A Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Ryan-Specialty-Group", "job_url": "https://nl.indeed.com/viewjob?jk=8851e3b24faf486a", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-12", "recruiter_email": null, "applicant_count": null, "description": "**Position Summary:**\n\n\nThe Transactional Liability Underwriting Coordinator is responsible for ensuring the efficiency and accuracy of the M\\&A underwriting processes. The role prepares professional documents for underwriters to facilitate smooth review processes, maintains non\\-binding indication letters, insurance policies and binder agreements, and supports the team in various tasks. They gather, organize, and analyze client information, and contribute to accurate submission for deal preparation and taxation filing purposes.**Location:**\n\n\nAmsterdam, Netherlands**What will your job entail?**\n\n\nJob Responsibilities:  \n\n* Supports information gathering and risk analysis, risk, and policy information and prepares accurate documents for deal underwriting and taxation filing.\n* Prepares documents such as non\\-binding indication letters, insurance policies and binder agreements that showcase key information and facilitates review and approval processes.\n* Utilizes established criteria and guidelines to identify potential problems and flags issues for team members, supports informed underwriting decisions by sharing insights on warranties \\& indemnity, tax \\& con s: telephone, third parties and e\\-mails.\n* You’ll help with the development of customer accounts to drive business into TSH Eindhoven and TSH Maastricht properties and to increase market/customer share in all revenue streams.\n* You’ll work within current business strategies and recognizing potential opportunities.\n* From admin to hosting, you’ll do it all. You’ll prepare, update and file all correspondence.\n* You’ll prepare the meeting \\& events functions sheet with completed final and accurate details for our banqueting department.\n* You’ll host meetings together with the banqueting department/stakeholders.\n* You’re responsible for maintaining an effective follow\\-up system to secure business and provide an after sales service in order to secure repeat business.\n* You’ll assist our heroes in Finance to ensure a smooth ride \\- from invoicing down to payments.\n* You’ll compile statistics and reporting for our cluster management and commercial teams.\n* You’ll support with the creation and roll out of the local commercial strategy.\n\n\n**Who You Are:**\n\n\n* You’re currently enrolled in un", "source": "indeed"}, {"company": "Accenture", "job_title": "Internship – Digital Product Strategy (Song)", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Accenture", "job_url": "https://nl.indeed.com/viewjob?jk=443ec9f4faf2dec0", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-05", "recruiter_email": null, "applicant_count": null, "description": "**Internship details**\n\n* Period: 4 – 6 months\n* Hours per week: 40\n* Location: Hybrid (ITO office, Amsterdam and work from home)\n* Start date: September 2026\n  \n\nWe’re opening our doors to great people who are excited to work with the world’s biggest brands on their toughest growth challenges. Accenture Song’s Design \\& Digital Products team is looking for a proactive intern! In our team, we create new products and reimagine existing ones to deliver better experiences for users and businesses. We are part of Accenture’s creative engine called Accenture Song, where we combine creativity, technology, and business insights to create experiences that drive real impact.\n\n  \n\nWe offer two internship tracks:\n\n* Thesis Internship \\- focused on conducting research and writing your master thesis within the domain of Digital Product Strategy.\n* Working Internship \\- focused on gaining hands\\-on consulting experience by actively contributing to client work, innovation initiatives, and internal capability building.\n **Team :**\n\n\nThe Design \\& Digital Products team is part of Accenture Song. We’re an all\\-star team of growth strategists, creative designers, and product builders who thrive on turning bold ideas into impactful realities. We think, we plot, and we create products and experiences that help our clients solve problems and unlock new values. Our work spans the full product lifecycle: from envisioning future\\-fit strategies and building prototypes to launching products and scaling capabilities. Whether it’s crafting digital products that people love or improving business performance through technology, data and AI, we are passionate about building experiences and bridging the gap between brand promise and expectations.\n\n **Daily tasks**\n\n**Thesis Internship**: In this role, the focus will be on writing your master thesis in the relevant domain of Digital Product Strategy. In doing so, you’ll be supported by the dedicated people in our team. Alongside your thesis, you’ll have the opportunity to gain hands\\-on experience in the Design \\& Digital Products domain at Accenture Song and explore the world of consultancy.\n\n  \n\nWe’ll collaborate with you to define a thesis topic that aligns with our business needs, but most importantly, that interests and motivates you. Examples of research topics include, but are certainly not limited to:\n\n* Agentic AI to shape the future of Digital Product Strategies\n* Build Custom AI Agents that drive Product Creation\n* Vibe Coding\n* The Reinvention of Human\\-AI Interaction\n**Working Internship**:\n\n\nAs a working intern, you’ll become part of our day\\-to\\-day consultancy environment and contribute directly to our work, innovation initiatives, and capability development within the team. Think of collaborating with teams on client projects, conducting market and data research to support analyses and recommendations, preparing workshops and presentations, and contributing to new propositions, trends, and innovation initiatives", "source": "indeed"}, {"company": "KARL LAGERFELD", "job_title": "Retail Facilities Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Karl-Lagerfeld", "job_url": "https://nl.indeed.com/viewjob?jk=e6ad2dc2cf350f64", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-05", "recruiter_email": null, "applicant_count": null, "description": "Amsterdam (HQ), North Holland\nInterns – Retail \\& Operations (HQ) /\nInternship /\nHybrid\n\n**ABOUT THE BRAND**\n\nAt Karl Lagerfeld, we are driven by Karl’s mantra: “Embrace the present and invent the future.”\n\nAlways contemporary and forward\\-looking, the House of KARL LAGERFELD shares the creative vision and design aesthetic of its iconic founder, Karl Lagerfeld.\n\nWe are the only fashion house that carries Karl’s name on its door and we strive to live up to this responsibility in everything we do, every day, with the utmost joy and passion.\n\nOur headquarters in Paris and in Amsterdam are home to a highly diverse and driven team of KARL family members that hail from over 35 countries. Together, we aim to create meaningful stories and product concepts that connect to Karl’s world and iconic attributes.\n\nWomen’s \\& Men's ready\\-to\\-wear, bags, small leather goods, swimwear and underwear are managed directly from our Amsterdam headquarters, while other categories, including footwear, fragrances, eyewear and more, are developed with best\\-in\\-class licensing partners.\n\nWe connect with our consumers on multiple levels, ensuring that our online and offline approach goes hand in hand. We thrive to maximize consumer engagement via more than 200 KL stores worldwide, our premium wholesale partners, and our strong digital footprint, spearheaded by our karllagerfeld.com flagship store, which reaches 96 countries. Our digital channels currently represent more than 30% of our overall full\\-price business.\n\nWe are a dynamic, fast\\-growing and inclusive company built on professionalism and strong values. At KARL LAGERFELD we’re committed to working toward the highest standards of sustainability and integrity across all areas of our business. In 2019, KARL LAGERFELD joined as a founding member of the Fashion Pact, a global sustainability initiative seeking to transform the fashion industry through objectives in three areas: climate, biodiversity and ocean protection. **The Role**  \n\n  \n\nThe Retail Facilities Intern will support the Store Development team in coordinating maintenance, minor works, and operational processes across retail stores. The role involves contributing to technical documentation, data tracking, and reporting, as well as supporting contractor coordination and inventory management.  \n\n  \n\nWorking closely with cross\\-functional teams, the intern will help ensure consistent, high\\-quality execution of the brand image by maintaining accurate data, supporting project follow\\-up, and contributing to Health \\& Safety and store development initiatives, in line with brand guidelines, strategy, and timelines.\n\n\n### **Responsibilities:**\n\n**Main tasks:**  \n\n* Support the coordination of maintenance, minor works, and contractor activities across retail stores, ensuring quality and brand standards\n* Maintain and develop technical databases, including documentation for furniture catalogues and HVAC assets\n* Track and manage maintenance data in reporting tools ", "source": "indeed"}, {"company": "Accenture", "job_title": "Data & AI Thesis Internship - Visualization & Interaction Science", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Accenture", "job_url": "https://nl.indeed.com/viewjob?jk=577278a6a0f00ba6", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-01", "recruiter_email": null, "applicant_count": null, "description": "Data \\& AI Thesis Internship – Visualization \\& Interaction Science\n\n\nGraduation Internship overview:\n\n* Period: 5 – 9 months (flexible)\n* Hours per week: 32–40\n* Location: ITO office Amsterdam, hybrid\n* Start date: From Sep 2026 , start month flexible\n* Education level: Academic Master\n* Internship compensation: 500 euros / month\n\n\nSummary\n\n\nDo you want to combine strategy, data, AI, and design to help organizations become insight\\-driven? Do you have strong analytical skills, an eye for user\\-centric design, and a passion for translating complex data into interfaces people trust and act on? Are you looking for an internship where you work at the intersection of data, business, and visualization?\n\n\nAccenture offers a full\\-time graduation internship of 5 to 9 months within our Visualization \\& Interaction Science team in Amsterdam, part of Strategy \\& Consulting. Whether you already have a thesis topic in mind or are still exploring, we are eager to shape one together that matches your interests and our clients' most pressing challenges.\n\n\nYour role\n\n\nAs an intern in our Data \\& AI team, you will draw on expertise across data, analytics, AI, and human\\-centered design. Together, we will shape your internship around topics that push the boundaries of how organizations engage with data – moving beyond static reporting toward AI\\-enabled analytics and decision support.\n\n\nWe are particularly interested in exploring new strategies and techniques with you, such as:\n\n* Defining data visualization  Transformation \\& Change management\n\n\n\n“Working alongside a high\\-performing transformation team gave me the intensity and learning curve I was looking for – you’re not treated like ‘just an intern’, but like a junior inhouse consultant with real business impact from day one.”\n\n\n\nThe internship\n\n\n\nAre you ambitious, analytical, and eager to work in a fast\\-paced, high\\-performance environment? This internship is for students with a strong foundation in Business, Economics, Data Science or Engineering, who want to sharpen their consulting mindset. Join our Program Change and Transformation team and contribute directly to operational excellence and strategic program execution.\n\n\n\nYou’ll work hand\\-in\\-hand with the Change \\& transformation team, and regularly engage with the broader programm team. Your tasks will include:\n\n\n* Analytics: creating high\\-quality ad hoc analyses from systems such as ServiceNow, Jira, Power BI, and Excel to support key transformation programs;\n* Dashboarding: building operational dashboards and KPI overviews to support senior decision\\-making;\n* Facilitation: independently organizing and managing online workshops, team engagement sessions, and events with precision and polish;\n* Agile support: helping the team maintain program rhythm, communication, and execution momentum.\n\n\nYou will step into an internship that mirrors the dynamics and pace of top\\-tier digital transformation work in a top\\-tier CPG multinational giant. You’ll need to think fast, deliver fast, and adapt quickly \\- this is a real environment, with real expectations, and real opportunities to shine.\n\n\n\nDuring your internship you will get the opportunity to get to know HEINEKEN as a company, also outside your department. We give you the trust and freedom, so you can work like a real entrepreneur. We like to bring the outside world inside and therefore we embrace new, fresh ideas with enthusiasm. Of course always with the guidance that is right for you.\n\n\n\nThe department\n\n\n\nOur Change and Transformation team is the engine room of change. We support the business in delivering key digital transformation program, being a custodian oh Change management methodology in digital transformation and managing People side of the change. The team is small, high\\-caliber, and performance\\-driven, making it a unique environment for those who thrive on structure, ownership, and strategic impact. You’ll be part of a dynamic ecosystem where cross\\-functional collaboration is key and speed is non\\-negotiable.\n\n\n\nThe terms of employment\n\n\n* Your starting date is 1 September 2026\n* The internship is fulltime\n* The duration of the internship is 5 or 6 months (in consultation with your internship supervisor)\n* It is a practice\\-oriented internship\n* You will be based in Amsterdam\n* During your internship, you have the flexibility to work in a hybrid setup (expect 3 office days)\n* You will receive an internship fee of €650 gross pm based on 40 hours per week\n* ", "source": "indeed"}, {"company": "Dentsu", "job_title": "Intern Marketing & Communications", "location": "Rotterdam, ZH, NL", "careers_url": "https://nl.indeed.com/cmp/Dentsu-8", "job_url": "https://nl.indeed.com/viewjob?jk=7ca3eb56a69e6b58", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-19", "recruiter_email": null, "applicant_count": null, "description": "The purpose of this role is to provide real\\-world experience, learning industry technical and professional skills, abilities and activities to contribute to the Dentsu network.**Job Description:**\n\n\nDo you want to learn how creativity, data and technology come together in marketing?\n\n\nAre you curious, creative and always online? Do you not only want to create content, but also understand why it works? And would you like to do that in an international marketing and CXM\\-agency where innovation and AI play a major role? Then this Marketing \\& Communication internship at Merkle Netherlands is for you.\n\n**What will you do?**\n\n\nAs a Marketing \\& Communication intern, you will be fully involved in our marketing team. You will have the opportunity to discover different sides of (digital) marketing and develop yourself quickly.\n\n* You manage our social media channels from A to Z: from content planning to posting and optimization;\n* You write catchy social copy and create visuals (experience with tools such as Figma, Adobe or CapCut is a plus – but we also like to teach you);\n* You keep our internal digital signage\\-system up\\-to\\-date, so that colleagues always know what is going on;\n* You work together with colleagues from the Netherlands and other countries within Merkle and dentsu;\n* You will help organize (online and offline) events, such as Agency at Night – from concept to execution;\n* You monitor and analyze marketing results (such as reach, engagement and growth) and learn how data makes marketing smarter;\n* You will develop your marketing and AI\\-skills through training courses and modules from our knowledge base;\n\n**Your ideas count**\n\n\nDo you have a creative idea for content, a new format or smart use of AI? Then you get the space at Merkle to work this out and test it.\n\n\nFréderique Hondelink, Marketing Management Master student at Erasmus University Rotterdam \\& former marketing intern 2025/2026: “*There’s a lot of room to bring your own ideas and initiatives, which really made my experience at Merkle special. For example, I had the opportunity to set up a content co\\-creation program and explore how AI can support more effective copywriting. This, combined with the open and*\n\n*supportive atmosphere, makes it a place where you can quickly learn and grow in marketing and CXM*!”\n\n**Who are we looking for?**\n\n\nYou don't have to be an all\\-rounder yet – more important is that you are eager to learn and eager to get started.\n\n* You are a college or university\\-student (at least 2nd year) in Marketing, Communication, Media or a similar direction;\n* You are interested in marketing and social media and want to learn a lot about it;\n* You enjoy writing and creating creative content;\n* You are curious about new tools and technologies, such as AI;\n* You work independently, take initiative and dare to ask questions;\n* You are fluent in Dutch and preferably also English;\n* You will be available at least 4 days a week from September 2026\\.\n\n**What do we o", "source": "indeed"}, {"company": "Philips", "job_title": "Intern Consultancy data modelling", "location": "Eindhoven, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Philips", "job_url": "https://nl.indeed.com/viewjob?jk=b87b101956664f3f", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-18", "recruiter_email": null, "applicant_count": null, "description": "### **Job Title**\n\nIntern Consultancy data modelling\n### **Job Description**\n\n**Start Date: As of June 2026**\n\n**Duration: at least / 6 months**\n\n**Type: Internship (non\\-thesis)**\n\n**Weekly Presence: 40h (minimum 32h)**\n\n**Location: Best**\n\n**Internship Title**\n\nInternship Data science and analytics in healthcare consultancy services  \n\n  \n\n\n\n**Your role:**\n\nCreate efficiency by making available data usable and create models to make the usage smarter and faster.\n\n\nLearn and develop yourself by being part of a professional team that has a central position in the organization providing consultancy services around the globe. Learn more about healthcare planning and design of hospitals. This is your opportunity to help us transform our data into meaningful information and build smart models to do scenario planning.\n\n\nYou will support us to organize our data from different internal and external sources. Together with our senior consultants build scenarios to the most urgent needs of our customers. Analyze current models/tools and update accordingly.\n\n\n* Creation of data hub of current available information\n* Analysis of internal Philips data\n* Open\\-source information gathering and analysis to strengthen and update baseline\n* Build Capacity calculation models to automate\nBuild models to link outcome of capacity requirements into space \\& technology requirements  \n* \n\n  \n\n**You're the right fit if:**\n\n* You are studying towards your University Master in: Mathematics, Statistics, Data Sciences, Computer Science, Analytics, Engineering, or a related field.\n* Experience in analysing large sets of data in the Healthcare, Finance, Insurance, or other related highly regulated industry.\n* Experience with data mining methods, statistical analysis, \\& data visualization methods utilizing tools such as JMP, SAS, SPSS, etc.\n* Experience with databases such as MySQL, MS SQL Server, MS Access, SQL Workbench, etc.\n* Experience with tools such as Tableau, Qlik, Excel, etc.\n\n**How we work together**\n\nWe believe that we are better together than apart. For our office\\-based teams, this means working in\\-person at least 3 days per week. Onsite roles require full\\-time presence in the company’s facilities. Field roles are most effectively done outside of the company’s main facilities, generally at the customers’ or suppliers’ locations.\n\n\n**We offer you:**  \n\nA non\\-stop growth opportunity within a global multinational company. In addition, we also want to renumerate you well for the opportunity. This includes:\n\n\n* Monthly full\\-time allowance between €500 \\- €700 gross, depending on your education level and if you need to relocate to The Netherlands. Part\\-time internships receive the allowance pro\\-rata.\n* Housing compensation. Should you need to relocate to near our office, we’ll offer you a monthly allowance of €300,\\- net if location is in the vicinity of Amsterdam, €255,\\- net for all other Philips locations. To be eligible, we’ll just ask for the rental contract f", "source": "indeed"}, {"company": "XEBIA", "job_title": "Delivery Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Xebia", "job_url": "https://nl.indeed.com/viewjob?jk=d7bf9a79bd973def", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-07", "recruiter_email": null, "applicant_count": null, "description": "### **Does This Sound Like You?**\n\nYou're curious about how IT consultancies actually run — not just the tech, but the engine behind it. You like the idea of sitting close to the action: where projects get scoped, consultants get staffed, finances get tracked, and delivery leads make calls that keep clients happy and engagements healthy.\n\n  \n\nYou want an internship where you're not making coffee or shadowing from the sidelines. You want to own real work, see your impact, and walk away genuinely understanding how a modern data consultancy operates from the inside. Bonus points if you genuinely get excited when a messy spreadsheet turns into a clean dashboard, or when a process that used to take three people now takes one click.\n\n### **The Xebia Data Division**\n\n\nXebia Data is one of the divisions of Xebia Netherlands, which is renowned for its expertise in building strong Data and AI practices to deliver value to our clients. In the past, our team has predicted daily bread demand for millions of loaves, built advanced energy\\-saving algorithms at a national scale, and established data innovation labs at large multinational companies!\n\n\nYou’ll work with the sharpest data professionals in Europe, people who are not only technically brilliant but also generous with their knowledge. We enjoy the benefits of being part of a large organization while maintaining the energetic atmosphere of a scale\\-up. Our commitment to our community is strong; we are deeply rooted in the local landscape.\n\n\n### **What You’ll Be Doing To Make Organizations Data\\-Driven**\n\nYou'll join the **Delivery practice**, working directly with our Head of Delivery and our Delivery Leads. The role splits roughly **50/50** between hands\\-on delivery support and a research project of your own.\n\n **Half your time: supporting the delivery practice.** You'll work shoulder\\-to\\-shoulder with the Delivery Leads to keep our engagements running smoothly. That means:  \n\n  \n\nEvery engagement we run has a paper trail behind it — and you'll be the one shaping a lot of it. **Kickoff decks** that set the tone with a new client, **status reports** that keep stakeholders honest, **closeout materials** that capture what we built and what we learned. You'll take rough inputs from a Delivery Lead and turn them into something sharp enough to land in a client's inbox.  \n\nAlongside that, you'll handle **delivery\\-side finance tasks**: tracking spend against budget, supporting invoicing cycles, and flagging variances early so they can be addressed before they become problems. You don't need to be a finance whiz on day one, but you'll leave knowing how a consultancy actually makes (and loses) money on a project.  \n\n  \n\nYou'll also be the connective tissue between **sales and our consultants** — coordinating when new engagements come in, making sure the handover from sale to delivery happens cleanly, and chasing down the small details that otherwise fall through the cracks.  \n\n  \n\nAnd finally, you'll be one of", "source": "indeed"}, {"company": "Clairfield", "job_title": "Application internship - Clairfield Netherlands", "location": "Amsterdam Oost, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Clairfield", "job_url": "https://nl.indeed.com/viewjob?jk=8acc8e9865c9ff19", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-27", "recruiter_email": null, "applicant_count": null, "description": "Clairfield Netherlands, headquartered in Amsterdam, is an independent corporate finance boutique and part of Clairfield International. Clairfield International is a partnership of leading corporate finance firms in 25 countries around the world, advising a wide range of clients such as private equity, entrepreneurs and corporate clients, on mergers \\& acquisitions, capital raises and other corporate finance issues.\n\n\n\nWe are growing rapidly and are always looking to add the next talent to the team. The team consists of young, dynamic and enthusiastic professionals who have a breadth of experience with strong and relevant track records.\n\n\n**Taken**\n---------\n\n\n\nYou will become an integral part of a dynamic team of seasoned M\\&A professionals and get broad exposure to origination and execution of M\\&A transactions across a wide range of sectors. You will particularly spend time on:\n\n\n* Financial modelling and company valuation;\n\n\n* Preparing pitch documents and information memoranda;\n\n\n* Performing market analyses and researching industry trends.\n\n\n\nWe also offer an academy program on modelling, valuation, deal structuring and more. In addition to developing strong technical skills, we place great value on a positive and strong team culture: we often wrap up the week with drinks together, either at the office or in a cafe.\n\n\n\nSuccessful interns may be offered the chance to join the team as full\\-time analyst.\n\n\n**Vereisten**\n-------------\n\n\n\nYou are in the final stages of your MSc studies or recently graduated, preferably with a background in (business) economics, finance, engineering, econometrics or related and are available for 4 to 6 months.\n\n\n\nYou have proficiency in both English and Dutch, a hands\\-on attitude, positive energy and proven affinity with the financial world. Moreover, you have an entrepreneurial mindset and strong numerical and communication skills.", "source": "indeed"}, {"company": "LELY", "job_title": "Internship: Data Analysis on Milking Data", "location": "Maassluis, ZH, NL", "careers_url": "https://nl.indeed.com/cmp/Lely", "job_url": "https://nl.indeed.com/viewjob?jk=04890e4ceb1ef92d", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-25", "recruiter_email": null, "applicant_count": null, "description": "**Company Description**  \n\nWe believe in a sustainable, profitable, and enjoyable future for dairy farmers by combining robotics, engineering, and in‑depth farming knowledge.\n\n\nThat belief started 75 years ago with the dream of two brothers in Maassluis. Since then, we have grown into an innovative global leader in automated systems for dairy farmers worldwide. With 2,500 specialised professionals, we continuously work on new agricultural revolutions. We still do this from our Campus in Maassluis, a building with the highest achievable sustainability performance in the Netherlands, and among the best worldwide. All with one clear goal: to make dairy farming an attractive profession for future generations.\n\n **Job Description**  \n\nDuring this internship, you will turn complex milking data into clear insights. You will create visualizations and perform statistical analyses to investigate whether milking performance has improved over time and under which conditions.  \n\nYou will work closely with different stakeholders, such as data analysts, product specialists, and domain experts, to understand the right questions to ask and to ensure your analyses are relevant and actionable. This means translating business and farm questions into analytical approaches and explaining your results in a clear and convincing way.  \n\nA key part of your role is critical analysis on big data. You will assess data quality, challenge assumptions, validate findings, and reflect on limitations of the data and methods used. You will not just report results but actively think about what they mean in practice and how they can be improved.  \n\n  \n\n**Practical information:**\n\n* This can be a collaborative or graduation internship.\n* You are available from September 1st, 2026 (or earlier), for a minimum of 6 months\n* You are available at least 32 hours per week\n\n  \n\n**Qualifications**  \n\nAs an intern, you will dive into live milking data coming straight from the Astronaut. Every single day, millions of milking records flow in from farms across the globe. During this internship, you will explore how this rich stream of data connects to real farm management practices. Your analysis will help uncover patterns, insights, and opportunities that can directly support farmers in improving their operations. How do you know whether any actions are for the better for the cow? There is no direct feedback, only signals hidden in data. Your task is to turn this data into meaningful insights to define what “better” really means from the cow’s perspective. You will be working on real\\-world data with real impact, on a global scale.  \n\n  \n\n**Requirements:**\n\n* You are currently following an HBO Bachelor program such as Business and Data management, Biosystems engineering, Agrotechnology or similar studies.\n* You have strong analytical and communication skills.\n* You are a critical thinker.\n* You are proactive, structured and comfortable working independently.\n* You have knowledge with SQL, Python,", "source": "indeed"}, {"company": "Philips", "job_title": "AI & Cyber Threat Intelligence Intern", "location": "Best, NB, NL", "careers_url": "https://nl.indeed.com/cmp/Philips", "job_url": "https://nl.indeed.com/viewjob?jk=42b820dec34cf9e1", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-19", "recruiter_email": null, "applicant_count": null, "description": "### **Job Title**\n\nAI \\& Cyber Threat Intelligence Intern\n### **Job Description**\n\n**Start Date:** **As of Ju** **ly** **2026**\n\n**Duration: at least / 6 months**\n\n**Type: Internship (non\\-thesis)**\n\n**Weekly Presence: 40h (minimum 32h)**\n\n**Location: Best**\n\n**Internship Title**\n\n**AI \\& Cyber Threat Intelligence Intern**\n\n**Your role:**\n\n* Assist in the development, fine\\-tuning, and deployment of AI and LLM\\-based tools designed to enhance cyber threat intelligence operations.\n* Research and evaluate cutting\\-edge AI methodologies, including generative AI, agentic systems, and automated reasoning for cybersecurity applications.\n* Support the automation of cyber threat intelligence collection, analysis, and reporting processes.\n* Collaborate with cybersecurity analysts and data scientists to understand operational requirements and translate them into effective AI solutions.\n* Document processes, methodologies, and findings clearly for stakeholders and internal knowledge bases.\n* Engage proactively in team discussions and brainstorming sessions to foster innovative approaches to cyber threat challenges.\n**You’re** **the right fit if:**\n\n* Pursuing or recently completed a degree in Computer Science, Cybersecurity, Data Science, AI, Machine Learning, or related technical fields.\n* Strong academic background with foundational knowledge in AI and machine learning techniques.\n* Familiarity with LLMs (e.g., GPT models), generative AI, or similar technologies.\n* Programming experience with Python or similar languages.\n* Understanding of cybersecurity principles and cyber threat intelligence concepts is beneficial but not mandatory.\n* Excellent analytical, problem\\-solving, and communication skills.\n* Ability to quickly learn and apply new technologies and methodologies.\n**How we work together**\n\nWe believe that we are better together than apart. For our office\\-based teams, this means working in\\-person at least 3 days per week. Onsite roles require full\\-time presence in the company’s facilities. Field roles are most effectively done outside of the company’s main facilities, generally at the customers’ or suppliers’ locations.  \n\n\n\n**We offer you:**  \n\nA non\\-stop growth opportunity within a global multinational company. In addition, we also want to renumerate you well for the opportunity. This includes:\n\n\n* Monthly full\\-time allowance between €500 \\- €700 gross, depending on your education level and if you need to relocate to The Netherlands. Part\\-time internships receive the allowance pro\\-rata.\n* Housing compensation. Should you need to relocate to near our office, we’ll offer you a monthly allowance of € 300,\\- net if location is in the vicinity of Amsterdam, € 255,\\- net for all other Philips locations. To be eligible, we’ll just ask for the rental contract from your landlord, and your usual home\\-work travel distance needs to be more than 50 km or 1\\.5 hours of travel time (for a one way trip).\n* Travel compensation, if you are not eligible fo", "source": "indeed"}, {"company": "Abbott", "job_title": "Business Analyst Internship", "location": "Heerlen, LI, NL", "careers_url": "https://nl.indeed.com/cmp/Abbott", "job_url": "https://nl.indeed.com/viewjob?jk=1e9935345dd1df3a", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-18", "recruiter_email": null, "applicant_count": null, "description": "**ABOUT ABBOTT**\n\n\nAbbott is a global health care company devoted in improving life through the development of products and technologies in health care. With a portfolio of leading, science\\-based offerings in diagnostics, medical devices, nutritional and branded generic pharmaceuticals, Abbott serves people in more than 160 countries and employs approximately 110,000 people.\n\n\nDuring an internship at Abbott, you will learn about all details of our businesses. Abbott offers an all including internship with a diverse choice of training and personal coaching during your internship. Furthermore, you become part of a successful and valued organization which is a key player in the future of healthcare.\n\n\nDivided over the Dutch Abbott locations in Heerlen, Zwolle, Olst, Weesp, Breda, Hoofddorp and Veenendaal, Abbott offers a variety of internships.\n\n **ABOUT ABBOTT VASCULAR NETHERLANDS (AVN)**\n\n\nAbbott Vascular Netherlands in Heerlen, The Netherlands, is one of the two Abbott Vascular Tier 1 distribution centers responsible for the worldwide distribution of Abbott’s vascular products. From our 10,000 m2 warehouse we ship an average of 1,950 deliveries per day (\\>750,000 units per month) to hospitals, Abbott distributors and Abbott affiliates in Europe, Middle East, Africa and South America.\n\n\nWe do not only ship international on a global scale, also our 200 employees working in the warehouse and office departments come from all over the world. Making us a company of inclusion and diversity. Together as 1 team we make sure that we process customer orders, maintain a high service level to ensure that our customers receive the right products on time. Abbott Vascular Netherlands offers a complete and high standard Supply Chain solution, including an extensive range of value\\-add logistics activities such as labeling, relabeling and reworking of products to meet country specific needs.\n\n**WHAT WILL YOU FOCUS ON DURING YOUR INTERNSHIP?**\n\n\nYour assignment as a Business Analyst Intern will be dynamic, meaningful, and impactful. You will work closely with our Analyst team members on a project that combines data analytics, business intelligence, data architecture and programming (SQL). The goal is to create a live dashboard with a robust data architecture structure that provides real\\-time insights into our operations, helping us make data driven decisions and improve efficiency.\n\n**What makes this exciting?**\n\n* You won’t just analyze data: you’ll **create a structure that will influence global operations**.\n* You’ll learn how to **translate business needs into actionable insights**.\n* You’ll gain hands on experience with **Power BI** and Fabric **Business Objects**.\n* You’ll collaborate with experienced professionals, learning about **stakeholder management**, **KPI development**, and **performance measurement** in a Tier 1 distribution center.\n\n\nThis is a team effort: you will not work alone. We will guide you, coach you, and ensure you have the support need", "source": "indeed"}, {"company": "IT Solutions Worldwide", "job_title": "Supply Chain Analyst Intern", "location": "Rotterdam, ZH, NL", "careers_url": "https://nl.indeed.com/cmp/IT-Solutions-Worldwide", "job_url": "https://nl.indeed.com/viewjob?jk=7daa9976fb8330cb", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-15", "recruiter_email": null, "applicant_count": null, "description": "**Internship: Supply Chain Analyst Intern**\n\n**Location:** Mignonpad 10, 3194VH Hoogvliet Rotterdam, Netherlands\n\n\n**Duration:** 3 to 6 months\n\n\n**Type:** Internship\n\n\n**About IT Solutions Worldwide**\n\nAt IT Solutions Worldwide BV, we keep businesses moving forward with smart tech, bold ideas,\n\n\nand a passion for automation. We help companies work faster, better, and smarter within their\n\n\noperations. Our team is a self\\-starting, dynamic group of great minds who thrive by finding the\n\n\nbest possible solutions for our clients.\n\n\nWe are an international team with offices in the Netherlands and Asia, bringing together creative\n\n\nminds and subject experts from around the world. Whether it's optimizing operations or\n\n\nimplementing automations, we support our clients throughout their journey to grow.\n\n\nIf you are ready to learn, grow, and create real impact, you are going to love being part of our\n\n\nteam.\n\n\n**About the Internship**\n\nCurious about how supply chains run behind the scenes?\n\n\nAs a **Supply Chain Analyst Intern**, you will work alongside professionals who analyze,\n\n\nmanage, and improve the flow of goods and data across organizations. You will assist in\n\n\neverything from forecasting to reporting, while developing a strong foundation in logistics and\n\n\noperations.\n\n\n**What You Will Learn**\n\n* How to assist in demand forecasting and inventory management\n* How to collect and analyze procurement, logistics, and supplier performance data\n* How to use Excel and ERP tools to structure operational information\n* How to prepare reporting documents and presentations for internal stakeholders\n* How to support team meetings, performance reviews, and improvement planning\n* How to apply process thinking to find efficiency gaps\n* How to collaborate with other departments (sales, finance, admin) for operational\n\nalignment\n\n\n* How to work within compliance standards for European supply chain practices\n**You are a Great Fit If You Are:**\n\n* A student or recent graduate in Supply Chain, Logistics, Business Analytics, or a related field\n* Analytical, organized, and interested in operational systems\n* Interested in data\\-driven work and process improvement\n* Comfortable managing time independently and meeting project deadlines\n* Open to working in a collaborative, multicultural team environment\n\n**What We Offer**\n\n* Practical experience in international supply chain workflows\n* Tools, templates, and training to support your growth\n* A company laptop\n* Mentorship from experienced professionals in our Rotterdam office\n* A friendly and collaborative international team\n* A certificate of internship completion and LinkedIn recommendation\n* Room to bring in your ideas\n* Fun company outings\n* Friday lunch\n* Exposure to modern ERP systems and reporting dashboards\n* A flexible, structured work environment that supports personal learning goals", "source": "indeed"}, {"company": "Kraft Heinz", "job_title": "Global Finance Analyst CAPEX Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/Kraft-Heinz-3e502a27", "job_url": "https://nl.indeed.com/viewjob?jk=4eca76a192fba378", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-08", "recruiter_email": null, "applicant_count": null, "description": "**Job Description**\n-------------------\n\nAt The Kraft Heinz Company we have an outstanding learning opportunity for an enthusiastic Bachelor or Master student who is interested in making a difference in Global Finance!\n\n\nAs CAPEX Finance Analyst intern, you will be generating and analyzing reports, assist in the preparation of financial reports, and conduct financial analyses.\n\n\nIn Kraft Heinz you’ll be the owner of your ideas and of your career. We offer an upbeat and innovative work environment. Besides from your daily tasks, you are motivated to speak up and generate new insights. We appreciate a new perspective!\n\n\n**Summary**\n\nAs a Global Finance Analyst Capex Intern you will assist in managing finance processes the Global entity overseeing all Zones , providing information and guidance on various financial rituals and routines, monthly performance reviews, financial reviews, and forecasting. You will also support ad\\-hoc requests and analysis, ensure data availability and accessibility, and own HFM inputs for World Headquarters. Additionally, you will be the point of contact for the Capex management tool.\n\n\n**Key responsibilities**\n\n* **Perform routine tasks** including maintaining of Forecast file for the monthly, quarterly, and annual business cycles for the reporting and analysis of the business; Compiling and preparing presentation slides for monthly performance and forecast reviews; Preparing and submitting monthly requests from Global entity . Align the monthly closing comparing with source of truth.\n* **Budgeting and Forecasting of** **Capex** \\- Work with Analysts across the business and throughout the budget/forecast process\n* **Provide ongoing financial support and analysis to** **Head of SCF and Capex lead** **as well as executives in** **Global entity** **\\-** Provide key financial analysis for decision making; Modelling and scenario building; Provide Capex analysis and other regular reporting decks; Provide support on ad hoc analyses\n* **Identify** **areas of improvement of key business processes and drive changes to processes as** **required** \\- Make recommendations and drive through for rtment in ASML, CE plays a crucial role in supporting informed decision‑making by translating complex financial and operational data into clear, coherent insights for management.\n\n\nAs an intern at ASML within the CE department, you contribute right away as a valued team member to real business topics in a dynamic, international environment.  \n\n  \n\n\n\n**Your assignment**\n-------------------\n\nWe are looking for four interns within the Capital Efficiency team in Veldhoven who are available for at least 32 hours per week. Each intern will work as a full member of the team. In all four roles, you will have end\\-to\\-end responsibility for reporting tasks as well as performing ad\\-hoc analyses, recurring projects, and providing team support.\n\n\nEach of the four internships is aligned with a specific expertise team. You will work primarily with your own expertise team, however, you will also be in regular contact with the other teams mentioned.\n\n\nThe four encompassing roles are:\n\n\n* **Role 1** : General role with a broad scope on Working Capital, Cashflow and Balance Sheet control. Your main tasks will be to conduct consolidated\\-like analyses on the beforementioned topics. Further work/analysis is conducted on key company metrics and KPI’s (e.g. Return on Average Invested Capital, Cash Conversion Cycle and Cash Conversion Rate). This role works frequently with other teams (Inventory, CAPEX, Sales (BI\\&C CV), Procurement (BI\\&C SS\\&P), Treasury and Tax teams), and combines all the individual drivers into combined and coherent insights for the higher levels of management. Given the broad and consolidated scope of this role, we are looking for a candidate with a solid, well\\-balanced financial/accounting background, rather than a deep functional specialist. Looking for somebody that is interested in the broader picture, connecting the dots and translating data into a story.\n* **Role 2** : CRE Control internship role, which encompasses support in CA  PowerBI , SharePoint etc.) and how those tools integrate into other functional work processes.\n* You have excellent soc", "source": "indeed"}, {"company": "The Social Hub", "job_title": "Learning Design Intern", "location": "Amsterdam, NH, NL", "careers_url": "https://nl.indeed.com/cmp/The-Social-Hub-1", "job_url": "https://nl.indeed.com/viewjob?jk=11e1fcd77778ae8d", "visa_support": null, "relocation_support": null, "date_posted": "2026-05-27", "recruiter_email": null, "applicant_count": null, "description": "As our new Learning Design Intern, you'll help create impactful learning experiences that empower our diverse, international community of team members. Whether it's designing a sleek e\\-learning module, co\\-writing an onboarding guide or a training script, developing hand\\-outs or toolkits, or helping organize a photo and film shoot for a new training – this internship is your chance to put creativity into action.\n\n\n\nYou'll work within the TSH Academy (Learning \\& Development team) and will work closely with the wider People \\& Culture department to shape the learning experiences of our team members across our 21 locations. You'll also support in bringing new onboarding journeys to life and support our product owners in the creation of digital learnings on our Learning Management System (Sana), all while exploring new formats to make learning fun, inclusive, and unforgettable. Expect to bring your ideas to life and make a real impact on how we help our people grow across Europe.\n\n\n\nThis internship is perfect for someone who's curious, creative, and excited about learning, design, and storytelling. If that sounds like you, we'd love to hear from you. You will join the team at our headquarters in Amsterdam for a period of 5\\-6 months, **starting September 2026\\.**\n\n\n**In Case You Don't Know Who We Are**\n\n\n\nKnown for being the rule breakers in hospitality, TSH is a fun, creative and inspiring environment where everyone can work, stay, learn
